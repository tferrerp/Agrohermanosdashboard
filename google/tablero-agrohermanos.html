VIEW_FN.nomina = R => {
  const M = model(), cfg = M.cfg, hoy = M.hoy;
  const head = `<div class="section-h"><p>Lo que le debes a cada trabajador. Cada remisión que se carga suma sus rastras por la tarifa de aserrada o arriada; cada pago lo baja. Les pagas los sábados. Esta plata ya está dentro del costo real de la madera, así que no se resta otra vez de la utilidad.</p>
    <div class="acts">${M.trab.length ? addBtn('Abono', 'nomina-pago', 'primary sm') + addBtn('Trabajo extra', 'nomina-cargo') : ''}${btn(`${icon('edit')}Trabajadores`, 'data-act="form" data-form="nomina-config"', 'sm')}</div></div>`;
  if (!M.trab.length) return head + card('', emptyState('Configura la nómina', 'Agrega a los trabajadores, qué hace cada uno (aserrada o arriada) y desde qué fecha arranca la cuenta. Desde ese día, cada despacho suma lo que les debes.', btn(`${icon('plus')}Configurar nómina`, 'data-act="form" data-form="nomina-config"', '')));

  const sab = sabadoDe(hoy), dom = addDays(sab, -6);
  const movs = M.nominaMovs;
  const debe = sum(M.trab, t => Math.max(0, M.nominaSaldo.get(t.id) || 0));
  const enR = movs.filter(m => inR(m.fecha, R));
  const dev = enR.filter(m => m.tipo !== 'pago'), pag = enR.filter(m => m.tipo === 'pago');
  const despR = M.despachos.filter(x => inR(x.fecha, R)), despS = M.despachos.filter(x => x.fecha >= dom && x.fecha <= sab);
  const kp = `<div class="kpis">
    ${kpi('Debes hoy', cop(debe), M.trab.map(t => { const v = M.nominaSaldo.get(t.id) || 0; return `${esc(t.nombre)} ${v < -0.5 ? `adelanto ${cop(-v, true)}` : cop(v, true)}`; }).join(' · '), { dot: 'var(--s2)' })}
    ${kpi(`Semana al sábado ${fmtDay(sab)}`, `${num(sum(despS, x => x.rastras))} rastras`, `${despS.length} ${despS.length === 1 ? 'remisión cargada' : 'remisiones cargadas'} desde el ${fmtDay(dom)}`)}
    ${kpi('Nómina del período', cop(sum(dev, m => m.valor)), `${num(sum(despR, x => x.rastras))} rastras despachadas · ya incluida en el costo`)}
    ${kpi('Pagado en el período', cop(sum(pag, m => m.valor)), `${pag.length} ${pag.length === 1 ? 'pago' : 'pagos'}`)}
  </div>`;

  const cards = M.trab.map(t => {
    const s1 = M.nominaSaldo.get(t.id) || 0;
    const mine = movs.filter(m => m.trabajadorId === t.id);
    const ult = mine.filter(m => m.tipo === 'pago').pop();
    const sem = sum(mine.filter(m => m.tipo !== 'pago' && m.fecha >= dom && m.fecha <= sab), m => m.valor);
    const st = s1 > 0.5 ? chip('', `Le debes ${cop(s1, true)}`, 'clock') : s1 < -0.5 ? chip('', `Adelanto ${cop(-s1, true)}`, 'info') : chip('good', 'Al día', 'check');
    return `<div class="client" data-act="trab" data-id="${esc(t.id)}" role="button" tabindex="0" title="Ver el historial de ${esc(t.nombre)}">
      <div class="client-h"><div><b>${esc(t.nombre)}</b><span>${oficioDe(t)} · ${cop(tarifaTrab(t, null, cfg))} por rastra · toca para ver su historial</span></div>${st}</div>

    </div>`;
  }).join('');

  // Pedidos que todavía no se cargan: suman a la nómina el día que salgan.
  const pend = M.porEntregar.map(p => ({ fecha: p.fecha, quien: p.cliente, rastras: p.calc.rastras, id: p.id }));

    const d0 = addDays(s, -6), ms = movs.filter(m => m.fecha >= d0 && m.fecha <= s), ds = M.despachos.filter(x => x.fecha >= d0 && x.fecha <= s);
    let cierre = 0; for (const m of movs) if (m.fecha <= s) cierre += m.tipo === 'pago' ? -m.valor : m.valor;
    semanas.push({ s, d0, rem: ds.length, ras: sum(ds, x => x.rastras), por: M.trab.map(t => sum(ms.filter(m => m.trabajadorId === t.id && m.tipo !== 'pago'), m => m.valor)), pago: sum(ms.filter(m => m.tipo === 'pago'), m => m.valor), cierre });
  }
  const ts = table([

    { h: 'Remisiones', r: 1, f: w => num(w.rem, 0) },
    { h: 'Rastras', r: 1, f: w => num(w.ras) },
    ...M.trab.map((t, i) => ({ h: esc(t.nombre), r: 1, f: w => cop(w.por[i]) })),
    { h: 'Pagado', r: 1, f: w => cop(w.pago) },
    { h: 'Saldo al cierre', r: 1, f: w => `<b class="${w.cierre < -0.5 ? 'pos' : ''}">${cop(w.cierre)}</b>` },
  ], semanas, { empty: '<p>Todavía no hay semanas.</p>' });

  const L = enR.slice().reverse();
  const tm = table([
    { h: 'Fecha', f: m => `<span class="num">${fmtDate(m.fecha)}</span>` },
    { h: 'Trabajador', f: m => esc(M.trab.find(t => t.id === m.trabajadorId)?.nombre || '—') },
    { h: 'Detalle', f: m => m.tipo === 'pago' ? `${chip('good', 'Pago')}<span class="sub">${esc([m.medio, m.detalle].filter(Boolean).join(' · '))}</span>` : m.tipo === 'cargo' ? `${chip('', 'Extra')}<span class="sub">${esc(m.detalle)}</span>` : `${esc(m.detalle)}<span class="sub">${num(m.rastras)} rastras</span>` },
    { h: 'Gana', r: 1, f: m => m.tipo !== 'pago' ? cop(m.valor) : '' },
    { h: 'Pago', r: 1, f: m => m.tipo === 'pago' ? cop(m.valor) : '' },
    { h: 'Saldo', r: 1, f: m => `<b class="${m.saldo < -0.5 ? 'pos' : ''}">${cop(m.saldo)}</b>` },
  ], L, { act: m => editAttr(m.col, m.id), empty: `<p>No hay movimientos en este período${M.desdeN > R.to ? `; la nómina arranca el ${fmtDate(M.desdeN)}` : ''}.</p>` });

  return `${head}${kp}<div class="clients">${cards}</div>${pendNote}
    ${card('Semanas de pago', ts, { sub: `Cada fila va de domingo a sábado. La cuenta arrancó en cero el ${fmtDate(M.desdeN)}.` })}
    ${card('Movimientos', tm, { sub: 'Del más reciente al más antiguo. El saldo es lo que le debes a ese trabajador después de cada movimiento. Toca una remisión para corregirla.', acts: addBtn('Pago', 'nomina-pago') })}`;
};

// Matriz de lo que nos sale cada pieza (medida × largo).
function costoPiezaMatrix(M) {
  const set = new Set(['2x4', '3x4', '3x5', '3x6', '4x4', '4x6', '4x8', '5x5', '5x8', '6x6', '6x8', '6x9', '7x7', '8x8']);
  for (const l of M.d.listas) { const k = Object.keys(l.precios || {}); if (k.length <= 20) k.forEach(x => set.add(x)); }
  const meds = [...set].filter(x => parseMedida(x)).sort(medSort);
  const largos = []; for (let L = 1; L <= 12.5 + 1e-9; L += 0.5) largos.push(+L.toFixed(1));
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Largo</th>${meds.map(m => `<th class="r nt">${esc(m)}</th>`).join('')}</tr></thead>

}

/* ---------- Precios y costos ---------- */
const medSort = (a, b) => { const A = parseMedida(a), B = parseMedida(b); if (!A || !B) return String(a).localeCompare(String(b)); return (A.a * A.b - B.a * B.b) || (A.a - B.a); };
function listaDims(l) {
  const meds = Object.keys(l.precios || {}).sort(medSort);
  const ls = new Set(); for (const m of meds) for (const k of Object.keys(l.precios[m] || {})) if (n(l.precios[m][k])) ls.add(+k / 100);
  return { meds, largos: [...ls].sort((a, b) => a - b) };
}
function calcRows(M, medida, largo, cant) {
  const info = piezaInfo(medida, largo, M.cfg);
  if (!info) return null;
  const rows = M.d.listas.map(l => {
    const pr = listaPrecio(l, medida, largo);
    return { nombre: l.nombre, precio: pr, util: pr - info.costo, margen: pr ? (pr - info.costo) / pr : NaN };
  });
  return { info, rows, cant: Math.max(1, n(cant) || 1) };
}
function calcOut(M, medida, largo, cant) {
  const r = calcRows(M, medida, largo, cant);
  if (!r) return `<p class="muted">Escribe una medida como <b>4x6</b> y un largo en metros como <b>3</b>.</p>`;

    ${kpi('Costo real por pieza', cop(info.costo), `Pinera ${cop(pineraRate(info.L, M.cfg))} + mano de obra ${cop(manoObra(M.cfg))} por rastra`, { cls: 'sm' })}
    ${kpi(`Para ${num(q, 0)} ${q === 1 ? 'pieza' : 'piezas'}`, cop(info.costo * q), `${num(info.rastras * q, 3)} rastras`, { cls: 'sm' })}
  </div>`;
  const t = table([

    { h: 'Precio / pza', r: 1, f: x => x.precio ? cop(x.precio) : '<span class="muted">No está</span>' },

    { h: `Total ${num(q, 0)} pzs`, r: 1, f: x => x.precio ? cop(x.precio * q) : '' },
    { h: 'Utilidad total', r: 1, f: x => x.precio ? signed(x.util * q) : '' },
  ], rows, { empty: '<p>Agrega una lista de precios para comparar.</p>' });
  return head + t;
}

function parseLoose(s) {
  let t = String(s ?? '').replace(/[^\d.,-]/g, '');
  if (!t || t === '-') return 0;
  if (/^-?\d{1,3}([.,]\d{3})+$/.test(t)) t = t.replace(/[.,]/g, '');
  else if (/^-?\d{1,3}(\.\d{3})+,\d+$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+\.\d+$/.test(t)) t = t.replace(/,/g, '');
  else t = t.replace(',', '.');
  const x = parseFloat(t);
  return Number.isFinite(x) ? x : 0;
}

/* ---- líneas de piezas ---- */

  const isR = l.unidad === 'rastra';

    <div class="field f-prod"><label>Medida y largo (m)</label><div style="display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:6px">
      <input data-k="medida" value="${esc(isR ? 'rastras' : (l.medida || ''))}" placeholder="4x6" list="dl-medidas" aria-label="Medida en pulgadas" autocomplete="off">
      <input data-k="largo" class="qty" inputmode="decimal" value="${esc(qtyIn(l.largo))}" placeholder="m" aria-label="Largo en metros"></div></div>
    <div class="field"><label>${isR ? 'Rastras' : 'Cant.'}</label><input data-k="cant" class="qty" inputmode="decimal" value="${esc(qtyIn(l.cant))}" placeholder="0" aria-label="Cantidad"></div>
    ${mode === 'dmg' ? '' : `<div class="field"><label>${mode === 'bbv' ? 'Precio venta' : 'Precio c/u'}</label><input data-k="precio" class="money" inputmode="numeric" value="${esc(moneyIn(l.precio))}" placeholder="$0" data-auto="${n(l.precio) ? 0 : 1}" aria-label="Precio por unidad"></div>`}
    ${mode === 'bbv' ? `<div class="field"><label>Precio sociedad</label><input data-k="pbb" class="money" inputmode="numeric" value="${esc(moneyIn(l.pbb))}" placeholder="$0" data-auto="${n(l.pbb) ? 0 : 1}" aria-label="Precio de sociedad"></div>` : ''}
    <button type="button" class="icon-btn" data-act="rm-line" aria-label="Quitar pieza">${icon('x')}</button>
    <div class="lsub" data-sub></div>
  </div>`;
}
function linesBlock(mode, items, title = 'Piezas') {
  const rows = (items && items.length ? items : [{}]).map(l => lineRow(mode, l)).join('');
  return `<div class="form-sec"><h4>${title}</h4><span class="muted" style="font-size:11.5px">Escribe “rastras” en medida para cargar por rastras sin detalle</span></div>
    <div class="lines" id="lines" data-mode="${mode}">${rows}</div>
    <div>${btn(`${icon('plus')}Agregar pieza`, 'data-act="add-line"', 'sm')}</div>`;
}
function readRow(row, mode) {
  const g = k => (row.querySelector(`[data-k="${k}"]`)?.value ?? '').trim();
  const medTxt = g('medida'), largo = parseQty(g('largo')), cant = parseQty(g('cant')), precio = parseMoney(g('precio'));
  if (/^r(astras?)?$/i.test(medTxt)) {
    return { unidad: 'rastra', medida: 'Rastras', largo, cant, precio, rastras: 1, costo: row.dataset.costo ? n(row.dataset.costo) : Math.round(costoRastra(largo || 3)), ok: true };
  }
  const info = piezaInfo(medTxt, largo);
  const l = {
    unidad: 'pieza', medida: info ? info.label : medTxt, largo, cant, precio,
    rastras: row.dataset.rastras ? n(row.dataset.rastras) : info ? +info.rastras.toFixed(6) : 0,
    costo: row.dataset.costo ? n(row.dataset.costo) : info ? Math.round(info.costo) : 0,
    ok: !!info,
  };
  if (mode === 'bbv') { l.pbb = parseMoney(g('pbb')); l.plista = info ? listaPrecio(model().listaBBVenta, info.label, largo) || 0 : 0; }
  if (mode === 'dmg') { l.precio = 0; l.pbb = info ? pbbFor(info.label, largo) : 0; }
  return l;
}
function readLines(form, mode) {
  const out = [];
  for (const row of $$('[data-line]', form)) {
    const l = readRow(row, mode);
    if (!l.medida && !l.cant) continue;
    if (!l.cant) continue;
    if (!l.ok) throw new Error(`La medida “${l.medida || '(vacía)'}” no se entiende. Escríbela como 4x6 y pon el largo en metros.`);
    delete l.ok; out.push(l);
  }
  return out;
}

/* ---- totales en vivo ---- */
function liveSale(form, mode, extra = {}) {
  const rows = $$('[data-line]', form);
  let pzs = 0, ras = 0, sub = 0, costo = 0;
  for (const row of rows) {
    const l = readRow(row, mode);
    const s = row.querySelector('[data-sub]');
    if (!l.ok || !l.cant) { s.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 4x6' : ''; continue; }
    const lineSub = l.cant * l.precio, lineCost = l.cant * l.costo;
    if (l.unidad !== 'rastra') pzs += l.cant;
    ras += l.cant * l.rastras; sub += lineSub; costo += lineCost;
    s.textContent = l.unidad === 'rastra'
      ? `costo ${cop(l.costo)}/rastra · subtotal ${cop(lineSub)}`
      : `${num(l.rastras, 4)} rastras/pza · costo ${cop(l.costo)}/pza · subtotal ${cop(lineSub)}`;
  }
  return { pzs, ras, sub, costo };
}
function liveBBV(form) {
  const p = n(CFG().pctSocio) / 100;
  let venta = 0, base = 0, costo = 0, ras = 0, pzs = 0;
  for (const row of $$('[data-line]', form)) {
    const l = readRow(row, 'bbv'); const s = row.querySelector('[data-sub]');
    if (!l.ok || !l.cant) { s.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 4x6' : ''; continue; }
    const v = l.cant * l.precio, b = l.cant * l.pbb;
    venta += v; base += b; costo += l.cant * l.costo; ras += l.cant * l.rastras; if (l.unidad !== 'rastra') pzs += l.cant;
    const dif = l.plista && l.precio ? l.precio - l.plista : 0;
    s.textContent = `${num(l.rastras, 4)} rastras/pza${l.plista ? ` · lista ${cop(l.plista)}${Math.abs(dif) >= 1 ? ` · vendió ${cop(Math.abs(dif))} ${dif > 0 ? 'más caro' : 'más barato'}` : ''}` : ''} · utilidad del punto ${cop(v - b)} · tu parte ${cop((v - b) * p)}`;
  }
  const up = venta - base, mi = up * p;
  return { venta, base, up, mi, socio: up - mi, debe: base + mi, costo, miU: base + mi - costo, ras, pzs, p };
}

// Valores que pueden venir como texto: "55 mil", "1,2 millones", "1.200.000".
function moneyLoose(v) {
  if (typeof v === 'number') return Math.round(v);
  const t = String(v ?? '').toLowerCase();
  const x = parseLoose(t.replace(/[^\d.,-]/g, ''));
  if (/mill[oó]n|millones|\bm\b/.test(t)) return Math.round(x * 1e6);
  if (/\bmil\b|\bk\b/.test(t)) return Math.round(x * 1e3);
  return Math.round(x);
}
function aiItems(list, withPrice) {
  return (Array.isArray(list) ? list : []).map(it => {
    let L = parseLoose(it && it.largo); if (L > 20) L = L / 100;
    const o = { medida: String((it && it.medida) || '').replace(/\s/g, '').replace(/X/g, 'x'), largo: L, cant: parseLoose(it && it.cant) };
    if (withPrice) o.precio = moneyLoose(it && it.precio);
    return o;
  }).filter(it => it.medida && it.cant > 0);
}
function aiNormalize(out) {
  const M = model();
  const regs = Array.isArray(out) ? out : (out && Array.isArray(out.registros) ? out.registros : []);
  const oneOf = (v, list, d) => list.includes(v) ? v : d;

    switch (r.tipo) {
      case 'bb-venta': pre = { ...base, items: aiItems(r.items, true) }; break;

      case 'abono': pre = { ...base, clienteId: cliId(r.clienteId), valor: money(r.valor), medio: oneOf(r.medio, MEDIOS, 'Transferencia') }; break;
      case 'bb-pago': case 'pinera-pago': pre = { ...base, valor: money(r.valor), medio: oneOf(r.medio, MEDIOS, 'Transferencia') }; break;
      case 'pinera-compra': pre = { ...base, concepto: oneOf(r.concepto, PINERA_CONCEPTOS, 'Madera'), remision: String(r.remision || ''), salida: String(r.salida || ''), destino: String(r.destino || ''), rastras: parseLoose(r.rastras), valor: money(r.valor) }; break;

}
function aiErr(e) {

    case 'rate_limited': return 'Claude está ocupado o llegaste a tu límite de uso. Intenta en un rato.';
    case 'invalid_json': return 'Claude no devolvió algo que el tablero pueda leer. Intenta de nuevo o escribe el mensaje más claro.';
    case 'image_rejected': return 'No pude leer esa imagen. Prueba con otra foto en JPG o PNG.';
    case 'images_unavailable': return 'Aquí no se pueden enviar fotos. Pega el texto del mensaje.';
    case 'session_expired': return 'Tu sesión de Claude expiró. Vuelve a entrar y prueba otra vez.';
    case 'refused': return 'Claude no pudo procesar ese mensaje. Prueba escribiéndolo de otra forma.';

async function llenarConFoto(file) {
  if (!S.form || !S.sample) return;
  const kind = S.form.kind, form = $('#form'), st = $('#foto-status', form);
  if (st) { st.hidden = false; st.textContent = 'Claude está leyendo la foto…'; }
  const ctl = new AbortController(); S.aiCtl = ctl;
  try {
    const out = await S.sample.json(aiPrompt('', true, kind), { signal: ctl.signal, cache: false, images: [file] });
    const reg = aiNormalize(out).find(r => r.kind === kind);
    if (!reg) { if (st) st.textContent = `No encontré piezas en esa foto.${out && out.nota ? ' ' + out.nota : ''}`; return; }
    const pre = reg.prefill;
    // Lo que ya elegiste se queda si la foto no lo dice.
    const cli = val(form, 'f-cliente') || val(form, 'f-clifinal');
    if (!pre.clienteId && cli) pre.clienteId = cli;
    for (const [k, id] of [['remision', 'f-remision'], ['estado', 'f-estado']]) if (!pre[k] && val(form, id)) pre[k] = val(form, id);
    if (kind === 'venta-final' && !pre.cliente?.nombre && val(form, 'f-nombre')) pre.cliente = { nombre: val(form, 'f-nombre'), celular: val(form, 'f-celular'), municipio: val(form, 'f-municipio'), direccion: val(form, 'f-direccion') };
    S.aiCtl = null;
    const ai = { i: 1, n: 1, nota: out && typeof out.nota === 'string' ? out.nota : '' };
    if (S.form.isNew) openForm(kind, null, pre, ai); else openForm(kind, { ...S.form.rec, ...pre }, null, ai);
  } catch (e) {
    if (st) st.textContent = e && e.code === 'cancelled' ? '' : aiErr(e);
  } finally { if (S.aiCtl === ctl) S.aiCtl = null; }
}

// Interruptor: prender abre días desde hoy; apagar cierra los días en ayer (hoy ya no suma).
function pautaSwitch(id) {
  const hoy = todayStr();
  return guardarCampanas(campanas(S.config).map(c => {
    if (c.id !== id) return c;
    const { inicio, fin, ...resto } = c;
    let ps = periodosDe(c).map(p => ({ ...p }));
    const abierto = ps.find(p => enPeriodo(p, hoy));
    if (abierto) { abierto.hasta = addDays(hoy, -1); ps = ps.filter(p => p.hasta >= p.desde); }
    else {
      const ayer = ps.find(p => p.hasta === addDays(hoy, -1));
      if (ayer) ayer.hasta = ''; else ps.push({ desde: hoy, hasta: '' });
    }
    return { ...resto, periodos: ps.sort((a, b) => a.desde.localeCompare(b.desde)) };
  }));
}

// En Claude quedan como archivos del tablero (se ven en /_blob/<id>); en la versión Google, en carpetas de tu Drive.
const driveId = r => r.fotoId || (String(r.fotoUrl || '').match(/\/d\/([\w-]+)/) || [])[1] || '';
const tieneFoto = r => !!(r && (r.foto || r.fotoUrl || r.fotoId));
const puedeGuardarFoto = () => (S.mode === 'db' && !!S.assets) || S.mode === 'gas';
// Achica la foto (máx. 1600 px, JPEG) para que suba rápido. Si el navegador no la puede abrir, va la original.
async function achicarFoto(file) {
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    return b && b.size < file.size ? b : file;
  } catch { return file; }
}
const blobB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(b); });
async function guardarFoto(file, nombre, carpeta = 'comprobantes') {
  const b = await achicarFoto(file);
  if (S.mode === 'db' && S.assets) {
    const tipo = /^image\/(jpeg|png|webp|gif)$/.test(b.type) ? undefined : { type: 'image/jpeg' };
    const r = await S.assets.upload(b, tipo);
    return { foto: r.id };
  }
  if (S.mode === 'gas') {
    const url = await gasCall('guardarImagen', nombre, await blobB64(b), b.type || 'image/jpeg', carpeta);
    return { fotoUrl: url, fotoId: driveId({ fotoUrl: url }) };
  }
  return {};
}
// En Google la foto se pide al servidor una vez y queda en memoria.
const FOTOS = new Map();
function srcFoto(r) {
  if (r.foto) return Promise.resolve('/_blob/' + r.foto);
  const id = driveId(r);
  if (!id || S.mode !== 'gas') return Promise.resolve('');
  if (!FOTOS.has(id)) FOTOS.set(id, gasCall('leerImagen', id).catch(() => { FOTOS.delete(id); return ''; }));
  return FOTOS.get(id);
}
// Miniatura que abre la foto en grande dentro del tablero.
function fotoThumb(r, alt = 'Foto') {
  if (!tieneFoto(r)) return '';

  const id = driveId(r);
  return id ? `<button type="button" class="thumb" data-act="ver-foto" data-drive="${esc(id)}" aria-label="Ver ${esc(alt)}"><img data-drive-img="${esc(id)}" alt="${esc(alt)}"><span>${icon('spark')}</span></button>` : '';
}

}

      <div class="rem-top">${remFotoPrev()}<div class="form-grid" style="flex:1">${fld('f-fecha', 'Fecha del cargue', dateF('f-fecha', W.fecha))}${fld('f-remision', 'N.º de remisión', inp('f-remision', W.numero, { ph: 'Opcional' }))}</div></div>
      ${W.notaIA ? `<div class="note"><b>Claude:</b> ${esc(W.notaIA)}</div>` : ''}
      ${linesBlock('dmg', W.items.length ? W.items : [{}], 'Despiece: revisa y corrige')}
      <div id="live"></div>${datalistMedidas(M)}`;
  }
  if (W.step === 3) {
    remAsigInit(W);
    const ras = remRastras(W.items);
    const choice = (m, t, sub) => `<button type="button" class="choice" data-act="rem-modo" data-m="${m}" aria-pressed="${W.modo === m}"><b>${t}</b><span>${sub}</span></button>`;
    let h = `${remStepper(W)}<div class="note">${num(sum(W.items, l => l.cant), 0)} piezas · ${num(ras)} rastras${W.numero ? ` · remisión ${esc(W.numero)}` : ''}.</div>
      <h4 class="q">¿Para quién es esta remisión?</h4>
      <div class="choices">${choice('uno', 'Todo para un solo destino', 'Un cliente, Barro Blanco o un pedido')}${choice('varios', 'Dividir entre varios', 'Parte para uno, parte para otro')}</div>`;
    if (!W.modo) return h;
    const fins = M.finales.map(c => [c.id, c.nombre]), mays = M.mayoristas.map(c => [c.id, c.nombre]);
    const peds = M.porEntregar.map(p => [p.id, `${p.canal === 'final' ? 'Cliente final' : p.canal === 'bb' ? 'Sociedad' : 'Mayorista'} · ${p.cliente} · ${num(p.calc.piezas, 0)} pzs · ${fmtDay(p.fecha)}`]);
    h += W.destinos.map((d, i) => `<div class="dest" data-dest="${i}">
      <div class="dest-h"><span class="dest-n">${W.modo === 'varios' ? `Destino ${i + 1}` : 'Destino'}</span>${W.modo === 'varios' && W.destinos.length > 1 ? `<button type="button" class="icon-btn" data-act="rem-rm-dest" data-i="${i}" aria-label="Quitar destino">${icon('x')}</button>` : ''}</div>
      <div class="form-grid">
        <div class="field full"><label>Va para</label><select data-rk="tipo">${DEST_TIPOS.map(([v, l]) => `<option value="${v}"${d.tipo === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
        ${d.tipo === 'mayorista' ? `<div class="field full"><label>Mayorista</label><select data-rk="cliente">${[['', 'Elige…'], ...mays].map(([v, l]) => `<option value="${esc(v)}"${d.clienteId === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>${d.clienteId ? `<span class="hint">Precios: ${esc(M.listas.get(M.cli.get(d.clienteId)?.listaId)?.nombre || 'sin lista, los escribes en el siguiente paso')}</span>` : ''}</div>` : ''}
        ${d.tipo === 'final' ? `<div class="field full"><label>Cliente final</label><select data-rk="cliente">${[['', 'Elige…'], ...fins, ['__nuevo', '+ Cliente nuevo']].map(([v, l]) => `<option value="${esc(v)}"${d.clienteId === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
          ${d.clienteId === '__nuevo' ? `<div class="field"><label>Nombre</label><input data-rk="nombre" value="${esc(d.nuevo?.nombre || '')}" placeholder="Nombre y apellido"></div><div class="field"><label>Celular</label><input data-rk="celular" inputmode="tel" value="${esc(d.nuevo?.celular || '')}" placeholder="300 000 0000"></div><div class="field"><label>Municipio</label><input data-rk="municipio" value="${esc(d.nuevo?.municipio || '')}" placeholder="Guarne, Rionegro…"></div><div class="field"><label>Dirección de entrega</label><input data-rk="direccion" value="${esc(d.nuevo?.direccion || '')}" placeholder="Vereda, finca, obra"></div>` : ''}` : ''}
        ${d.tipo === 'pedido' ? `<div class="field full"><label>Pedido por entregar</label>${peds.length ? `<select data-rk="pedido">${[['', 'Elige…'], ...peds].map(([v, l]) => `<option value="${esc(v)}"${d.pedidoId === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select><span class="hint">Se marca como entregado con la fecha de esta remisión.</span>` : '<span class="hint">No hay pedidos por entregar.</span>'}</div>` : ''}
      </div></div>`).join('');
    if (W.modo === 'varios') {
      h += `<div>${btn(`${icon('plus')}Agregar destino`, 'data-act="rem-add-dest"', 'sm')}</div>
        <div class="form-sec"><h4>¿Cuánto va para cada uno?</h4><span class="muted" style="font-size:11.5px">La última columna debe quedar en 0</span></div>
        <div class="tbl-wrap"><table class="tbl asig"><thead><tr><th>Pieza</th><th class="r">Total</th>${W.destinos.map((d, i) => `<th class="r nt">${esc(destNombre(d, M))}</th>`).join('')}<th class="r">Sin asignar</th></tr></thead><tbody>
        ${W.items.map((l, j) => `<tr><td>${esc(nomLinea(l))}</td><td class="r">${num(l.cant, 0)}</td>${W.destinos.map((d, i) => `<td class="r"><input class="qty" inputmode="decimal" data-asig="${i}:${j}" value="${esc(qtyIn(W.asig[i][j]))}" placeholder="0" aria-label="${esc(nomLinea(l))} para ${esc(destNombre(d, M))}"></td>`).join('')}<td class="r" data-rest="${j}">0</td></tr>`).join('')}
        </tbody></table></div>`;
    }
    return h + '<div id="live"></div>';
  }
  // Paso 4: precios y confirmar
  let h = `${remStepper(W)}<div class="rem-top">${remFotoPrev()}<div><b>${W.numero ? `Remisión ${esc(W.numero)}` : 'Remisión sin número'}</b><span class="muted" style="display:block;font-size:12.5px">${fmtDate(W.fecha)} · ${num(sum(W.items, l => l.cant), 0)} piezas · ${num(remRastras(W.items))} rastras</span></div></div>`;
  h += W.destinos.map((d, i) => {
    const lines = W.items.map((l, j) => ({ l, j, cant: n(W.asig[i][j]) })).filter(x => x.cant > 0);
    if (d.tipo === 'pedido') {
      const p = M.porEntregar.find(x => x.id === d.pedidoId);
      const pz = sum(lines, x => x.cant);
      return `<div class="dest"><div class="dest-h"><span class="dest-n">${esc(destNombre(d, M))}</span>${chip('wood', 'Pedido por entregar')}</div>
        <div class="ledger"><div><span>Pedido</span><b>${p ? `${num(p.calc.piezas, 0)} pzs · ${cop(p.calc.total)}` : '—'}</b></div><div><span>En esta remisión</span><b>${num(pz, 0)} pzs</b></div></div>
        ${p && Math.abs(pz - p.calc.piezas) > 0.5 ? `<div class="note">La remisión trae ${num(pz, 0)} piezas para este pedido y el pedido tiene ${num(p.calc.piezas, 0)}. Se marca entregado con lo del pedido; si cambió algo, edítalo después.</div>` : ''}</div>`;
    }
    const lab = d.tipo === 'bb' ? 'Precio sociedad' : 'Precio c/u';
    return `<div class="dest"><div class="dest-h"><span class="dest-n">${esc(destNombre(d, M))}</span>${chip(d.tipo === 'bb' ? 'wood' : '', d.tipo === 'bb' ? 'Barro Blanco' : d.tipo === 'mayorista' ? 'Mayorista' : 'Cliente final')}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">${lab}</th><th class="r">Subtotal</th></tr></thead><tbody>
      ${lines.map(({ l, j, cant }) => { const pr = d.precios?.[j] ?? destPrecio(d, l, M); return `<tr><td>${esc(nomLinea(l))}</td><td class="r">${num(cant, 0)}</td><td class="r"><input class="money" inputmode="numeric" data-precio="${i}:${j}" value="${esc(moneyIn(pr))}" placeholder="$0" aria-label="Precio de ${esc(nomLinea(l))}"></td><td class="r" data-sub="${i}:${j}">${cop(cant * pr)}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="r">${num(sum(lines, x => x.cant), 0)}</td><td></td><td class="r" data-subt="${i}"></td></tr></tfoot></table></div></div>`;
  }).join('');
  return h + '<div id="live"></div>';
}

FORMS['remision'] = {
  eyebrow: 'Remisiones', title: 'Nueva remisión de cargue', done: 'Remisión guardada',
  init: () => ({ step: 1, fecha: todayStr(), numero: '', items: [], modo: '', destinos: [{ tipo: '' }], asig: [] }),
  cta: W => W.step === 1 ? 'Siguiente' : W.step === 2 ? 'Confirmar despiece' : W.step === 3 ? 'Revisar precios' : 'Guardar remisión',
  foot: W => `<button type="button" class="btn" data-act="rem-back"${W.step > 1 ? '' : ' hidden'}>Atrás</button>`,
  body: W => remBody(W),
  onChange: (t, f) => {
    if (t.id === 'f-rem-foto' && t.files && t.files[0]) { remRead(f, S.form.rec); remLeerFoto(t.files[0]); return; }
    if (t.matches('select[data-rk]')) { remRead(f, S.form.rec); remPaint(); }
  },
  live: form => {
    const W = S.form.rec;
    if (W.step === 2) {
      let pzs = 0, ras = 0;
      for (const row of $$('[data-line]', form)) {
        const l = readRow(row, 'dmg'), sb = row.querySelector('[data-sub]');
        if (!l.ok || !l.cant) { sb.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 4x6' : ''; continue; }
        if (l.unidad !== 'rastra') pzs += l.cant; ras += l.cant * l.rastras;
        sb.textContent = `${num(l.rastras, 4)} rastras por pieza · ${num(l.cant * l.rastras, 3)} rastras`;
      }
      return totalsBox([['Piezas', num(pzs, 0)], ['Rastras', num(ras, 3), 1], ...remNomina(ras).map(([nm, v]) => [`Nómina de ${esc(nm)}`, cop(v)])]);
    }
    if (W.step === 3 && W.modo === 'varios') {
      const rest = W.items.map(l => n(l.cant));
      for (const inp of $$('[data-asig]', form)) { const [, j] = inp.dataset.asig.split(':').map(Number); rest[j] -= parseQty(inp.value); }
      rest.forEach((r, j) => { const c = $(`[data-rest="${j}"]`, form); if (c) { c.textContent = num(r, 0); c.className = `r ${Math.abs(r) > 0.001 ? 'neg' : 'pos'}`; } });
      const falta = sum(rest, r => Math.abs(r));
      return falta > 0.001 ? `<div class="note">Faltan ${num(falta, 0)} piezas por asignar.</div>` : '<div class="note">Todo asignado.</div>';
    }
    if (W.step === 4) {
      let total = 0;
      W.destinos.forEach((d, i) => {
        let st = 0;
        for (const inp of $$(`[data-precio^="${i}:"]`, form)) { const j = +inp.dataset.precio.split(':')[1], cant = n(W.asig[i][j]), v = cant * parseMoney(inp.value); st += v; const c = $(`[data-sub="${i}:${j}"]`, form); if (c) c.textContent = cop(v); }
        if (d.tipo === 'pedido') st = model().porEntregar.find(x => x.id === d.pedidoId)?.calc.total || 0;
        const c = $(`[data-subt="${i}"]`, form); if (c) c.textContent = cop(st);
        total += st;
      });
      const ras = remRastras(W.items);
      return totalsBox([['Valor de lo despachado', cop(total), 1], ['Rastras del viaje', num(ras, 3)], ...remNomina(ras).map(([nm, v]) => [`Se le suma a ${esc(nm)}`, cop(v)])]);
    }
    return '';
  },
  submit: async form => {
    const W = S.form.rec;
    if (S.demo) { formError('Estás viendo el ejemplo. Sal del ejemplo para registrar datos reales.'); return; }
    remRead(form, W);
    formError('');
    if (W.step === 1) { if (!W.items.length) W.items = [{}]; remIr(2); return; }
    if (W.step === 2) {
      if (!isDate(W.fecha)) { formError('Pon la fecha del cargue.'); return; }
      try { W.items = readLines(form, 'dmg').map(({ ok, ...l }) => l); } catch (e) { formError(e.message); return; }
      if (!W.items.length) { formError('Agrega al menos una pieza con cantidad.'); return; }
      W.asig = []; remIr(3); return;
    }
    if (W.step === 3) {
      if (!W.modo) { formError('Elige si todo va para un solo destino o si se divide.'); return; }
      for (const [i, d] of W.destinos.entries()) {
        const q = W.modo === 'varios' ? ` (destino ${i + 1})` : '';
        if (!d.tipo) { formError(`Elige para quién va${q}.`); return; }
        if ((d.tipo === 'mayorista' || d.tipo === 'final') && !d.clienteId) { formError(`Elige el cliente${q}.`); return; }
        if (d.clienteId === '__nuevo' && !d.nuevo?.nombre) { formError(`Escribe el nombre del cliente nuevo${q}.`); return; }
        if (d.tipo === 'pedido' && !d.pedidoId) { formError(`Elige el pedido${q}.`); return; }
      }
      const peds = W.destinos.filter(d => d.tipo === 'pedido').map(d => d.pedidoId);
      if (new Set(peds).size !== peds.length) { formError('El mismo pedido está dos veces.'); return; }
      remAsigInit(W);
      const rest = W.items.map((l, j) => n(l.cant) - sum(W.asig, a => a[j]));
      if (rest.some(r => Math.abs(r) > 0.001)) { formError('Reparte todas las piezas: la columna “Sin asignar” debe quedar en 0.'); return; }
      if (W.asig.some(a => a.some(x => x < 0))) { formError('Hay cantidades negativas.'); return; }
      W.destinos.forEach((d, i) => { if (d.tipo !== 'pedido' && !W.asig[i].some(x => x > 0)) d.vacio = true; else delete d.vacio; });
      if (W.destinos.some(d => d.vacio)) { formError('Hay un destino sin piezas: quítalo o asígnale piezas.'); return; }
      remIr(4); return;
    }
    // Paso 4: guardar
    for (const [i, d] of W.destinos.entries()) {
      if (d.tipo === 'pedido') continue;
      const sinPrecio = W.items.some((l, j) => n(W.asig[i][j]) > 0 && !n(d.precios?.[j] ?? destPrecio(d, l)));
      if (sinPrecio) { formError(`Falta el precio de alguna pieza para ${destNombre(d)}.`); return; }
    }
    const b = $('#f-submit'); b.disabled = true; b.textContent = 'Guardando…';
    try { await remGuardar(W); toast('Remisión guardada: ventas, despachos y nómina al día'); closeForm(); S.view = 'remisiones'; render(); }
    catch (err) { formError(`No se pudo guardar todo. ${errMsg(err)}`); b.disabled = false; b.textContent = FORMS.remision.cta(W); }
  },
};
async function remGuardar(W) {
  const M = model(), mo = moSnap(), remisionId = 'rem-' + uid();
  const extra = { remisionId, remision: W.numero || '', fecha: W.fecha, mo };
  const destinos = [];
  for (const [i, d] of W.destinos.entries()) {
    const items = W.items.map((l, j) => ({ ...l, cant: n(W.asig[i][j]), precio: n(d.precios?.[j] ?? destPrecio(d, l, M)) })).filter(l => l.cant > 0);
    const r = { tipo: d.tipo, nombre: destNombre(d, M), piezas: sum(items.filter(l => l.unidad !== 'rastra'), l => l.cant), rastras: remRastras(items) };
    if (d.tipo === 'bb') {
      r.col = 'bbDespachos'; r.valor = sum(items, l => l.cant * l.precio);
      r.id = await Store.save('bbDespachos', { tipo: 'despacho', items, ...extra });
    } else if (d.tipo === 'mayorista') {
      r.col = 'ventas'; r.valor = sum(items, l => l.cant * l.precio);
      r.id = await Store.save('ventas', { canal: 'mayorista', estado: 'Entregado', clienteId: d.clienteId, items, flete: 0, costoFlete: 0, ...extra });
    } else if (d.tipo === 'final') {
      let cid = d.clienteId;
      if (cid === '__nuevo') { cid = await Store.save('clientes', { tipo: 'final', oficio: 'Persona', ...d.nuevo }); r.clienteNuevo = cid; }
      const c = cid === d.clienteId ? M.cli.get(cid) || {} : d.nuevo;
      r.col = 'ventas'; r.valor = sum(items, l => l.cant * l.precio);
      r.id = await Store.save('ventas', { canal: 'final', estado: 'Despachado', clienteId: cid, cliente: { nombre: c.nombre || '', celular: c.celular || '', municipio: c.municipio || '', direccion: c.direccion || '' }, items, pagos: [], flete: 0, costoFlete: 0, ...extra });
    } else if (d.tipo === 'pedido') {
      const p = M.porEntregar.find(x => x.id === d.pedidoId), col = p.col || 'ventas';
      const orig = D()[col].find(x => x.id === p.id);
      const estado = p.canal === 'bb' ? 'Entregada' : p.canal === 'final' ? 'Despachado' : 'Entregado';
      await Store.save(col, { ...orig, estado, remisionId, remision: W.numero || orig.remision || '', fecha: W.fecha, mo: orig.mo || mo, antes: { estado: orig.estado || '', fecha: orig.fecha || '', remision: orig.remision || '' } });
      Object.assign(r, { col, id: p.id, convertido: true, nombre: p.cliente, piezas: p.calc.piezas, rastras: p.calc.rastras, valor: p.calc.total });
    }
    destinos.push(r);
  }
  const rec = { fecha: W.fecha, numero: W.numero || '', items: W.items, destinos, piezas: sum(destinos, x => x.piezas), rastras: sum(destinos, x => x.rastras), valor: sum(destinos, x => x.valor), mo };
  if (S.remFoto && puedeGuardarFoto()) {
    try { Object.assign(rec, await guardarFoto(S.remFoto, `remision-${W.numero || W.fecha}.jpg`, 'remisiones')); }
    catch { toast('La remisión se guardó, pero la foto no se pudo subir.'); }
  }
  await Store.save('remisiones', { ...rec, id: remisionId });
  if (S.remFotoUrl) URL.revokeObjectURL(S.remFotoUrl);
  S.remFoto = null; S.remFotoUrl = '';
}

function parseGrid(txt) {
  const rows = String(txt || '').replace(/\r/g, '').split('\n').map(r => r.split('\t'));
  const hi = rows.findIndex(r => r.filter(c => parseMedida(c)).length >= 2);
  if (hi < 0) return { error: 'No encontré una fila con medidas (por ejemplo 2x4, 4x6). Copia la tabla desde Excel con la fila de medidas incluida.' };
  const header = rows[hi].map(c => parseMedida(c));
  const precios = {}; let celdas = 0; const largos = new Set();
  for (const r of rows.slice(hi + 1)) {
    const L = parseQty(r[0]);
    if (!L || L > 30) continue;
    r.forEach((c, j) => {
      if (!j || !header[j]) return;
      const v = Math.round(parseLoose(c));
      if (!(v > 0)) return;
      (precios[header[j].key] = precios[header[j].key] || {})[largoKey(L)] = v; celdas++; largos.add(L);
    });
  }
  if (!celdas) return { error: 'Encontré las medidas pero ningún precio. La primera columna debe tener los largos en metros.' };
  return { precios, celdas, medidas: Object.keys(precios).length, largos: largos.size };
}

async function saveFile(filename, text) {
  if (S.mode === 'gas') {
    try { S.lastExport = { filename, url: await gasCall('guardarArchivo', filename, text) }; toast('Copia guardada en tu Drive'); render(); }
    catch { toast('No se pudo guardar la copia en tu Drive.'); }
    return;
  }
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Archivo listo'); }
    catch (e) { if (!e || e.code !== 'declined') toast('No se pudo preparar la descarga.'); }
    return;
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  } catch { toast('Este navegador no permitió la descarga.'); }
}

let pendingImport = null;
function handleImportFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j || typeof j !== 'object' || !COLS.some(c => Array.isArray(j[c]))) throw new Error('formato');
      pendingImport = j;
      const total = sum(COLS, c => Array.isArray(j[c]) ? j[c].length : 0);
      $('#import-zone').innerHTML = `<div class="note" style="margin-bottom:10px">El archivo trae <b>${num(total, 0)}</b> registros${j.exportado ? ` (exportado el ${esc(fmtDate(String(j.exportado).slice(0, 10)))})` : ''}.</div>
        <div class="pills">${btn('Restaurar ahora', 'data-act="import-go"', 'primary')}${btn('Cancelar', 'data-act="import-cancel"', 'ghost')}</div>`;
    } catch { toast('Ese archivo no es una copia de este tablero.'); }
  };
  rd.readAsText(file);
}
async function runImport() {
  if (!pendingImport) return;
  if (S.demo) { toast('Sal del ejemplo para restaurar una copia.'); return; }
  const j = pendingImport; pendingImport = null;
  let done = 0;
  try {
    for (const c of COLS) for (const rec of (Array.isArray(j[c]) ? j[c] : [])) {
      if (!rec || typeof rec !== 'object') continue;
      await Store.save(c, { ...rec, id: rec.id || uid() }); done++;
      if (done % 20 === 0) toast(`Restaurando… ${done}`);
    }
    if (j.config && typeof j.config === 'object') await Store.saveConfig(j.config);
    toast(`Listo: ${done} registros restaurados`);
  } catch (e) { toast(`Se restauraron ${done} registros. ${errMsg(e)}`); }
  render();
}

function buildDemo() {
  let seed = 7;

  const pick = a => a[Math.floor(rnd() * a.length)];
  const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const hoy = todayStr();
  const meds = ['2x4', '3x5', '4x4', '4x6', '4x8', '5x8', '6x6', '6x8', '6x9'];
  const largos = [3, 3.5, 4, 4.5, 5, 6];
  const BBREF = [['2x4', 3], ['3x5', 3], ['4x4', 3], ['4x4', 4], ['4x6', 4], ['4x8', 5], ['6x6', 3.5], ['6x8', 5], ['6x9', 6]];
  const mk = (k) => { const precios = {}; for (const m of meds) { precios[m] = {}; for (const L of largos) { const c = piezaInfo(m, L, DEFAULT_CONFIG).costo; precios[m][largoKey(L)] = Math.round(c * k(L) / 100) * 100; } } return precios; };
  const listas = [
    { id: 'demo-l1', nombre: 'Sociedad Barro Blanco (ejemplo)', precios: mk(L => 1.12 + L * .012) },
    { id: 'demo-l2', nombre: 'Mayorista (ejemplo)', precios: mk(L => 1.22 + L * .015) },
    { id: 'demo-l3', nombre: 'Cliente final (ejemplo)', precios: mk(L => 1.5 + L * .02) },
    { id: 'demo-l4', nombre: 'Venta Barro Blanco (ejemplo)', precios: mk(L => 1.42 + L * .02) },
  ];
  const clientes = [
    { id: 'demo-c1', tipo: 'mayorista', nombre: 'Depósito El Roble (ejemplo)', diasCredito: 30, listaId: 'demo-l2' },
    { id: 'demo-c2', tipo: 'mayorista', nombre: 'Maderas La Ceja (ejemplo)', diasCredito: 15, listaId: 'demo-l2' },
  ];
  const linea = (lista, factor = 1) => {
    const m = pick(meds), L = pick(largos), info = piezaInfo(m, L, DEFAULT_CONFIG);
    return { unidad: 'pieza', medida: m, largo: L, cant: int(4, 30), precio: Math.round(listaPrecio(lista, m, L) * factor), rastras: +info.rastras.toFixed(6), costo: Math.round(info.costo) };
  };
  const ventas = [], abonos = [], bbDespachos = [], bbVentas = [], bbPagos = [], pineraCompras = [], pineraPagos = [], gastos = [];
  let i = 0;
  for (let d = -150; d <= 0; d++) {

    if (rnd() < .22) { const c = pick(clientes); ventas.push({ id: 'dv' + (i++), canal: 'mayorista', clienteId: c.id, fecha: f, remision: String(300 + i), items: Array.from({ length: int(1, 4) }, () => linea(listas[1])) }); }
    if (rnd() < .2) { const c = pick(clientes); abonos.push({ id: 'da' + (i++), clienteId: c.id, fecha: f, valor: int(20, 70) * 100000, medio: pick(MEDIOS) }); }
    if (rnd() < .1) {
      const items = Array.from({ length: int(1, 2) }, () => { const l = linea(listas[2]); l.cant = int(2, 12); return l; });
      const tot = sum(items, l => l.cant * l.precio);
      ventas.push({ id: 'dv' + (i++), canal: 'final', fecha: f, estado: d < -5 ? 'Entregado' : pick(ESTADOS_FINAL), cliente: { nombre: pick(['Juan Pérez', 'Luz Marina Gómez', 'Carlos Restrepo', 'Ana Ochoa', 'Pedro Zuluaga']) + ' (ejemplo)', celular: '300 000 00' + int(10, 99), municipio: pick(['Rionegro', 'Guarne', 'La Ceja', 'El Carmen']), direccion: 'Vereda ejemplo' }, items, flete: pick([0, 80000, 120000]), costoFlete: pick([0, 60000, 90000]), pagos: d < -10 || rnd() < .5 ? [{ fecha: f, valor: tot }] : [] });
    }
    if (d % 21 === -150 % 21) bbDespachos.push({ id: 'dd' + (i++), tipo: 'despacho', fecha: f, remision: 'BB-' + i, items: BBREF.map(([m, L]) => { const info = piezaInfo(m, L, DEFAULT_CONFIG); return { unidad: 'pieza', medida: m, largo: L, cant: int(8, 16), precio: listaPrecio(listas[0], m, L), rastras: +info.rastras.toFixed(6), costo: Math.round(info.costo) }; }) });
    if (d > -145 && rnd() < .4 && bbDespachos.length) {
      const last = bbDespachos[bbDespachos.length - 1];
      const items = Array.from({ length: int(1, 3) }, () => pick(last.items)).map(l => ({ ...l, cant: int(1, 4), pbb: l.precio, precio: Math.round(l.precio * (1.22 + rnd() * .12) / 100) * 100 }));
      bbVentas.push({ id: 'db' + (i++), fecha: f, pct: 50, items });
    }
    if (d % 14 === -3) bbPagos.push({ id: 'dp' + (i++), fecha: f, valor: int(10, 22) * 100000, medio: 'Transferencia' });
    if (d % 7 === 0) { const r = +(35 + rnd() * 35).toFixed(4); pineraCompras.push({ id: 'dc' + (i++), fecha: f, concepto: 'Madera', remision: String(320 + i), salida: pick(['Minas', 'Sarza']), destino: 'Guarne', rastras: r, valor: Math.round(r * (140000 + rnd() * 30000)) }); }
    if (d % 7 === -2) pineraPagos.push({ id: 'dq' + (i++), fecha: f, valor: int(55, 95) * 100000, medio: 'Transferencia', nota: 'Abono a cuenta madera' });
    if (rnd() < .15) gastos.push({ id: 'dg' + (i++), fecha: f, categoria: pick(['Flete', 'Cargue', 'Combustible', 'Comisiones']), descripcion: 'Gasto de ejemplo', valor: int(5, 40) * 10000, canal: 'General' });
  }
  ventas.push({ id: 'dv-pe', canal: 'mayorista', estado: 'Por entregar', clienteId: 'demo-c2', fecha: addDays(hoy, 13), remision: '', items: [{ unidad: 'pieza', medida: '4x8', largo: 6.5, cant: 60, precio: 275000, rastras: +(32 * 6.5 / 240).toFixed(6), costo: Math.round(piezaInfo('4x8', 6.5, DEFAULT_CONFIG).costo) }] });
  // Nómina de ejemplo: cada sábado se paga lo que se cargó en la semana.
  const nomina = [], desdeN = demoNomina().desde;
  const cargados = [...ventas.filter(v => v.estado !== 'Por entregar' && v.estado !== 'Pendiente'), ...bbDespachos].filter(v => v.fecha >= desdeN);
  for (let s = sabadoDe(desdeN); s < hoy; s = addDays(s, 7)) {
    const ras = sum(cargados.filter(v => v.fecha >= addDays(s, -6) && v.fecha <= s), v => calcVenta(v).rastras);
    if (ras) for (const [id, k] of [['demo-t1', 'aserrada'], ['demo-t2', 'arriada']]) nomina.push({ id: 'dn' + (i++), tipo: 'pago', trabajadorId: id, fecha: s, valor: Math.round(ras * DEFAULT_CONFIG[k] / 1000) * 1000, medio: 'Efectivo' });
  }
  nomina.push({ id: 'dn-x', tipo: 'cargo', trabajadorId: 'demo-t2', fecha: addDays(hoy, -9), concepto: 'Día de cargue (ejemplo)', valor: 60000 });
  const fpe = ventas.filter(v => v.canal === 'final' && (v.estado || 'Pendiente') === 'Pendiente')[0];
  const anticipos = fpe ? [{ id: 'dant1', clienteId: '', pedidoId: fpe.id, fecha: fpe.fecha, valor: Math.round(sum(fpe.items, l => l.cant * l.precio) * 0.3 / 100) * 100, medio: 'Transferencia', nota: 'Anticipo del 30% (ejemplo)' }] : [];
  return { listas, clientes, ventas, abonos, anticipos, remisiones: [], bbDespachos, bbVentas, bbPagos, pineraCompras, pineraPagos, gastos, nomina };
}

/* =========================================================================
   Eventos
   ========================================================================= */
function toast(msg) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3400);
}
function toggleMenu(force) {
  const m = $('#menu'), b = $('[data-act="menu"]');
  const open = force ?? m.hidden;
  m.hidden = !open; b.setAttribute('aria-expanded', String(open));
}

document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  if ($('#pop') && !e.target.closest('#pop') && !e.target.closest('[data-act="cli-menu"]')) cerrarPop();
  const t = e.target.closest('[data-act]');
  if (!$('#menu').hidden && !e.target.closest('#menu') && !(t && t.dataset.act === 'menu')) toggleMenu(false);
  if (!t) return;
  const a = t.dataset.act;
  switch (a) {
    case 'nav': S.view = t.dataset.v; pref.set('view', S.view); render(); window.scrollTo(0, 0); break;
    case 'range': S.range = t.dataset.r; pref.set('range', S.range); render(); break;
    case 'menu': toggleMenu(); break;
    case 'form': toggleMenu(false); cerrarPop(); openForm(t.dataset.form, null, prefillDe(t.dataset, t.dataset.form)); break;
    case 'cli-menu': cliMenu(t); break;
    case 'trab': openForm('trabajador', { id: t.dataset.id }); break;
    case 'ver-foto': verFoto(t); break;
    case 'rem-manual': { const W = S.form.rec; remRead($('#form'), W); if (!W.items.length) W.items = [{}]; remIr(2); break; }
    case 'rem-back': { const W = S.form.rec; remRead($('#form'), W); formError(''); remIr(Math.max(1, W.step - 1)); break; }
    case 'rem-modo': { const W = S.form.rec; remRead($('#form'), W); W.modo = t.dataset.m; if (W.modo === 'uno') W.destinos = [W.destinos[0] || { tipo: '' }]; W.asig = []; remPaint(); break; }
    case 'rem-add-dest': { const W = S.form.rec; remRead($('#form'), W); W.destinos.push({ tipo: '' }); W.asig.push(W.items.map(() => 0)); remPaint(); break; }
    case 'rem-rm-dest': { const W = S.form.rec; remRead($('#form'), W); const i = +t.dataset.i; W.destinos.splice(i, 1); W.asig.splice(i, 1); remPaint(); break; }
    case 'cerrar-foto': cerrarFoto(); break;
    case 'edit': openEdit(t.dataset.col, t.dataset.id); break;
    case 'close': closeForm(); break;
    case 'add-line': {
      const box = $('#lines'); if (!box) break;
      box.insertAdjacentHTML('beforeend', lineRow(box.dataset.mode));
      box.lastElementChild.querySelector('input').focus(); break;
    }
    case 'rm-line': {
      const box = $('#lines'); const row = t.closest('[data-line]');
      if (box && box.children.length > 1) row.remove(); else { $$('input', row).forEach(i => { i.value = ''; }); delete row.dataset.costo; delete row.dataset.rastras; }
      recalcForm(); break;
    }
    case 'add-pago': $('#pagos').insertAdjacentHTML('beforeend', pagoRow({})); recalcForm(); break;
    case 'add-tramo': $('#tramos').insertAdjacentHTML('beforeend', tramoRow({})); break;
    case 'rm-row': t.closest('[data-pago],[data-tramo],[data-trab],[data-periodo]').remove(); recalcForm(); break;
    case 'add-trab': $('#trabs').insertAdjacentHTML('beforeend', trabRow({})); break;
    case 'add-periodo': $('#periodos').insertAdjacentHTML('beforeend', periodoRow({ desde: todayStr(), hasta: '' })); break;
    case 'pauta-switch': {
      if (S.demo) { toast('Estás viendo el ejemplo. Sal del ejemplo para cambiar la pauta.'); break; }
      const on = t.getAttribute('aria-checked') === 'true';
      t.disabled = true;
      pautaSwitch(t.dataset.id).then(() => toast(on ? 'Pauta apagada: desde hoy no suma' : 'Pauta prendida: desde hoy suma su presupuesto diario'), err => { toast(errMsg(err)); t.disabled = false; });
      break;
    }
    case 'nomina-pagar': { const s1 = model().nominaSaldo.get(t.dataset.id) || 0; openForm('nomina-pago', null, { trabajadorId: t.dataset.id, valor: Math.max(0, Math.round(s1)) }); break; }
    case 'del': armDelete(t); break;
    case 'demo': S.demo = !S.demo; closeForm(); bump(); break;
    case 'cli': S.filterCli = S.filterCli === t.dataset.id ? '' : t.dataset.id; render(); break;
    case 'lista-ver': S.listaSel = t.dataset.id; render(); setTimeout(() => { const cs = $$('.card'); cs[cs.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); break;
    case 'mx': S.matrixMode = t.dataset.m; render(); break;
    case 'cm': S.costMode = t.dataset.m; render(); break;
    case 'campana-edit': { const c = campanas().find(x => x.id === t.dataset.id); if (c) openForm('campana', c); break; }
    case 'pauta-mes': openForm('pauta-real', null, { mes: t.dataset.mes }); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import': $('#import-file').click(); break;
    case 'import-go': runImport(); break;
    case 'import-cancel': pendingImport = null; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#lightbox').hidden) cerrarFoto(); else if ($('#pop')) cerrarPop(); else if (!$('#drawer').hidden) closeForm(); else toggleMenu(false); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act], [role="button"][data-act]')) e.target.click();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.range) {
    if (t.dataset.range === 'from') S.customFrom = t.value; else S.customTo = t.value;
    if (isDate(t.value)) render();
    return;
  }
  if (t.hasAttribute && t.hasAttribute('data-calc')) {
    S.calc = { m: $('#calc-m').value, l: $('#calc-l').value, q: $('#calc-q').value };
    $('#calc-out').innerHTML = calcOut(model(), S.calc.m, parseQty(S.calc.l), parseQty(S.calc.q));
    return;
  }
  if (!S.form || !t.closest('#form')) return;
  const row = t.closest('[data-line]');
  if (row) {
    const k = t.dataset.k;
    if (k === 'medida' || k === 'largo') { delete row.dataset.costo; delete row.dataset.rastras; autoPrice($('#form'), row); }
    if (k === 'precio' || k === 'pbb') t.dataset.auto = t.value.trim() ? '0' : '1';
  }
  const F = FORMS[S.form.kind];
  if (F && F.onInput) F.onInput(t, $('#form'));
  recalcForm();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'import-file' && t.files && t.files[0]) { handleImportFile(t.files[0]); t.value = ''; return; }
  if (S.form && t.id === 'f-clifinal') {
    const c = model().cli.get(t.value);
    if (c) for (const [id, k] of [['f-nombre', 'nombre'], ['f-celular', 'celular'], ['f-municipio', 'municipio'], ['f-direccion', 'direccion']]) { const el = $('#' + id); if (el) el.value = c[k] || ''; }
  }
  if (S.form && t.id === 'f-cliente') { for (const row of $$('[data-line]', $('#form'))) autoPrice($('#form'), row); recalcForm(); }
  if (S.form && t.id === 'f-foto-ped' && t.files && t.files[0]) { llenarConFoto(t.files[0]); t.value = ''; return; }
  if (S.form && t.closest('#form')) { const F = FORMS[S.form.kind]; if (F && F.onChange) F.onChange(t, $('#form')); }
  if (S.form) recalcForm();
});
// Si una foto no carga, la miniatura muestra un ícono en vez de una imagen rota.
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.closest('.thumb')) t.closest('.thumb').classList.add('roto'); }, true);
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.matches && t.matches('input.money')) { const v = parseMoney(t.value); t.value = v ? moneyIn(v) : ''; }
});
$('#form').addEventListener('submit', submitForm);
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

/* =========================================================================
   Arranque
   ========================================================================= */
(function boot() {
  S.range = pref.get('range', 'mes');
  if (!RANGES.some(r => r[0] === S.range)) S.range = 'mes';
  S.view = pref.get('view', 'resumen');
  const h = (location.hash || '').slice(1);
  if (h === 'demo') S.demo = true;
  else if (VIEWS.some(v => v.id === h)) S.view = h;
  else if (h === 'pinera' || h === 'gastos') S.view = 'compras';
  if (S.view === 'pinera' || S.view === 'gastos') S.view = 'compras';
  if (!VIEWS.some(v => v.id === S.view)) S.view = 'resumen';
  render();
  Store.init();
  (async () => {
    try {
      const sm = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null;
      if (!sm) return;
      S.sample = sm;
      try { const lim = await sm.limits(); S.sampleImg = lim && lim.images ? lim.images : null; } catch { S.sampleImg = null; }
      render();
    } catch { /* sin Claude: se oculta la función */ }
  })();
  (async () => {
    try {
      const as = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('assets') : null;
      if (as) S.assets = as;
    } catch { /* sin permiso para guardar fotos: se registra sin foto */ }
  })();
})();

})();

</script>
