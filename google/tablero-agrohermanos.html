    ${kpi('Utilidad', signed(ut), `Margen ${pct(ing ? ut / ing : NaN)}`, { det: 'may:utilidad' })}
    ${kpi('Rastras', num(ra), `${cop(ra ? ut / ra : 0)} de utilidad por rastra · ${pct(ing ? ut / ing : NaN)} de margen`, { det: 'may:rastras' })}
    ${kpi('Cartera hoy', cop(saldoTot), `${vencTot > 0.5 ? `<span class="neg">${cop(vencTot)} vencido</span>` : 'Nada vencido'}${(x => x > 0.5 ? ` · ${cop(x)} de pedidos por entregar` : '')(sum(carSel, c => c.porEntregar))}${antTot > 0.5 ? ` · ${cop(antTot)} de saldo a favor de clientes` : ''}`, { det: 'may:cartera' })}
  </div>`;
  const ped = table([
    { h: 'Fecha', f: e => `<span class="num">${fmtDate(e.fecha)}</span>` },
    { h: 'Remisión', f: e => `<span class="num">${esc(e.ref.remision || '—')}</span>` },
    { h: 'Cliente', f: e => esc(e.cliente) },
    { h: 'Detalle', f: e => detalle(e.lines) },
    { h: 'Rastras', r: 1, f: e => num(e.rastras) },
    { h: 'Total', r: 1, f: e => cop(e.ingreso) },
    { h: 'Utilidad', r: 1, f: e => signed(e.util) },
    { h: 'Estado', f: e => estadoChip(M.estadoPedido.get(e.id), M.hoy) },
  ], Ef, { act: e => editAttr('ventas', e.id), empty: '<p>No hay pedidos en este período.</p>', foot: Ef.length > 1 ? ['Total', '', '', '', num(ra), cop(ing), cop(ut), ''] : null });
  const ab = table([
    { h: 'Fecha', f: a => `<span class="num">${fmtDate(a.fecha)}</span>` },
    { h: 'Cliente', f: a => esc(M.cli.get(a.clienteId)?.nombre || '—') },
    { h: 'Medio', f: a => `${esc(a.medio || '—')}${a.destino ? `<span class="sub">${esc(destinoTxt(a, M))}</span>` : ''}` },
    { h: 'Nota', f: a => `<span class="muted">${esc(a.nota || '')}</span>` },
    { h: 'Valor', r: 1, f: a => cop(a.valor) },
  ], A, { act: a => editAttr('abonos', a.id), empty: '<p>No hay abonos en este período.</p>', foot: A.length > 1 ? ['Total', '', '', '', cop(sum(A, a => a.valor))] : null });

  const PE = M.porEntregar.filter(p => p.canal === 'mayorista' && (!sel || p.ref.clienteId === sel));
  const peCard = PE.length ? card('Por entregar', table([
    { h: 'Entrega', f: p => { const dd = diffDays(M.hoy, p.fecha); return `<span class="num">${fmtDate(p.fecha)}</span><span class="sub">${dd < 0 ? `hace ${-dd} d` : dd === 0 ? 'hoy' : `en ${dd} d`}</span>`; } },
    { h: 'Cliente', f: p => esc(p.cliente) },
    { h: 'Detalle', f: p => detalle(p.lines) },
    { h: 'Rastras', r: 1, f: p => num(p.calc.rastras) },
    { h: 'Total', r: 1, f: p => cop(p.calc.total) },
    { h: 'Utilidad esperada', r: 1, f: p => signed(p.calc.util) },
  ], PE, { act: p => editAttr('ventas', p.id) }), { sub: 'Pedidos en producción. Ya cuentan como lo que te deben; cuentan como venta cuando los marques como entregados.' }) : '';
  const cuentaCard = sel ? `<div id="cuenta">${card(`Historial · ${esc(M.cli.get(sel).nombre)}`, fichaCliente(sel, M) + cuentaResumen(cuentaMovs(sel, M)) + cuentaTabla(sel, M), { sub: 'Cada venta con la mercancía que se le mandó, cada abono y cómo quedó el saldo después, del más viejo al más nuevo. Toca una fila para abrirla.', acts: btn(`${icon('plus')}Abono`, `data-act="form" data-form="abono" data-cli="${esc(sel)}"`, 'sm') + btn(`${icon('plus')}Pedido`, `data-act="form" data-form="venta-mayorista" data-cli="${esc(sel)}"`, 'sm') + btn('Cerrar', `data-act="cli" data-id="${esc(sel)}"`, 'ghost sm') })}</div>` : '';
  return `${head}<div class="clients">${cards}</div>${cuentaCard}${peCard}${kp}
    ${card(sel ? `Pedidos de ${esc(M.cli.get(sel).nombre)}` : 'Pedidos', ped, { acts: sel ? btn('Ver todos', `data-act="cli" data-id="${esc(sel)}"`, 'ghost sm') : '' })}
    <div class="grid g-1-1">
      ${card('Ventas y utilidad', trendLegend() + trendChart(R, Ef, [], { h: 200 }))}
      ${card('Abonos', ab)}
    </div>`;
};

/* =========================================================================
   Desplegables: cada tarjeta de número se abre debajo y explica de dónde
   sale ese número, con todo el detalle (cada fila abre el registro).
   ========================================================================= */
const DET = {};
const rangoTxt = R => R.from === R.to ? `el ${fmtDate(R.from)}` : `del ${fmtDate(R.from)} al ${fmtDate(R.to)}`;
const detP = html => `<p class="det-exp">${html}</p>`;
const detH = t => `<h4 class="ldg-h">${t}</h4>`;
// Filas [texto, valor, { sub, total, act }] — act es un atributo data-act para abrir algo.
const detLedger = rows => `<div class="ledger">${rows.filter(Boolean).map(([l, v, o = {}]) => `<div${o.total ? ' class="total"' : o.act ? ` class="lk" ${o.act} role="button" tabindex="0"` : ''}><span>${l}${o.sub ? `<small>${o.sub}</small>` : ''}</span><b>${v}</b></div>`).join('')}</div>`;
const detCols = (...c) => `<div class="det-cols">${c.filter(Boolean).map(x => `<div>${x}</div>`).join('')}</div>`;
const detIr = (view, label) => `<div class="det-acts">${btn(`${esc(label)} →`, `data-act="nav" data-v="${view}"`, 'sm')}</div>`;
const canalChip = k => `<span class="chip" style="gap:6px"><i style="width:8px;height:8px;border-radius:2px;background:${CANAL[k].color}"></i>${CANAL[k].label}</span>`;
const agrupar = (arr, key) => { const m = new Map(); for (const x of arr) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
const cuentaAttr = (id, M = model()) => id && M.cli.has(id) ? `data-act="cuenta" data-id="${esc(id)}"` : '';
const porRastraTxt = (v, r) => r ? cop(v / r) : '—';

// Lista de ventas: cada una se abre.
function detVentas(E, o = {}) {
  const rows = o.orden === 'util' ? E.slice().sort((a, b) => b.util - a.util) : E.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const max = o.max || 80, vis = rows.slice(0, max), canal = o.canal !== false;
  return table([
    { h: 'Fecha', f: e => `<span class="num">${fmtDate(e.fecha)}</span>` },
    ...(canal ? [{ h: 'Canal', f: e => canalChip(e.canal) }] : []),
    { h: 'Cliente', f: e => `<span class="cell-strong">${esc(e.canal === 'bb' && e.ref.cliente ? `${e.cliente} · ${e.ref.cliente}` : e.cliente)}</span>` },
    { h: 'Mercancía', f: e => detalle(e.lines) },
    { h: 'Rastras', r: 1, f: e => num(e.rastras) },
    { h: o.ventaLbl || 'Venta', r: 1, f: e => cop(e.ingreso) },
    { h: 'Costo', r: 1, f: e => cop(e.costo) },
    { h: 'Utilidad', r: 1, f: e => `${signed(e.util)}<span class="sub">${pct(e.ingreso ? e.util / e.ingreso : NaN)}</span>` },
  ], vis, {
    act: e => editAttr(e.src, e.id), empty: '<p class="muted">No hay ventas en este rango.</p>',
    foot: vis.length > 1 && !o.max ? ['Total', ...(canal ? [''] : []), '', '', num(sum(rows, e => e.rastras)), cop(sum(rows, e => e.ingreso)), cop(sum(rows, e => e.costo)), signed(sum(rows, e => e.util))] : null,
  }) + (rows.length > vis.length && !o.max ? `<p class="muted" style="font-size:12px;margin-top:6px">Se muestran las ${vis.length} más recientes de ${rows.length}.</p>` : '');
}
function detPorCanal(E, o = {}) {
  const tot = sum(E, e => e.ingreso);
  const rows = ['mayorista', 'bb', 'final'].map(k => { const X = E.filter(e => e.canal === k); return { k, n: X.length, ras: sum(X, e => e.rastras), v: sum(X, e => e.ingreso), c: sum(X, e => e.costo), u: sum(X, e => e.util) }; }).filter(r => r.n);
  return table([
    { h: 'Canal', f: r => canalChip(r.k) },
    { h: 'Ventas', r: 1, f: r => num(r.n, 0) },
    { h: 'Rastras', r: 1, f: r => num(r.ras) },
    ...(o.rastra ? [
      { h: 'Venta/rastra', r: 1, f: r => porRastraTxt(r.v, r.ras) },
      { h: 'Costo/rastra', r: 1, f: r => porRastraTxt(r.c, r.ras) },
      { h: 'Utilidad/rastra', r: 1, f: r => r.ras ? `${signed(r.u / r.ras)}<span class="sub">margen ${pct(r.v ? r.u / r.v : NaN)}</span>` : '—' },
    ] : [
      { h: 'Valor', r: 1, f: r => `${cop(r.v)}<span class="sub">${pct(tot ? r.v / tot : NaN)} del total</span>` },
      { h: 'Utilidad', r: 1, f: r => `${signed(r.u)}<span class="sub">margen ${pct(r.v ? r.u / r.v : NaN)}</span>` },
    ]),
  ], rows, { empty: '<p class="muted">Sin ventas en este rango.</p>' });
}
function detPorCliente(E, top = 10) {
  const M = model();
  const g = [...agrupar(E, e => e.ref.clienteId || e.cliente)].map(([k, X]) => ({ k, nombre: X[0].cliente, id: X[0].ref.clienteId || '', n: X.length, v: sum(X, e => e.ingreso), u: sum(X, e => e.util), ras: sum(X, e => e.rastras) })).sort((a, b) => b.v - a.v);
  return table([
    { h: 'Cliente', f: r => `<span class="cell-strong">${esc(r.nombre)}</span>${cuentaAttr(r.id, M) ? '<span class="sub">Toca para ver su ficha</span>' : ''}` },
    { h: 'Ventas', r: 1, f: r => num(r.n, 0) },
    { h: 'Rastras', r: 1, f: r => num(r.ras) },
    { h: 'Valor', r: 1, f: r => cop(r.v) },
    { h: 'Utilidad', r: 1, f: r => signed(r.u) },
  ], g.slice(0, top), { act: r => cuentaAttr(r.id, M), empty: '<p class="muted">Sin ventas en este rango.</p>' });
}
function detPorMedida(E, top = 10) {
  const m = new Map();
  for (const e of E) for (const l of e.lines) {
    const k = medidaOf(l), r = m.get(k) || { k, pzs: 0, ras: 0, v: 0, u: 0 };
    r.pzs += l.unidad === 'rastra' ? 0 : n(l.cant); r.ras += n(l.rastrasT); r.v += n(l.ingreso); r.u += n(l.util); m.set(k, r);
  }
  const rows = [...m.values()].sort((a, b) => b.ras - a.ras).slice(0, top);
  return table([
    { h: 'Medida', f: r => `<span class="cell-strong">${esc(r.k)}</span>` },
    { h: 'Piezas', r: 1, f: r => num(r.pzs, 0) },
    { h: 'Rastras', r: 1, f: r => num(r.ras) },
    { h: 'Valor', r: 1, f: r => cop(r.v) },
    { h: 'Utilidad', r: 1, f: r => `${signed(r.u)}<span class="sub">${r.ras ? cop(r.u / r.ras) + '/rastra · ' : ''}${pct(r.v ? r.u / r.v : NaN)}</span>` },
  ], rows, { empty: '<p class="muted">Sin ventas en este rango.</p>' });
}
function detGastos(R, M = model()) {
  const P = periodo(M, R);
  const G = P.G.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const cats = [...agrupar(P.G, g => g.categoria || 'Otro')].map(([k, X]) => [k, sum(X, g => g.valor), X.length]).sort((a, b) => b[1] - a[1]);
  const gTot = sum(P.G, g => g.valor);
  return detCols(
    detH('Por categoría') + detLedger([
      ...cats.map(([k, v, c]) => [esc(k), cop(v), { sub: `${c} ${c === 1 ? 'registro' : 'registros'}` }]),
      P.pauta ? ['Pauta (Meta)', cop(P.pauta), { sub: `${P.PD.length} ${P.PD.length === 1 ? 'día' : 'días'} con pauta prendida`, act: 'data-act="nav" data-v="pauta"' }] : null,
      P.extras ? ['Nómina extra', cop(P.extras), { sub: `${P.NX.length} ${P.NX.length === 1 ? 'trabajo extra' : 'trabajos extra'}`, act: 'data-act="nav" data-v="nomina"' }] : null,
      ['Total', cop(P.gastos), { total: true }],
    ]),
    P.NX.length ? detH('Trabajos extra de nómina') + detLedger(P.NX.map(x => [`${fmtDay(x.fecha)} · ${esc(M.trab.find(t => t.id === x.trabajadorId)?.nombre || 'Trabajador')}`, cop(x.valor), { sub: esc(x.detalle || x.nota || '') }])) : '',
  ) + detH(`Gastos registrados (${G.length})`) + table([
    { h: 'Fecha', f: g => `<span class="num">${fmtDate(g.fecha)}</span>` },
    { h: 'Categoría', f: g => esc(g.categoria || 'Otro') },
    { h: 'Descripción', f: g => `<span class="muted">${esc(g.descripcion || g.nota || '')}</span>` },
    { h: 'Valor', r: 1, f: g => cop(g.valor) },
  ], G, { act: g => editAttr('gastos', g.id), empty: '<p class="muted">No hay gastos registrados en este rango.</p>', foot: G.length > 1 ? ['Total', '', '', cop(gTot)] : null });
}
function detPinera(M = model()) {
  const cargos = M.ledger.filter(m => m.tipo === 'cargo'), pagos = M.ledger.filter(m => m.tipo === 'pago');
  const L = M.ledger.slice(-20).reverse();
  return detP('Es lo que le debes a la pinera hoy: todas las compras de madera (y lo que la pinera pague por ti, como aserrío o flete) menos tus pagos, incluidos los que un cliente le hizo directo por ti. No depende del rango de fechas.')
    + detCols(detLedger([
      ['Compras a la pinera', cop(sum(cargos, m => m.valor)), { sub: `${cargos.length} compras · ${num(sum(cargos, m => m.rastras))} rastras` }],
      ['− Pagos', cop(sum(pagos, m => m.valor)), { sub: `${pagos.length} pagos` }],
      [M.pineraSaldo >= 0 ? 'Le debes hoy' : 'A tu favor hoy', cop(Math.abs(M.pineraSaldo)), { total: true }],
    ]), '')
    + detH('Últimos movimientos') + table([
      { h: 'Fecha', f: m => `<span class="num">${fmtDate(m.fecha)}</span>` },
      { h: 'Movimiento', f: m => m.tipo === 'cargo' ? `<span class="cell-strong">Compra${m.ref.concepto && m.ref.concepto !== 'Madera' ? ` · ${esc(m.ref.concepto)}` : ''}</span><span class="sub">${m.rastras ? `${num(m.rastras)} rastras · ${cop(m.valor / m.rastras)}/rastra` : esc(m.ref.nota || '')}</span>` : `<span class="cell-strong">Pago</span><span class="sub">${esc([m.ref.medio, m.ref.nota].filter(Boolean).join(' · '))}</span>` },
      { h: 'Compra', r: 1, f: m => m.tipo === 'cargo' ? cop(m.valor) : '' },
      { h: 'Pago', r: 1, f: m => m.tipo === 'pago' ? `<span class="pos">${cop(m.valor)}</span>` : '' },
      { h: 'Saldo', r: 1, f: m => `<b>${cop(m.saldo)}</b>` },
    ], L, { act: m => m.col && m.ref && m.ref.id ? editAttr(m.col, m.ref.id) : '', empty: '<p class="muted">Sin movimientos con la pinera.</p>' })
    + detIr('compras', 'Ver Compras y gastos');
}
function detInventario(M = model()) {
  const inv = [...M.inv.values()].filter(r => r.stock > 0).sort((a, b) => b.stock * b.pv - a.stock * a.pv);
  const p = n(M.cfg.pctSocio), est = estimadoInv(inv, p);
  return detP(`Es lo que hay hoy en ${esc(M.cfg.punto)}: lo despachado menos lo devuelto menos lo vendido. El despacho va sin precio; el valor es un estimado, como si todo se vendiera a precio de venta al cliente final. El precio real se pone en cada venta.`)
    + detCols(
      detH('Si se vende todo a precio de venta') + detLedger([
        ['Venta estimada', cop(est.venta), { sub: `${num(sum(inv, r => r.stock), 0)} piezas · ${num(sum(inv, r => r.stock * r.rastras))} rastras` }],
        ['− Precio de sociedad', cop(est.base)],
        ['= Utilidad de la sociedad', signed(est.util), { total: true }],
        [`Parte de ${esc(M.cfg.socio)} (${100 - p}%)`, signed(est.parteSocio)],
        [`Tu parte (${p}%)`, signed(est.miParte)],
        ['+ Lo que ganas en el precio de sociedad sobre tu costo', signed(est.enPrecio)],
        ['Tu utilidad estimada', signed(est.miParte + est.enPrecio), { total: true }],
      ]),
      detH('Lo que más vale en el punto') + table([
        { h: 'Pieza', f: r => `<span class="cell-strong">${esc(r.nombre)}</span>` },
        { h: 'Quedan', r: 1, f: r => num(r.stock, 0) },
        { h: 'Precio venta', r: 1, f: r => r.pv ? cop(r.pv) : '<span class="muted">—</span>' },
        { h: 'Valor', r: 1, f: r => r.pv ? cop(r.stock * r.pv) : '—' },
      ], inv.slice(0, 12), { empty: '<p class="muted">No hay piezas en el punto.</p>' }),
    ) + detIr('bb', `Ver ${M.cfg.punto}`);
}
function detCobrar(M = model()) {
  const may = [...M.cartera.values()].filter(k => k.saldo > 0.5).sort((a, b) => b.saldo - a.saldo);
  const fav = [...M.cartera.values()].filter(k => k.saldo < -0.5).sort((a, b) => a.saldo - b.saldo);
  const fm = new Map();
  const suma = (x, campo, v, ant = 0) => { const id = x.ref.clienteId || ''; const k = id || x.cliente; const r = fm.get(k) || { id, nombre: x.cliente, desp: 0, pend: 0, ant: 0, ref: x }; r[campo] += v; r.ant += ant; fm.set(k, r); };
  for (const e of M.entries) if (e.canal === 'final' && e.calc.saldo > 0.5) suma(e, 'desp', e.calc.saldo);
  for (const p of M.porEntregar) if (p.canal === 'final' && p.calc.saldo > 0.5) suma(p, 'pend', p.calc.saldo, Math.min(p.calc.pagado, p.calc.total));
  const fin = [...fm.values()].sort((a, b) => (b.desp + b.pend) - (a.desp + a.pend));
  const rub = Math.max(0, M.bbSaldo) + M.bbPorEntregar, tot = M.mayorSaldo + rub + M.finalSaldo;
  return detP(`Es lo que te deben hoy, sin importar el rango de fechas. Mayoristas: sus pedidos (entregados y confirmados) menos sus abonos. ${esc(M.cfg.socio)}: lo que te liquida de las ventas de ${esc(M.cfg.punto)} menos lo que te ha pagado, más las ventas por entregar. Clientes finales: lo que falta de cada pedido después de anticipos y pagos.`)
    + detCols(detLedger([
      ['Mayoristas', cop(M.mayorSaldo), { act: 'data-act="nav" data-v="mayoristas"', sub: `${may.length} ${may.length === 1 ? 'cliente' : 'clientes'}` }],
      [esc(M.cfg.socio), cop(rub), { act: 'data-act="nav" data-v="bb"', sub: `liquidaciones ${cop(Math.max(0, M.bbSaldo), true)} · por entregar ${cop(M.bbPorEntregar, true)}` }],
      ['Clientes finales', cop(M.finalSaldo), { act: 'data-act="nav" data-v="final"', sub: `${fin.length} ${fin.length === 1 ? 'cliente' : 'clientes'}` }],
      ['Total por cobrar', cop(tot), { total: true }],
    ]), fav.length ? detH('Saldo a favor de mayoristas (les debes madera, no plata)') + detLedger(fav.map(k => [esc(k.cliente.nombre), cop(-k.saldo), { act: cuentaAttr(k.cliente.id, M), sub: 'Se descuenta de su próximo pedido' }])) : '')
    + (may.length ? detH('Mayoristas') + table([
      { h: 'Cliente', f: k => `<span class="cell-strong">${esc(k.cliente.nombre)}</span><span class="sub">${k.dias ? `${k.dias} días de crédito` : 'De contado'}</span>` },
      { h: 'Debe', r: 1, f: k => `<b>${cop(k.saldo)}</b>` },
      { h: 'Vencido', r: 1, f: k => k.vencido > 0.5 ? `<span class="neg">${cop(k.vencido)}</span><span class="sub">${k.mora} d de mora</span>` : '<span class="muted">—</span>' },
      { h: 'Por entregar', r: 1, f: k => k.porEntregar > 0.5 ? cop(k.porEntregar) : '<span class="muted">—</span>' },
      { h: 'Próximo vence', f: k => k.prox ? `<span class="num">${fmtDay(k.prox)}</span>` : '<span class="muted">—</span>' },
    ], may, { act: k => cuentaAttr(k.cliente.id, M) }) : '')
    + (fin.length ? detH('Clientes finales') + table([
      { h: 'Cliente', f: r => `<span class="cell-strong">${esc(r.nombre)}</span>` },
      { h: 'Despachado sin pagar', r: 1, f: r => r.desp > 0.5 ? cop(r.desp) : '<span class="muted">—</span>' },
      { h: 'Pedido por entregar', r: 1, f: r => r.pend > 0.5 ? `${cop(r.pend)}${r.ant > 0.5 ? `<span class="sub">ya dio ${cop(r.ant, true)}</span>` : ''}` : '<span class="muted">—</span>' },
      { h: 'Debe', r: 1, f: r => `<b>${cop(r.desp + r.pend)}</b>` },
    ], fin, { act: r => cuentaAttr(r.id, M) || editAttr('ventas', r.ref.id) }) : '');
}

/* ---- Home ---- */
DET['home:ventas'] = R => {
  const M = model(), P = periodo(M, R), Q = S.range === 'todo' ? null : periodo(M, prevRange(R));
  return detP(`Es lo que vendiste ${rangoTxt(R)}: los pedidos de mayoristas entregados, los de clientes finales despachados y, de ${esc(M.cfg.punto)}, lo que ${esc(M.cfg.socio)} te liquida (precio de sociedad más tu parte), no la venta completa del punto. Los pedidos por entregar todavía no cuentan: cuentan cuando salen.${Q ? ` En los ${diffDays(R.from, R.to) + 1} días anteriores fueron ${cop(Q.ingreso)} ${delta(P.ingreso, Q.ingreso)}.` : ''}`)
    + detCols(detH('Por canal') + detPorCanal(P.E), detH('Los que más compraron') + detPorCliente(P.E, 8))
    + detH(`Las ${P.E.length} ${P.E.length === 1 ? 'venta' : 'ventas'}`) + detVentas(P.E);
};
DET['home:utilidad'] = R => {

DET['home:rastras'] = R => {

};
DET['home:porRastra'] = R => {
  const M = model(), P = periodo(M, R), r = P.rastras, costo = sum(P.E, e => e.costo);
  return detP(`Es la utilidad neta dividida por las rastras vendidas ${rangoTxt(R)}: cuánto te queda limpio por cada rastra. El porcentaje es el margen: de cada $100 que vendes, cuánto te queda.`)
    + detCols(detLedger([
      ['Precio promedio por rastra', porRastraTxt(P.ingreso, r), { sub: `${cop(P.ingreso)} ÷ ${num(r)} rastras` }],
      ['− Costo promedio por rastra', porRastraTxt(costo, r), { sub: 'Pinera + mano de obra' }],
      ['= Utilidad bruta por rastra', r ? signed(P.utilB / r) : '—', { total: true, sub: `margen ${pct(P.ingreso ? P.utilB / P.ingreso : NaN)}` }],
      ['− Gastos por rastra', porRastraTxt(P.gastos, r), { sub: `${cop(P.gastos)} de gastos, pauta y extras · ${pct(P.ingreso ? P.gastos / P.ingreso : NaN)} de la venta` }],
      ['= Utilidad neta por rastra', r ? signed(P.utilN / r) : '—', { total: true, sub: `margen ${pct(P.ingreso ? P.utilN / P.ingreso : NaN)}` }],

DET['home:cobrar'] = () => detCobrar();
DET['home:pinera'] = () => detPinera();

DET['home:gastos'] = R => detP(`Son los gastos ${rangoTxt(R)} que se restan de la utilidad: los que registras (flete, transporte, herramientas…), la pauta de Meta de los días que estuvo prendida y los trabajos extra de la nómina. La mano de obra por rastra no está aquí: ya va en el costo de la madera.`) + detGastos(R);

/* ---- Mayoristas ---- */
const mayE = R => { const M = model(), sel = S.filterCli && M.cli.has(S.filterCli) ? S.filterCli : ''; return M.entries.filter(e => e.canal === 'mayorista' && inR(e.fecha, R) && (!sel || e.ref.clienteId === sel)); };
const selTxt = () => { const c = S.filterCli && model().cli.get(S.filterCli); return c ? ` de ${esc(c.nombre)}` : ''; };
DET['may:ventas'] = R => { const E = mayE(R); return detP(`Son los pedidos de mayoristas${selTxt()} entregados ${rangoTxt(R)}, a precio de su lista (más el flete que se les cobra). Los pedidos por entregar ya cuentan como deuda, pero cuentan como venta cuando se entregan.`) + detH('Por cliente') + detPorCliente(E) + detH('Pedidos') + detVentas(E, { canal: false }); };

  const E = mayE(R), v = sum(E, e => e.ingreso), c = sum(E, e => e.costo);

    + detCols(detLedger([['Ventas', cop(v)], ['− Costo de la madera y fletes', cop(c)], ['= Utilidad', signed(v - c), { total: true, sub: `margen ${pct(v ? (v - c) / v : NaN)}` }]]), detH('Por cliente') + detPorCliente(E))
    + detH('Pedidos que más dejaron') + detVentas(E, { canal: false, orden: 'util', max: 10 });
};
DET['may:rastras'] = R => { const E = mayE(R); return detP(`Rastras de los pedidos de mayoristas${selTxt()} entregados ${rangoTxt(R)}. Una rastra = ancho × grueso × largo ÷ 240.`) + detCols(detH('Por medida') + detPorMedida(E, 12), detH('Por cliente') + detPorCliente(E)); };

    + table([
      { h: 'Cliente', f: k => `<span class="cell-strong">${esc(k.cliente.nombre)}</span><span class="sub">${k.dias ? `${k.dias} días de crédito` : 'De contado'} · toca para ver su historial</span>` },
      { h: 'Saldo', r: 1, f: k => saldoTxt(k.saldo) },
      { h: 'Vencido', r: 1, f: k => k.vencido > 0.5 ? `<span class="neg">${cop(k.vencido)}</span><span class="sub">${k.mora} d de mora</span>` : '<span class="muted">—</span>' },
      { h: 'Por entregar', r: 1, f: k => k.porEntregar > 0.5 ? cop(k.porEntregar) : '<span class="muted">—</span>' },

/* ---- Barro Blanco ---- */
DET['bb:debe'] = () => {
  const M = model(), liq = sum(M.bbEntries, e => e.ingreso), pag = sum(M.d.bbPagos, p => p.valor);

    + detCols(detLedger([
      ['Liquidaciones de ventas entregadas', cop(liq), { sub: `${M.bbEntries.length} ${M.bbEntries.length === 1 ? 'venta' : 'ventas'}` }],

    + (PB.length ? detH('Ventas por entregar') + table([
      { h: 'Entrega', f: x => `<span class="num">${fmtDate(x.fecha)}</span>` },
      { h: 'Cliente', f: x => `<span class="cell-strong">${esc(x.ref.cliente || '—')}</span><span class="sub">${detalle(x.lines)}</span>` },
      { h: 'Venta', r: 1, f: x => cop(x.calc.venta) },
      { h: 'Te liquida', r: 1, f: x => `<b>${cop(x.calc.debe)}</b>` },
    ], PB, { act: x => editAttr('bbVentas', x.id) }) : '');
};
const bbR = R => model().bbEntries.filter(e => inR(e.fecha, R));
const bbVentasTabla = E => table([
  { h: 'Fecha', f: e => `<span class="num">${fmtDate(e.fecha)}</span>` },

DET['bb:vendido'] = R => { const M = model(), E = bbR(R); return detP(`Es lo que se vendió en la sociedad ${rangoTxt(R)} (ventas entregadas), al precio real de cada venta. Del punto o con despacho directo.`) + detCols(detLedger([['Venta', cop(sum(E, e => e.calc.venta))], ['Rastras', num(sum(E, e => e.rastras))], ['Piezas', num(sum(E, e => e.piezas), 0)]]), detH('Por medida') + detPorMedida(E, 8)) + detH('Ventas') + bbVentasTabla(E) + detIr('bb', `Ver ${M.cfg.punto}`); };
DET['bb:util'] = R => {
  const M = model(), E = bbR(R), k = f => sum(E, e => f(e.calc)), p = n(M.cfg.pctSocio);

    + detCols(detLedger([

DET['bb:inv'] = () => detInventario();

/* ---- Cliente final ---- */

DET['fin:util'] = R => { const E = finE(R), v = sum(E, e => e.ingreso), c = sum(E, e => e.costo); return detP(`Es lo que te dejan los pedidos de clientes finales ${rangoTxt(R)}: el valor menos tu costo real de la madera y el flete que pagaste. Los gastos generales y la pauta se restan en la utilidad neta de Home.`) + detCols(detLedger([['Ventas', cop(v)], ['− Costo de la madera y fletes', cop(c)], ['= Utilidad', signed(v - c), { total: true, sub: `margen ${pct(v ? (v - c) / v : NaN)}` }]]), detH('Por cliente') + detPorCliente(E)) + detH('Pedidos que más dejaron') + detVentas(E, { canal: false, orden: 'util', max: 10 }); };

    { h: 'Fecha', f: m => `<span class="num">${fmtDate(m.fecha)}</span>` },

DET['com:gastos'] = R => DET['home:gastos'](R);

/* ---- Nómina ---- */
DET['nom:debes'] = () => {
  const M = model();
  return detP('Es lo que le debes hoy a cada trabajador: cada viaje suma sus rastras por la tarifa (aserrada o arriada), los trabajos extra también suman y cada abono resta. Si le pagaste de más, queda como adelanto. Toca un trabajador para ver todo su historial.')
    + table([
      { h: 'Trabajador', f: t => `<span class="cell-strong">${esc(t.nombre)}</span><span class="sub">${esc(t.concepto === 'aserrada' ? 'Aserrada' : t.concepto === 'arriada' ? 'Arriada' : t.concepto || '')}</span>` },
      { h: 'Por viajes', r: 1, f: t => cop(sum(M.nominaMovs.filter(m => m.trabajadorId === t.id && m.tipo === 'devengo'), m => m.valor)) },
      { h: 'Extras', r: 1, f: t => cop(sum(M.nominaMovs.filter(m => m.trabajadorId === t.id && m.tipo === 'cargo'), m => m.valor)) },

      { h: 'Saldo', r: 1, f: t => { const v = M.nominaSaldo.get(t.id) || 0; return v < -0.5 ? `<span class="pos">Adelanto ${cop(-v)}</span>` : `<b>${cop(v)}</b>`; } },
    ], M.trab, { act: t => `data-act="trab" data-id="${esc(t.id)}"` });
};
const viajesTabla = (X, M = model()) => table([
  { h: 'Fecha', f: x => `<span class="num">${fmtDate(x.fecha)}</span>` },
  { h: 'Viaje', f: x => `<span class="cell-strong">${esc(x.destino || '')}</span><span class="sub">${esc(x.remision ? 'Remisión ' + x.remision : '')}</span>` },
  { h: 'Rastras', r: 1, f: x => num(x.rastras) },
  ...M.trab.map(t => ({ h: esc(t.nombre), r: 1, f: x => cop(x.rastras * tarifaTrab(t, x.ref, M.cfg)) })),
], X.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')), { empty: '<p class="muted">No hay viajes en este rango.</p>', foot: X.length > 1 ? ['Total', '', num(sum(X, x => x.rastras)), ...M.trab.map(t => cop(sum(X, x => x.rastras * tarifaTrab(t, x.ref, M.cfg))))] : null });
DET['nom:semana'] = () => { const M = model(), sab = sabadoDe(M.hoy), dom = addDays(sab, -6), X = M.despachos.filter(x => x.fecha >= dom && x.fecha <= sab); return detP(`Los viajes de esta semana (del ${fmtDay(dom)} al sábado ${fmtDay(sab)}) y lo que suma cada uno a cada trabajador.`) + viajesTabla(X, M); };
DET['nom:periodo'] = R => { const M = model(), X = M.despachos.filter(x => inR(x.fecha, R)); return detP(`Es lo que se ganaron los trabajadores ${rangoTxt(R)}: rastras de cada viaje por la tarifa de cada uno (más los trabajos extra). Ya está dentro del costo de la madera, por eso no se resta otra vez de la utilidad.`) + viajesTabla(X, M); };
DET['nom:pagado'] = R => {
  const M = model(), Pg = M.nominaMovs.filter(m => m.tipo === 'pago' && inR(m.fecha, R)).slice().reverse();
  return detP(`Los abonos a los trabajadores ${rangoTxt(R)}.`) + table([
    { h: 'Fecha', f: m => `<span class="num">${fmtDate(m.fecha)}</span>` },
    { h: 'Trabajador', f: m => `<span class="cell-strong">${esc(M.trab.find(t => t.id === m.trabajadorId)?.nombre || '—')}</span><span class="sub">${esc([m.medio, m.nota, m.detalle].filter(Boolean).join(' · '))}</span>` },
    { h: 'Valor', r: 1, f: m => cop(m.valor) },
  ], Pg, { act: m => m.col && m.id ? editAttr(m.col, m.id) : '', empty: '<p class="muted">No hay abonos en este rango.</p>', foot: Pg.length > 1 ? ['Total', '', cop(sum(Pg, m => m.valor))] : null });
};

/* ---- Remisiones ---- */
const remR = R => model().d.remisiones.filter(r => inR(r.fecha, R)).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
const remTabla = E => table([
  { h: 'Fecha', f: r => `<span class="num">${fmtDate(r.fecha)}</span>` },
  { h: 'Remisión', f: r => `<span class="cell-strong">${esc(r.numero || 'Sin número')}</span>` },
  { h: 'Para quién', f: r => (r.destinos || []).map(x => `${esc(x.nombre)} <span class="muted">(${num(x.piezas, 0)} pzs · ${cop(x.valor, true)}${x.estimado ? ' estimado' : ''})</span>`).join('<br>') },
  { h: 'Rastras', r: 1, f: r => num(r.rastras) },

], E, { act: r => editAttr('remisiones', r.id), empty: '<p class="muted">No hay remisiones en este rango.</p>', foot: E.length > 1 ? ['Total', '', '', num(sum(E, r => r.rastras)), cop(sum(E, r => r.valor))] : null });
const remPorDestino = E => {
  const g = new Map();
  for (const r of E) for (const x of r.destinos || []) { const k = x.tipo === 'bb' ? 'Barro Blanco (estimado)' : x.nombre; const o = g.get(k) || { k, n: 0, pzs: 0, ras: 0, v: 0 }; o.n++; o.pzs += n(x.piezas); o.ras += n(x.rastras); o.v += n(x.valor); g.set(k, o); }

/* ---- Ficha del cliente: sus datos, lo que ha comprado y cómo compra ---- */
function fichaCliente(cid, M = model()) {
  const c = M.cli.get(cid); if (!c) return '';

  const fechas = E.map(e => e.fecha).filter(isDate).sort();
  const gaps = fechas.slice(1).map((f, i) => diffDays(fechas[i], f));
  const cada = gaps.length ? Math.round(sum(gaps, x => x) / gaps.length) : 0;
  const v = sum(E, e => e.ingreso), u = sum(E, e => e.util), ras = sum(E, e => e.rastras);
  const lista = M.listas.get(fin ? M.cfg.listaFinal : c.listaId);

  for (const e of E) for (const l of e.lines) if (l.unidad !== 'rastra') { const m = `${medidaOf(l)} × ${num(l.largo, 2)} m`; med.set(m, (med.get(m) || 0) + n(l.cant)); }

  return `<div class="ficha">
    <div class="ficha-d">${datos.map(d => `<span>${d}</span>`).join('')}${c.celular ? `<span class="num">${esc(c.celular)}</span>${waLink(c.celular)}` : ''}</div>
    <div class="inv-res ficha-k">
      <div><span>Ha comprado</span><b>${cop(v, true)}</b><small>${E.length} ${E.length === 1 ? 'pedido' : 'pedidos'}${PE.length ? ` + ${PE.length} por entregar` : ''}</small></div>
      <div><span>Te ha dejado</span><b class="${u < 0 ? 'neg' : ''}">${cop(u, true)}</b><small>margen ${pct(v ? u / v : NaN)}</small></div>
      <div><span>Rastras</span><b>${num(ras)}</b><small>${ras ? `${cop(u / ras)} de utilidad por rastra · ${pct(v ? u / v : NaN)}` : '—'}</small></div>
      <div><span>Pedido promedio</span><b>${cop(E.length ? v / E.length : 0, true)}</b><small>${num(E.length ? ras / E.length : 0)} rastras por pedido</small></div>
      <div><span>Primera compra</span><b>${fechas[0] ? fmtDay(fechas[0]) : '—'}</b><small>${fechas[0] ? fechas[0].slice(0, 4) : ''}</small></div>
      <div><span>Última compra</span><b>${fechas.length ? fmtDay(fechas[fechas.length - 1]) : '—'}</b><small>${cada ? `compra cada ${cada} días en promedio` : fechas.length ? `hace ${diffDays(fechas[fechas.length - 1], M.hoy)} días` : ''}</small></div>

/* ---------- Estado de cuenta de un cliente: compras y abonos con el saldo después de cada uno ---------- */
function cuentaMovs(cid, M = model()) {
  const c = M.cli.get(cid); if (!c) return null;
  const movs = [], fin = c.tipo === 'final';
  const det = k => `${num(k.piezas, 0)} pzs · ${num(k.rastras)} rastras`;
  for (const v of M.d.ventas.filter(v => v.clienteId === cid && v.canal === (fin ? 'final' : 'mayorista'))) {
    const k = calcVenta(v);
    movs.push({ fecha: v.fecha, orden: v.creado || '', concepto: v.remision ? `Compra · remisión ${v.remision}` : 'Compra', sub: det(k), lines: k.lines, flete: k.flete, cargo: k.total, por:fin ? (v.estado || 'Pendiente') === 'Pendiente' : v.estado === 'Por entregar', col: 'ventas', id: v.id });
    if (fin) for (const pg of v.pagos || []) movs.push({ fecha: pg.fecha || v.fecha, orden: (v.creado || '') + '~', concepto: 'Pago', sub: 'Registrado en el pedido', abono: n(pg.valor), col: 'ventas', id: v.id });
  }
  if (fin) for (const a of M.d.anticipos.filter(a => a.clienteId === cid)) movs.push({ fecha: a.fecha, orden: a.creado || '', concepto: 'Anticipo', sub: [a.medio, a.nota].filter(Boolean).join(' · '), abono: n(a.valor), col: 'anticipos', id: a.id });
  else for (const a of M.d.abonos.filter(a => a.clienteId === cid)) movs.push({ fecha: a.fecha, orden: a.creado || '', concepto: 'Abono', sub: [a.medio, destinoTxt(a, M), a.nota].filter(Boolean).join(' · '), abono: n(a.valor), col: 'abonos', id: a.id });
  movs.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '') || (a.orden || '').localeCompare(b.orden || ''));
  const si = fin ? 0 : n(c.saldoInicial);
  let saldo = si;
  for (const m of movs) { saldo += n(m.cargo) - n(m.abono); m.saldo = saldo; }
  const siFecha = isDate(c.saldoInicialFecha) ? c.saldoInicialFecha : String(c.creado || '').slice(0, 10);
  const ultAbono = movs.filter(m => m.abono > 0).pop() || null;
  return { c, si, siFecha, movs, ultAbono, compras: sum(movs, m => n(m.cargo)), abonos: sum(movs, m => n(m.abono)), saldo };
}
const saldoCelda = s => `<b class="num ${s > 0.5 ? 'neg' : s < -0.5 ? 'pos' : 'muted'}">${cop(Math.abs(s))}</b><span class="sub">${s > 0.5 ? 'debe' : s < -0.5 ? 'a favor' : 'al día'}</span>`;

    { h: 'Cobro al cliente', f: e => cobroChip(e.ref) },
  ], E, { act: e => editAttr('bbVentas', e.id), empty: '<p>No hay ventas reportadas en este período.</p>' });
  const D0 = M.d.bbDespachos.filter(x => inR(x.fecha, R)).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const dt = table([

  const pt = table([

    { h: 'Nota', f: x => `<span class="muted">${esc(x.nota || '')}</span>` },

  return `${head}${kp}${pbCard}

    <div class="grid g-1-1">

    </div>

    ${card('Despachos y devoluciones', dt, { acts: addBtn('Despacho', 'bb-despacho') + addBtn('Devolución', 'bb-devolucion') })}`;

/* ---------- Cliente final ---------- */
const waLink = cel => { const d = String(cel || '').replace(/\D/g, ''); if (d.length < 7) return ''; const full = d.length === 10 ? '57' + d : d; return `<a href="https://wa.me/${full}" target="_blank" rel="noopener" class="chip good" style="text-decoration:none">WhatsApp</a>`; };
VIEW_FN.final = R => {
  const M = model();
  const head = `<div class="section-h"><p>Personas, constructoras y arquitectos que compran directo: a quién, a dónde se entrega, cuánto dieron de anticipo y cuánto falta por pagar. Un pedido confirmado ya es lo que te deben (menos el anticipo); cuenta como venta cuando lo marques despachado.</p><div class="acts">${addBtn('Pedido', 'venta-final', 'primary sm')}${addBtn('Anticipo', 'anticipo')}${addBtn('Cliente', 'cliente-final')}</div></div>`;
  const all = M.entries.filter(e => e.canal === 'final');
  const pend = M.porEntregar.filter(p => p.canal === 'final');

  // Directorio: clientes guardados + los que solo aparecen en pedidos.
  const dir = new Map();
  const nuevo = (o = {}) => ({ id: '', nombre: 'Sin nombre', empresa: '', oficio: '', celular: '', municipio: '', n: 0, total: 0, saldo: 0, anticipo: 0, pend: 0, ultima: '', ...o });
  for (const c of M.finales) dir.set('id:' + c.id, nuevo({ id: c.id, nombre: c.nombre, empresa: c.empresa || '', oficio: c.oficio || '', celular: c.celular || '', municipio: c.municipio || '', anticipo: M.anticipoLibre.get(c.id) || 0 }));
  const keyOf = v => { const c = v.cliente || {}; return v.clienteId && dir.has('id:' + v.clienteId) ? 'id:' + v.clienteId : (String(c.celular || '').replace(/\D/g, '') || (c.nombre || '').toLowerCase()); };
  for (const e of all) {
    const key = keyOf(e.ref), c = e.ref.cliente || {};
    const r = dir.get(key) || nuevo({ nombre: c.nombre || 'Sin nombre', celular: c.celular || '', municipio: c.municipio || '' });
    r.n++; r.total += e.ingreso; r.saldo += Math.max(0, e.calc.saldo); if ((e.fecha || '') > r.ultima) r.ultima = e.fecha; dir.set(key, r);
  }
  for (const p of pend) {
    const key = keyOf(p.ref), c = p.ref.cliente || {};
    const r = dir.get(key) || nuevo({ nombre: c.nombre || 'Sin nombre', celular: c.celular || '', municipio: c.municipio || '' });
    r.pend++; r.anticipo += Math.min(p.calc.pagado, p.calc.total); r.saldo += Math.max(0, p.calc.saldo); dir.set(key, r);
  }
  const dt = table([
    { h: 'Cliente', f: r => `<span class="cell-strong">${esc(r.nombre)}</span><span class="sub">${esc([r.empresa !== r.nombre ? r.empresa : '', r.oficio && r.oficio !== 'Persona' ? r.oficio : ''].filter(Boolean).join(' · '))}</span>` },
    { h: 'Municipio', f: r => esc(r.municipio || '—') },
    { h: 'Celular', f: r => `<span class="num">${esc(r.celular || '—')}</span>${waLink(r.celular)}` },
    { h: 'Pedidos', r: 1, f: r => r.n || !r.pend ? `${num(r.n, 0)}${r.pend ? `<span class="sub">+${r.pend} por entregar</span>` : ''}` : `<span class="sub">${r.pend} por entregar</span>` },
    { h: 'Comprado', r: 1, f: r => cop(r.total) },
    { h: 'Anticipo', r: 1, f: r => r.anticipo > 0.5 ? cop(r.anticipo) : '<span class="muted">—</span>' },
    { h: 'Debe', r: 1, f: r => r.saldo > 0.5 ? `<span class="neg">${cop(r.saldo)}</span>` : '<span class="muted">$0</span>' },
    { h: '', f: r => r.id ? `<button type="button" class="icon-btn" data-act="cli-menu" data-id="${esc(r.id)}" aria-label="Opciones de ${esc(r.nombre)}" aria-haspopup="true">${icon('dots')}</button>` : '' },
  ], [...dir.values()].sort((a, b) => b.total - a.total || a.nombre.localeCompare(b.nombre)), {
    act: r => r.id ? `data-act="cuenta" data-id="${esc(r.id)}" title="Ver el historial de ${esc(r.nombre)}"` : '',
    empty: emptyState('Sin clientes finales', 'Guarda a tus clientes para elegirlos rápido al hacer un pedido.', addBtn('Cliente final', 'cliente-final', '')),
  });
  const dirCard = card('Directorio de clientes', dt, { sub: 'Toca un cliente para ver su historial: lo que se le vendió, lo que ha pagado y lo que debe. Con los tres puntos lo editas o le cargas un pedido o un anticipo.', acts: addBtn('Cliente', 'cliente-final') });

  if (!all.length && !pend.length && !M.d.anticipos.length) return head + card('', emptyState('Todavía no hay pedidos de clientes finales', 'Registra el primer pedido: elige el cliente o escribe su nombre, celular y dirección. Si te da un anticipo, cárgalo con el botón Anticipo.', addBtn('Pedido de cliente final', 'venta-final', '') + addBtn('Anticipo', 'anticipo', ''))) + dirCard;

  const E = all.filter(e => inR(e.fecha, R));
  const ing = sum(E, e => e.ingreso), ut = sum(E, e => e.util);
  const kp = `<div class="kpis">
    ${kpi('Pedidos despachados', num(E.length, 0), `${num(sum(E, e => e.piezas), 0)} piezas · ${num(sum(E, e => e.rastras))} rastras`, { dot: 'var(--s3)', det: 'fin:pedidos' })}
    ${kpi('Ventas', cop(ing), `Ticket promedio ${cop(E.length ? ing / E.length : 0)}`, { det: 'fin:ventas' })}
    ${kpi('Utilidad', signed(ut), `Margen ${pct(ing ? ut / ing : NaN)}`, { det: 'fin:util' })}
    ${kpi('Por cobrar hoy', cop(M.finalSaldo), `${M.finalPorEntregar > 0.5 ? `${cop(M.finalPorEntregar, true)} de pedidos por entregar` : `${(k => `${k} ${k === 1 ? 'pedido despachado' : 'pedidos despachados'} con saldo`)(all.filter(e => e.calc.saldo > 0.5).length)}`}${M.anticiposFinal > 0.5 ? ` · ya restados ${cop(M.anticiposFinal, true)} de anticipos` : ''}`, { det: 'fin:cobrar' })}
  </div>`;

  const pc = pend.length ? card('Por entregar', table([
    { h: 'Entrega', f: p => { const dd = diffDays(M.hoy, p.fecha); return `<span class="num">${fmtDate(p.fecha)}</span><span class="sub">${dd < 0 ? `hace ${-dd} d` : dd === 0 ? 'hoy' : `en ${dd} d`}</span>`; } },
    { h: 'Cliente', f: p => `<span class="cell-strong">${esc(p.cliente)}</span><span class="sub">${esc(p.ref.cliente?.municipio || '')}</span>` },
    { h: 'Detalle', f: p => detalle(p.lines) },
    { h: 'Total', r: 1, f: p => cop(p.calc.total) },
    { h: 'Anticipo', r: 1, f: p => p.calc.pagado > 0.5 ? `${cop(p.calc.pagado)}<span class="sub">${pct(p.calc.pagado / p.calc.total)}</span>` : '<span class="muted">Sin anticipo</span>' },
    { h: 'Cobrar al entregar', r: 1, f: p => `<b>${cop(Math.max(0, p.calc.saldo))}</b>` },
    { h: '', f: p => p.ref.clienteId ? btn(`${icon('plus')}Anticipo`, `data-act="form" data-form="anticipo" data-cli="${esc(p.ref.clienteId)}" data-pedido="${esc(p.id)}"`, 'sm') : '' },
  ], pend, { act: p => editAttr('ventas', p.id), foot: pend.length > 1 ? ['Total', '', '', cop(sum(pend, p => p.calc.total)), cop(sum(pend, p => p.calc.pagado)), cop(sum(pend, p => Math.max(0, p.calc.saldo))), ''] : null }),
    { sub: 'Pedidos confirmados que todavía no salen. Lo que falta después del anticipo ya es lo que te deben. Cuando salgan, ábrelos y márcalos como despachados: ahí cuentan como venta.' }) : '';

  const tone = { Pendiente: 'warn', Despachado: '', Entregado: 'good' };
  const t = table([
    { h: 'Fecha', f: e => `<span class="num">${fmtDate(e.fecha)}</span>` },
    { h: 'Cliente', f: e => `<span class="cell-strong">${esc(e.cliente)}</span><span class="sub">${esc(e.ref.cliente?.celular || '')}</span>` },
    { h: 'Entrega', f: e => `${esc(e.ref.cliente?.municipio || '—')}<span class="sub">${esc(e.ref.cliente?.direccion || '')}</span>` },
    { h: 'Detalle', f: e => detalle(e.lines) },
    { h: 'Total', r: 1, f: e => cop(e.ingreso) },
    { h: 'Utilidad', r: 1, f: e => signed(e.util) },
    { h: 'Pagado', r: 1, f: e => e.calc.pagado > 0.5 ? cop(e.calc.pagado) : '<span class="muted">$0</span>' },
    { h: 'Debe', r: 1, f: e => e.calc.saldo > 0.5 ? `<span class="neg">${cop(e.calc.saldo)}</span>` : '<span class="muted">$0</span>' },
    { h: 'Estado', f: e => `<div class="pills">${chip(tone[e.ref.estado] ?? '', e.ref.estado || 'Despachado')}${e.calc.saldo <= 0.5 ? chip('good', 'Pagado', 'check') : ''}</div>` },
  ], E, { act: e => editAttr('ventas', e.id), empty: '<p>No hay pedidos despachados en este período.</p>' });

  const A = M.d.anticipos.filter(a => inR(a.fecha, R)).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const ped = id => [...all, ...pend].find(p => p.id === id);
  const ta = table([
    { h: 'Fecha', f: a => `<span class="num">${fmtDate(a.fecha)}</span>` },
    { h: 'Cliente', f: a => esc(M.cli.get(a.clienteId)?.nombre || '—') },
    { h: 'Pedido', f: a => { const p = ped(a.pedidoId); return p ? `${detalle(p.lines)}<span class="sub">Total ${cop(p.calc.total)}</span>` : '<span class="muted">Sin pedido: se aplica al más viejo</span>'; } },
    { h: 'Medio', f: a => `${esc(a.medio || '—')}${a.nota ? `<span class="sub">${esc(a.nota)}</span>` : ''}` },
    { h: 'Comprobante', f: a => tieneFoto(a) ? fotoThumb(a, 'comprobante') : '<span class="muted">—</span>' },
    { h: 'Valor', r: 1, f: a => cop(a.valor) },
  ], A, { act: a => editAttr('anticipos', a.id), empty: '<p>No hay anticipos en este período.</p>', foot: A.length > 1 ? ['Total', '', '', '', '', cop(sum(A, a => a.valor))] : null });

  return `${head}${kp}${pc}${card('Pedidos despachados', t)}
    ${card('Anticipos', ta, { sub: 'Plata que te dan antes de entregar. Se descuenta del pedido al que la cargues.', acts: addBtn('Anticipo', 'anticipo') })}
    ${dirCard}
    ${card('Ventas y utilidad', trendLegend() + trendChart(R, E, [], { h: 200 }))}`;

/* ---------- Minas: se le compra a Madelistas con descuento y se le revende a los revendedores de las minas ---------- */
const MINA_ESTADOS = ['En Madelistas', 'Listo para entregar', 'Entregado'];
const minaCfg = () => ({ descuento: 5, proveedor: 'Madelistas (Wilson Orozco)', listaFecha: '', lista: {}, venta: {}, ...(CFG().minas || {}) });
const minaLista = () => ({ precios: minaCfg().lista || {} });
const minaVenta = () => ({ precios: minaCfg().venta || {} });
// Precio de Madelistas a cliente final y lo que te cuesta a ti con el descuento.
const minaPLista = (med, L) => listaPrecio(minaLista(), med, L);
const minaCostoU = (plista, desc = minaCfg().descuento) => Math.round(n(plista) * (1 - n(desc) / 100));
function calcMina(p) {
  const items = (p.items || []).map(l => ({ ...l, cant: n(l.cant), venta: n(l.cant) * n(l.precio), costoT: n(l.cant) * n(l.costo) }));
  const madera = sum(items, l => l.venta), costoMadera = sum(items, l => l.costoT);
  const venta = madera + n(p.flete), costo = costoMadera + n(p.costoFlete);
  const pagos = (D().minasPagos || []).filter(x => x.pedidoId === p.id);
  const pagadoProv = sum(pagos.filter(x => x.tipo !== 'cliente'), x => x.valor);
  const cobrado = sum(pagos.filter(x => x.tipo === 'cliente'), x => x.valor);
  return {
    items, piezas: sum(items, l => l.cant), rastras: sum(items, l => l.cant * n(l.rastras)), madera, costoMadera, venta, costo, util: venta - costo,
    pagadoProv, debeProv: costoMadera - pagadoProv, cobrado, porCobrar: venta - cobrado,
    sinPrecio: items.some(l => !n(l.precio)), sinCosto: items.some(l => !n(l.costo)),
  };
}
const minaPedidos = () => (D().minasPedidos || []).slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
const minaNombre = p => p.revendedor || 'Revendedor sin nombre';

VIEW_FN.minas = () => {
  const mc = minaCfg(), hoy = todayStr();
  const head = `<div class="section-h"><p>Madera que le compras a ${esc(mc.proveedor)} con ${num(mc.descuento, 1)} % de descuento sobre su lista de cliente final y le revendes a los revendedores que le venden a las minas.</p><div class="acts">${addBtn('Pedido', 'mina-pedido', 'primary sm')}${addBtn('Pago a Madelistas', 'mina-pago')}${addBtn('Pago del revendedor', 'mina-cobro')}</div></div>`;
  const rows = minaPedidos().map(p => ({ p, k: calcMina(p) }));
  const activos = rows.filter(r => r.p.estado !== 'Entregado');
  const tot = (arr, f) => sum(arr, f);
  const sinPrecio = rows.filter(r => r.k.sinPrecio).length, sinCosto = rows.filter(r => r.k.sinCosto).length;
  const venta = tot(rows, r => r.k.venta), costo = tot(rows, r => r.k.costo), util = venta - costo;
  const kp = `<div class="kpis">
    ${kpi('Pedidos en curso', num(activos.length, 0), `${num(tot(activos, r => r.k.piezas), 0)} piezas · ${num(tot(activos, r => r.k.rastras))} rastras`, { dot: 'var(--s2)' })}
    ${kpi('Venta a revendedores', cop(venta), `Costo Madelistas ${cop(costo)}${sinPrecio ? ` · ${sinPrecio} sin precio de venta` : ''}`)}
    ${kpi('Utilidad', signed(util), `Margen ${pct(venta ? util / venta : NaN)}${sinCosto ? ' · falta costo de alguna pieza' : ''}`)}
    ${kpi('Le debes a Madelistas', cop(Math.max(0, tot(rows, r => r.k.debeProv))), `Por cobrar a revendedores ${cop(Math.max(0, tot(rows, r => r.k.porCobrar)))}`)}
  </div>`;

  const tone = { 'En Madelistas': 'warn', 'Listo para entregar': 'wood', Entregado: 'good' };
  const tp = table([
    { h: 'Pedido', f: r => `<span class="num">${fmtDate(r.p.fecha)}</span><span class="sub">${esc(minaNombre(r.p))}</span>` },
    { h: 'Detalle', f: r => detalle(r.k.items) },
    { h: 'Entrega', f: r => { if (r.p.estado === 'Entregado') return `<span class="num">${fmtDate(r.p.entregado || r.p.entrega)}</span>`; if (!isDate(r.p.entrega)) return '<span class="muted">Sin fecha</span>'; const dd = diffDays(hoy, r.p.entrega); return `<span class="num">${fmtDate(r.p.entrega)}</span><span class="sub">${dd < 0 ? `atrasado ${-dd} d` : dd === 0 ? 'hoy' : `en ${dd} d`} · aprox.</span>`; } },
    { h: 'Venta', r: 1, f: r => r.k.sinPrecio ? `${cop(r.k.venta)}<span class="sub">falta precio</span>` : cop(r.k.venta) },
    { h: 'Costo', r: 1, f: r => `${cop(r.k.costo)}<span class="sub">Madelistas −${num(r.p.descuento ?? mc.descuento, 1)} %</span>` },
    { h: 'Utilidad', r: 1, f: r => `${signed(r.k.util)}<span class="sub">${pct(r.k.venta ? r.k.util / r.k.venta : NaN)}</span>` },
    { h: 'Madelistas', r: 1, f: r => r.k.debeProv > 0.5 ? `<span class="neg">debes ${cop(r.k.debeProv)}</span><span class="sub">pagado ${cop(r.k.pagadoProv)}</span>` : chip('good', 'Pagado', 'check') },
    { h: 'Revendedor', r: 1, f: r => r.k.porCobrar > 0.5 ? `<span class="${r.p.estado === 'Entregado' ? 'neg' : ''}">debe ${cop(r.k.porCobrar)}</span><span class="sub">pagó ${cop(r.k.cobrado)}</span>` : chip('good', 'Pagó', 'check') },
    { h: 'Estado', f: r => chip(tone[r.p.estado] ?? '', r.p.estado || MINA_ESTADOS[0]) },
  ], rows, {
    act: r => editAttr('minasPedidos', r.p.id),
    empty: emptyState('Todavía no hay pedidos de minas', 'Registra el primero: revendedor, piezas, fecha de entrega aproximada y precio de venta. El costo sale solo de la lista de Madelistas con el descuento.', addBtn('Pedido de minas', 'mina-pedido', '')),
    foot: rows.length > 1 ? ['Total', '', '', cop(venta), cop(costo), signed(util), cop(Math.max(0, tot(rows, r => r.k.debeProv))), cop(Math.max(0, tot(rows, r => r.k.porCobrar))), ''] : null,
  });

  const P = (D().minasPagos || []).slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  const ped = id => rows.find(r => r.p.id === id);
  const tpg = table([
    { h: 'Fecha', f: x => `<span class="num">${fmtDate(x.fecha)}</span>` },
    { h: 'Tipo', f: x => x.tipo === 'cliente' ? chip('good', 'Cobro a revendedor') : chip('wood', 'Pago a Madelistas') },
    { h: 'Pedido', f: x => { const r = ped(x.pedidoId); return r ? `${esc(minaNombre(r.p))}<span class="sub">${fmtDate(r.p.fecha)} · ${num(r.k.piezas, 0)} pzs</span>` : '<span class="muted">—</span>'; } },
    { h: 'Medio', f: x => `${esc(x.medio || '—')}${x.nota ? `<span class="sub">${esc(x.nota)}</span>` : ''}` },
    { h: 'Valor', r: 1, f: x => cop(x.valor) },
  ], P, { act: x => editAttr('minasPagos', x.id), empty: '<p>Todavía no hay pagos.</p>' });

  // Precios de venta a los revendedores contra el costo en Madelistas.
  const V = minaVenta().precios, vRows = [];
  for (const [k, row] of Object.entries(V)) for (const [cm, pv] of Object.entries(row || {})) {
    if (!n(pv)) continue;
    const med = k.replace(/_/g, ','), L = +cm / 100, pl = minaPLista(k.replace(/_/g, '.'), L), cu = pl ? minaCostoU(pl) : 0;
    vRows.push({ med, L, pv: n(pv), pl, cu });
  }
  vRows.sort((a, b) => a.med.localeCompare(b.med, 'es', { numeric: true }) || a.L - b.L);
  const tv = table([
    { h: 'Pieza', f: x => `<span class="cell-strong">${esc(x.med)}</span> × ${num(x.L, 2)} m` },
    { h: 'Les vendes a', r: 1, f: x => `<b>${cop(x.pv)}</b>` },
    { h: 'Madelistas', r: 1, f: x => x.pl ? cop(x.pl) : '<span class="muted">no está en su lista</span>' },
    { h: `Te cuesta (−${num(mc.descuento, 1)} %)`, r: 1, f: x => x.cu ? cop(x.cu) : '<span class="muted">pedir precio a Wilson</span>' },
    { h: 'Ganas c/u', r: 1, f: x => x.cu ? `${signed(x.pv - x.cu)}<span class="sub">${pct((x.pv - x.cu) / x.pv)}</span>` : '<span class="muted">—</span>' },
  ], vRows, { empty: '<p>Sin precios de venta todavía.</p>' });

/* ---------- Pauta (publicidad en Meta) ---------- */
const PLATAFORMAS = ['Meta (Facebook e Instagram)', 'Google', 'TikTok', 'Otra'];
const campanas = (cfg = CFG()) => (cfg.pauta && Array.isArray(cfg.pauta.campanas) ? cfg.pauta.campanas : []);
// Días que la campaña estuvo prendida: [{desde, hasta}] (hasta vacío = sigue prendida). Las campañas viejas usaban inicio/fin.
const periodosDe = c => Array.isArray(c.periodos) ? c.periodos.filter(p => isDate(p.desde)) : isDate(c.inicio) ? [{ desde: c.inicio, hasta: c.fin || '' }] : [];
const enPeriodo = (p, f) => f >= p.desde && (!isDate(p.hasta) || f <= p.hasta);
const campActiva = (c, f, hoy) => f <= hoy && periodosDe(c).some(p => enPeriodo(p, f));
const periodoHoy = (c, hoy) => periodosDe(c).find(p => enPeriodo(p, hoy));
const primerDia = cs => cs.flatMap(c => periodosDe(c).map(p => p.desde)).sort()[0] || '';
const mensualDe = c => n(c.presupuestoMensual) || n(c.presupuestoDiario) * 30;
const finDeMes = mes => addDays(fromD(new Date(Date.UTC(+mes.slice(0, 4), +mes.slice(5, 7), 1))), -1);
function diasActivosMes(c, mes, hoy) {
  let k = 0;
  for (let f = mes + '-01'; f.slice(0, 7) === mes; f = addDays(f, 1)) if (campActiva(c, f, hoy)) k++;
  return k;
}
const tieneReal = (c, mes) => c.reales && c.reales[mes] !== undefined && c.reales[mes] !== null && c.reales[mes] !== '';
// Gasto de pauta día por día: el cobro real del mes repartido entre sus días activos o, si no hay, el presupuesto diario.
function pautaDias(cfg, from, to, hoy) {
  const out = [], cs = campanas(cfg);
  const ini = primerDia(cs);
  if (!ini) return out;
  const fin = to < hoy ? to : hoy, cache = new Map();
  for (let f = from < ini ? ini : from; f <= fin; f = addDays(f, 1)) {
    let v = 0;
    for (const c of cs) {
      if (!campActiva(c, f, hoy)) continue;
      const mes = f.slice(0, 7);
      if (tieneReal(c, mes)) {
        const k = (c.id || c.nombre) + mes;
        if (!cache.has(k)) cache.set(k, diasActivosMes(c, mes, hoy));
        v += n(c.reales[mes]) / Math.max(1, cache.get(k));
      } else v += n(c.presupuestoDiario);
    }
    if (v) out.push({ fecha: f, valor: v });
  }
  return out;
}

    const st = s1 > 0.5 ? chip('', `Le debes ${cop(s1, true)}`, 'clock') : s1 < -0.5 ? chip('', `Adelanto ${cop(-s1, true)}`, 'info') : chip('good', 'Al día', 'check');
    return `<div class="client" data-act="trab" data-id="${esc(t.id)}" role="button" tabindex="0" title="Ver el historial de ${esc(t.nombre)}">
      <div class="client-h"><div><b>${esc(t.nombre)}</b><span>${oficioDe(t)} · ${cop(tarifaTrab(t, null, cfg))} por rastra · toca para ver su historial</span></div>${st}</div>
      <dl><div><dt>${s1 < -0.5 ? 'Adelanto' : 'Por pagar'}</dt><dd>${cop(Math.abs(s1))}</dd></div><div><dt>Esta semana</dt><dd>${cop(sem)}</dd></div>
      <div><dt>Último pago</dt><dd>${ult ? `${fmtDay(ult.fecha)} · ${cop(ult.valor, true)}` : '—'}</dd></div><div><dt>Período</dt><dd>${cop(sum(dev.filter(m => m.trabajadorId === t.id), m => m.valor), true)}</dd></div></dl>
      <div style="margin-top:12px">${btn(`${icon('plus')}Registrar abono`, `data-act="nomina-pagar" data-id="${esc(t.id)}"`, s1 > 0.5 ? 'primary sm' : 'sm')}</div>
    </div>`;
  }).join('');

  // Pedidos que todavía no se cargan: suman a la nómina el día que salgan.
  const pend = M.porEntregar.map(p => ({ fecha: p.fecha, quien: p.cliente, rastras: p.calc.rastras, id: p.id }));
  const tarifaT = sum(M.trab, t => tarifaTrab(t, null, cfg));
  const pendNote = pend.length ? `<div class="note" style="margin-bottom:16px">Por cargar: ${pend.map(p => `<b>${esc(p.quien)}</b> ${num(p.rastras)} rastras`).join(' · ')}. Cuando los marques como entregados o despachados suman unos <b>${cop(sum(pend, p => p.rastras) * tarifaT)}</b> a la nómina.</div>` : '';

  // Semanas de pago (domingo a sábado)
  const semanas = [];
  const primero = M.desdeN <= hoy ? sabadoDe(M.desdeN) : sab;
  for (let s = sab; s >= primero && semanas.length < 12; s = addDays(s, -7)) {
    const d0 = addDays(s, -6), ms = movs.filter(m => m.fecha >= d0 && m.fecha <= s), ds = M.despachos.filter(x => x.fecha >= d0 && x.fecha <= s);
    let cierre = 0; for (const m of movs) if (m.fecha <= s) cierre += m.tipo === 'pago' ? -m.valor : m.valor;
    semanas.push({ s, d0, rem: ds.length, ras: sum(ds, x => x.rastras), por: M.trab.map(t => sum(ms.filter(m => m.trabajadorId === t.id && m.tipo !== 'pago'), m => m.valor)), pago: sum(ms.filter(m => m.tipo === 'pago'), m => m.valor), cierre });
  }
  const ts = table([
    { h: 'Sábado', f: w => `<b class="num">${fmtDate(w.s)}</b><span class="sub">desde el ${fmtDay(w.d0)}${w.s === sab ? ' · esta semana' : ''}</span>` },
    { h: 'Remisiones', r: 1, f: w => num(w.rem, 0) },
    { h: 'Rastras', r: 1, f: w => num(w.ras) },
    ...M.trab.map((t, i) => ({ h: esc(t.nombre), r: 1, f: w => cop(w.por[i]) })),
    { h: 'Pagado', r: 1, f: w => cop(w.pago) },
    { h: 'Saldo al cierre', r: 1, f: w => `<b class="${w.cierre < -0.5 ? 'pos' : ''}">${cop(w.cierre)}</b>` },
  ], semanas, { empty: '<p>Todavía no hay semanas.</p>' });

  const L = enR.slice().reverse();
  const tm = table([
    { h: 'Fecha', f: m => `<span class="num">${fmtDate(m.fecha)}</span>` },
    { h: 'Trabajador', f: m => esc(M.trab.find(t => t.id === m.trabajadorId)?.nombre || '—') },
    { h: 'Detalle', f: m => m.tipo === 'pago' ? `${chip('good', 'Pago')}<span class="sub">${esc([m.medio, m.detalle].filter(Boolean).join(' · '))}</span>` : m.tipo === 'cargo' ? `${chip('', 'Extra')}<span class="sub">${esc(m.detalle)}</span>` : `${esc(m.detalle)}<span class="sub">${num(m.rastras)} rastras</span>` },
    { h: 'Gana', r: 1, f: m => m.tipo !== 'pago' ? cop(m.valor) : '' },
    { h: 'Pago', r: 1, f: m => m.tipo === 'pago' ? cop(m.valor) : '' },
    { h: 'Saldo', r: 1, f: m => `<b class="${m.saldo < -0.5 ? 'pos' : ''}">${cop(m.saldo)}</b>` },
  ], L, { act: m => editAttr(m.col, m.id), empty: `<p>No hay movimientos en este período${M.desdeN > R.to ? `; la nómina arranca el ${fmtDate(M.desdeN)}` : ''}.</p>` });

  return `${head}${kp}<div class="clients">${cards}</div>${pendNote}
    ${card('Semanas de pago', ts, { sub: `Cada fila va de domingo a sábado. La cuenta arrancó en cero el ${fmtDate(M.desdeN)}.` })}
    ${card('Movimientos', tm, { sub: 'Del más reciente al más antiguo. El saldo es lo que le debes a ese trabajador después de cada movimiento. Toca una remisión para corregirla.', acts: addBtn('Pago', 'nomina-pago') })}`;
};

/* ---------- Precios y costos ---------- */
const medSort = (a, b) => { const A = parseMedida(a), B = parseMedida(b); if (!A || !B) return String(a).localeCompare(String(b)); return (A.a * A.b - B.a * B.b) || (A.a - B.a); };
function listaDims(l) {
  const meds = Object.keys(l.precios || {}).sort(medSort);
  const ls = new Set(); for (const m of meds) for (const k of Object.keys(l.precios[m] || {})) if (n(l.precios[m][k])) ls.add(+k / 100);
  return { meds, largos: [...ls].sort((a, b) => a - b) };
}
function calcRows(M, medida, largo, cant) {
  const info = piezaInfo(medida, largo, M.cfg);
  if (!info) return null;
  const rows = M.d.listas.map(l => {
    const pr = listaPrecio(l, medida, largo);
    return { nombre: l.nombre, precio: pr, util: pr - info.costo, margen: pr ? (pr - info.costo) / pr : NaN };
  });
  return { info, rows, cant: Math.max(1, n(cant) || 1) };
}
function calcOut(M, medida, largo, cant) {
  const r = calcRows(M, medida, largo, cant);
  if (!r) return `<p class="muted">Escribe una medida como <b>4x6</b> y un largo en metros como <b>3</b>.</p>`;

    ${kpi(`Para ${num(q, 0)} ${q === 1 ? 'pieza' : 'piezas'}`, cop(info.costo * q), `${num(info.rastras * q, 3)} rastras`, { cls: 'sm' })}
  </div>`;
  const t = table([
    { h: 'Lista', f: x => esc(x.nombre) },
    { h: 'Precio / pza', r: 1, f: x => x.precio ? cop(x.precio) : '<span class="muted">No está</span>' },
    { h: 'Utilidad / pza', r: 1, f: x => x.precio ? signed(x.util) : '' },
    { h: 'Margen', r: 1, f: x => x.precio ? `<span class="${x.margen < 0 ? 'neg' : ''}">${pct(x.margen)}</span>` : '' },
    { h: `Total ${num(q, 0)} pzs`, r: 1, f: x => x.precio ? cop(x.precio * q) : '' },
    { h: 'Utilidad total', r: 1, f: x => x.precio ? signed(x.util * q) : '' },
  ], rows, { empty: '<p>Agrega una lista de precios para comparar.</p>' });
  return head + t;
}

/* ---------- Seguimiento de WhatsApp ----------

   Lo que tú cambias aquí va en el campo "manual" y Claude no lo toca. */
const ETAPAS = [
  ['nuevo', 'Nuevo'], ['precios', 'Precio enviado'], ['cotizacion', 'Cotización enviada'],
  ['negociando', 'Negociando'], ['ganado', 'Ganado'], ['perdido', 'Perdido'],
];
const ETAPA_LBL = Object.fromEntries(ETAPAS);
const ETAPA_TONO = { nuevo: '', precios: 'wood', cotizacion: 'wood', negociando: 'warn', ganado: 'good', perdido: 'crit' };
const ETAPA_COLOR = { nuevo: 'var(--s3)', precios: 'var(--s2)', cotizacion: 'var(--s2)', negociando: 'var(--warn)', ganado: 'var(--s1)', perdido: 'var(--crit)' };
const TIPO_LBL = { cliente: 'Cliente', mayorista: 'Mayorista', proveedor: 'Proveedor', equipo: 'Equipo', personal: 'Personal', otro: 'No es venta' };
const ABIERTAS = new Set(['nuevo', 'precios', 'cotizacion', 'negociando']);
const PRIO = { alta: 0, media: 1, baja: 2 };
const SEG_FILTROS = [['abiertos', 'Abiertos'], ['ganado', 'Ganados'], ['perdido', 'Perdidos'], ['otros', 'No son ventas'], ['archivados', 'Archivados'], ['todos', 'Todos']];
// Pasos de seguimiento después de tu último mensaje (días sin respuesta del cliente).
const SEG_PASOS = [[2, '1.er seguimiento'], [5, '2.º seguimiento'], [10, 'Último intento'], [21, 'Para cerrar']];

const msD = iso => { const t = Date.parse(iso || ''); return Number.isFinite(t) ? t : 0; };
const diasDesde = iso => { const t = msD(iso); return t ? (Date.now() - t) / 864e5 : Infinity; };
function hace(iso) {
  const t = msD(iso); if (!t) return '—';
  const m = Math.max(0, (Date.now() - t) / 6e4);
  if (m < 60) return `hace ${Math.max(1, Math.round(m))} min`;
  const h = m / 60; if (h < 24) return `hace ${Math.round(h)} h`;
  const d = Math.floor(h / 24); return d === 1 ? 'hace 1 día' : `hace ${d} días`;
}
function horaCorta(iso) {
  const t = msD(iso); if (!t) return '—';
  try { return new Date(t).toLocaleString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  catch { return new Date(t).toISOString().slice(0, 16).replace('T', ' '); }
}
const telTxt = t => { const s = String(t || '').replace(/\D/g, ''); return s.startsWith('57') && s.length === 12 ? `${s.slice(2, 5)} ${s.slice(5, 8)} ${s.slice(8)}` : (s ? '+' + s : ''); };
const pasoDe = dias => { let p = null; for (const [d, l] of SEG_PASOS) if (dias >= d) p = l; return p; };

function segModel() {
  const raw = Array.isArray(D().seguimiento) ? D().seguimiento : [];
  const estado = raw.find(x => x.id === '_estado') || null;
  const hoy = todayStr();
  const items = raw.filter(x => x.id !== '_estado' && x.telefono).map(r => {
    const man = r.manual || {};
    // Lo que cambiaste a mano vale hasta que llegue un mensaje nuevo; los tipos y el archivo valen siempre.
    const manVigente = man.cuando && msD(man.cuando) >= msD(r.ultimaActividad);
    const etapa = (manVigente && man.etapa) || r.etapa || '';
    const tipo = man.tipo || r.tipo || 'cliente';
    let turno = r.turno || 'nadie';
    if (turno === 'yo' && man.respondido && msD(man.respondido) >= msD(r.ultimoEntrante)) turno = 'cliente';
    const retomar = (man.posponerHasta && man.posponerHasta > hoy && man.posponerHasta) || (r.retomarEl && r.retomarEl > hoy && r.retomarEl) || '';
    const venta = tipo === 'cliente' || tipo === 'mayorista';
    const archivado = !!man.archivado;
    const desdeMio = msD(man.respondido) > msD(r.ultimoSaliente) ? man.respondido : r.ultimoSaliente;
    return { ...r, etapa, tipo, turno, retomar, venta, archivado, manual: man,
      espera: diasDesde(r.ultimoEntrante), silencio: diasDesde(desdeMio || r.ultimaActividad) };
  });
  const vivos = items.filter(x => x.venta && !x.archivado);
  const prioSort = (a, b) => (PRIO[a.prioridad] ?? 1) - (PRIO[b.prioridad] ?? 1);
  const porResponder = vivos.filter(x => x.turno === 'yo' && x.etapa !== 'perdido' && !x.retomar)
    .sort((a, b) => prioSort(a, b) || msD(a.ultimoEntrante) - msD(b.ultimoEntrante));
  const esperando = vivos.filter(x => x.turno !== 'yo' && ABIERTAS.has(x.etapa) && !x.retomar);
  const seguir = esperando.filter(x => x.silencio >= 2 && x.silencio < 21)
    .sort((a, b) => prioSort(a, b) || b.silencio - a.silencio);
  const cerrar = esperando.filter(x => x.silencio >= 21).sort((a, b) => prioSort(a, b) || a.silencio - b.silencio);
  const recientes = esperando.filter(x => x.silencio < 2);
  const pausados = vivos.filter(x => x.retomar && ABIERTAS.has(x.etapa));
  return { estado, items, vivos, porResponder, seguir, cerrar, recientes, pausados };
}

      <div class="seg-head"><b>${esc(x.nombre || telTxt(x.telefono))}</b><span class="seg-tel num">${esc(telTxt(x.telefono))}</span></div>

function segLista(arr, modo, vacio, max = 0) {
  if (!arr.length) return `<div class="empty"><p>${vacio}</p></div>`;

}

async function segSet(t) {
  cerrarPop();
  if (S.demo) { toast('Estás viendo el ejemplo. Sal del ejemplo para cambiar datos.'); return; }
  const rec = (S.data.seguimiento || []).find(x => x.id === t.dataset.id); if (!rec) return;
  const k = t.dataset.k, v = t.dataset.v;
  const now = new Date().toISOString();
  let manual = { ...(rec.manual || {}) };
  let msg = 'Listo';
  if (k === 'respondido') { manual.respondido = now; msg = 'Marcado como respondido'; }
  else if (k === 'etapa') { manual.etapa = v; manual.cuando = now; msg = `Etapa: ${ETAPA_LBL[v] || v}`; }
  else if (k === 'pausa') { if (v) { manual.posponerHasta = v; msg = `En pausa hasta el ${fmtDay(v)}`; } else { delete manual.posponerHasta; msg = 'Pausa quitada'; } }
  else if (k === 'tipo') { manual.tipo = v; msg = v === 'otro' ? 'Movido a “No son ventas”' : 'Marcado como cliente'; }
  else if (k === 'archivar') { if (v === '1') { manual.archivado = true; msg = 'Archivado'; } else { delete manual.archivado; msg = 'Sacado del archivo'; } }
  else if (k === 'reset') { manual = {}; msg = 'Vuelve a lo que dice Claude'; }
  try { await Store.save('seguimiento', { ...clone(rec), manual }); toast(msg); }
  catch (e) { toast(errMsg(e)); }
}

/* ---------- Bandeja ----------

   Nada sale solo: Tomás revisa el mensaje, lo corrige si quiere, lo manda desde su WhatsApp y lo marca enviado. */
const BAN_TIPO = {

};
const BAN_AGENTE = { fidelizacion: 'Fidelización', cobros: 'Cobros y rentabilidad', jefe: 'Jefe de gabinete', seguimiento: 'Seguimiento' };
function banItems() { return (Array.isArray(D().bandeja) ? D().bandeja : []).filter(b => b && b.id); }
function banPendientes() { return banItems().filter(b => (b.estado || 'pendiente') === 'pendiente').sort((a, b) => (PRIO[a.prioridad] ?? 1) - (PRIO[b.prioridad] ?? 1) || String(b.creado || '').localeCompare(String(a.creado || ''))); }
const banTel = b => String(b.telefono || '').replace(/\D/g, '');
const banTexto = b => (S.banEdit && S.banEdit[b.id] != null ? S.banEdit[b.id] : (b.mensaje || ''));
const banWaHref = b => `https://wa.me/${banTel(b)}?text=${encodeURIComponent(banTexto(b))}`;
function banFila(b) {

      <span class="sp"></span>

function mdLite(txt) {
  const out = []; let ul = null;
  for (const raw of String(txt || '').split('\n')) {
    const l = raw.trim();
    const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^[-*•] /.test(l)) { if (!ul) { ul = []; } ul.push(`<li>${inl(l.slice(2))}</li>`); continue; }
    if (ul) { out.push(`<ul>${ul.join('')}</ul>`); ul = null; }
    if (!l) continue;
    if (/^#{1,4} /.test(l)) out.push(`<h4>${inl(l.replace(/^#+ /, ''))}</h4>`); else out.push(`<p>${inl(l)}</p>`);
  }
  if (ul) out.push(`<ul>${ul.join('')}</ul>`);
  return out.join('');
}

function parseLoose(s) {
  let t = String(s ?? '').replace(/[^\d.,-]/g, '');
  if (!t || t === '-') return 0;
  if (/^-?\d{1,3}([.,]\d{3})+$/.test(t)) t = t.replace(/[.,]/g, '');
  else if (/^-?\d{1,3}(\.\d{3})+,\d+$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+\.\d+$/.test(t)) t = t.replace(/,/g, '');
  else t = t.replace(',', '.');
  const x = parseFloat(t);
  return Number.isFinite(x) ? x : 0;
}

    rastras: row.dataset.rastras ? n(row.dataset.rastras) : info ? +info.rastras.toFixed(6) : 0,
    costo: row.dataset.costo ? n(row.dataset.costo) : info ? Math.round(info.costo) : 0,
    ok: !!info,
  };
  if (mode === 'bbv') { l.pbb = parseMoney(g('pbb')); l.plista = info ? listaPrecio(model().listaBBVenta, info.label, largo) || 0 : 0; }
  if (mode === 'dmg') { l.precio = 0; l.pbb = info ? pbbFor(info.label, largo) : 0; }
  return l;
}
function readLines(form, mode) {
  const out = [];
  for (const row of $$('[data-line]', form)) {
    const l = readRow(row, mode);
    if (!l.medida && !l.cant) continue;
    if (!l.cant) continue;
    if (!l.ok) throw new Error(`La medida “${l.medida || '(vacía)'}” no se entiende. Escríbela como 4x6 y pon el largo en metros.`);
    delete l.ok; out.push(l);
  }
  return out;
}

/* ---- precios automáticos ---- */
function listaCliente(form) {
  const M = model();
  const c = M.cli.get(val(form, 'f-cliente'));
  return c ? M.listas.get(c.listaId) : null;
}
// Precio de sociedad (lo que entra la madera al negocio): sale de la lista de la sociedad y se fija en la venta.
const pbbFor = (med, L) => listaPrecio(model().listaBB, med, L);
// Precio de venta al cliente final: con él se estima lo que vale la madera despachada a Barro Blanco.
const pvFor = (med, L) => listaPrecio(model().listaBBVenta, med, L);
const estimadoBB = items => sum((items || []).filter(l => l.unidad !== 'rastra'), l => n(l.cant) * pvFor(l.medida, l.largo));
// Estimado si se vende todo a precio de lista. La utilidad de la sociedad (venta − precio de sociedad) se reparte;
// aparte, tú ganas la diferencia entre el precio de sociedad y tu costo real.
function estimadoInv(rows, pct) {
  let venta = 0, util = 0, base = 0, costo = 0;
  const sinPv = new Set(), sinPb = new Set();
  for (const r of rows) {
    const q = Math.max(0, r.stock);
    if (!r.pv) { sinPv.add(r.nombre); continue; }
    venta += q * r.pv;
    if (r.pbb) { util += q * (r.pv - r.pbb); base += q * r.pbb; costo += q * n(r.costo); } else sinPb.add(r.nombre);
  }
  const miParte = util * pct / 100;
  return { venta, util, base, costo, miParte, parteSocio: util - miParte, enPrecio: base - costo, sinPv: [...sinPv], sinPb: [...sinPb] };
}
// Dice cuáles piezas no tienen precio en la lista de venta o de sociedad, para que se sepa qué falta.
const avisoSinPrecio = e => [
  e.sinPv.length ? `Sin precio en la lista de venta (no entra${e.sinPv.length > 1 ? 'n' : ''} en el estimado): <b>${e.sinPv.map(esc).join(', ')}</b>.` : '',
  e.sinPb.length ? `Sin precio de sociedad todavía (no entra${e.sinPb.length > 1 ? 'n' : ''} en la utilidad estimada): <b>${e.sinPb.map(esc).join(', ')}</b>.` : '',
].filter(Boolean).join(' ');
function autoPrice(form, row) {

  const bIn = row.querySelector('[data-k="pbb"]');
  if (bIn && bIn.dataset.auto === '1') { const v = pbbFor(med, L); bIn.value = v ? moneyIn(v) : ''; }
}

/* ---- totales en vivo ---- */
function liveSale(form, mode, extra = {}) {
  const rows = $$('[data-line]', form);
  let pzs = 0, ras = 0, sub = 0, costo = 0;
  for (const row of rows) {
    const l = readRow(row, mode);
    const s = row.querySelector('[data-sub]');
    if (!l.ok || !l.cant) { s.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 4x6' : ''; continue; }
    const lineSub = l.cant * l.precio, lineCost = l.cant * l.costo;
    if (l.unidad !== 'rastra') pzs += l.cant;
    ras += l.cant * l.rastras; sub += lineSub; costo += lineCost;
    s.textContent = l.unidad === 'rastra'
      ? `costo ${cop(l.costo)}/rastra · subtotal ${cop(lineSub)}`
      : `${num(l.rastras, 4)} rastras/pza · costo ${cop(l.costo)}/pza · subtotal ${cop(lineSub)}`;
  }
  return { pzs, ras, sub, costo };
}
// Despacho o devolución de Barro Blanco: sin precio; cada pieza se estima a precio de venta al cliente final.
function liveDesp(form) {
  const rows = [];
  let pzs = 0, ras = 0, costo = 0;
  for (const row of $$('[data-line]', form)) {
    const l = readRow(row, 'desp'), s = row.querySelector('[data-sub]');
    if (!l.ok || !l.cant) { s.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 4x6' : ''; continue; }
    if (l.unidad !== 'rastra') pzs += l.cant;
    ras += l.cant * l.rastras; costo += l.cant * l.costo;
    if (l.unidad === 'rastra') { s.textContent = `${num(l.cant, 3)} rastras sin detalle · sin estimado`; continue; }
    const pv = pvFor(l.medida, l.largo);
    const pbb = pbbFor(l.medida, l.largo);
    rows.push({ stock: l.cant, pv, pbb, nombre: itemName(l) });
    s.textContent = `${num(l.rastras, 4)} rastras/pza · ${pv ? `estimado ${cop(pv)} c/u a precio de venta · ${cop(l.cant * pv)}${pbb ? '' : ' · sin precio de sociedad'}` : 'sin precio en la lista de venta'}`;
  }
  return { pzs, ras, costo, est: estimadoInv(rows, n(CFG().pctSocio)) };
}
function liveBBV(form) {
  const p = n(CFG().pctSocio) / 100;
  let venta = 0, base = 0, costo = 0, ras = 0, pzs = 0;
  for (const row of $$('[data-line]', form)) {
    const l = readRow(row, 'bbv'); const s = row.querySelector('[data-sub]');
    if (!l.ok || !l.cant) { s.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 4x6' : ''; continue; }
    const v = l.cant * l.precio, b = l.cant * l.pbb;
    venta += v; base += b; costo += l.cant * l.costo; ras += l.cant * l.rastras; if (l.unidad !== 'rastra') pzs += l.cant;
    const dif = l.plista && l.precio ? l.precio - l.plista : 0;
    s.textContent = `${num(l.rastras, 4)} rastras/pza${l.plista ? ` · lista ${cop(l.plista)}${Math.abs(dif) >= 1 ? ` · vendió ${cop(Math.abs(dif))} ${dif > 0 ? 'más caro' : 'más barato'}` : ''}` : ''} · utilidad del punto ${cop(v - b)} · tu parte ${cop((v - b) * p)}`;
  }
  const up = venta - base, mi = up * p;
  return { venta, base, up, mi, socio: up - mi, debe: base + mi, costo, miU: base + mi - costo, ras, pzs, p };
}

// Cada pieza guarda el precio de Madelistas (plista), tu costo con el descuento (costo) y el precio de venta (precio).
function minaLines(form, desc) {
  const out = [];
  let pzs = 0, ras = 0, venta = 0, costo = 0, sinCosto = 0;
  for (const row of $$('[data-line]', form)) {
    const l = readRow(row, 'mina'), s = row.querySelector('[data-sub]');
    if (!l.cant) { if (s) s.textContent = l.medida && !l.ok ? 'Medida no válida: usa el formato 6x6' : ''; continue; }
    if (!l.ok) { if (s) s.textContent = 'Medida no válida: usa el formato 6x6'; out.push(l); continue; }
    const pl = minaPLista(l.medida, l.largo), cu = pl ? minaCostoU(pl, desc) : 0;
    l.plista = pl; l.costo = cu;
    pzs += l.cant; ras += l.cant * l.rastras; venta += l.cant * l.precio; costo += l.cant * cu; if (!cu) sinCosto++;
    if (s) s.textContent = `${num(l.rastras, 4)} rastras/pza · ${pl ? `Madelistas ${cop(pl)} → te cuesta ${cop(cu)}` : 'no está en la lista de Madelistas: sin costo'} · venta ${cop(l.cant * l.precio)}${cu && l.precio ? ` · ganas ${cop(l.cant * (l.precio - cu))}` : ''}`;
    out.push(l);
  }
  return { out, pzs, ras, venta, costo, sinCosto };
}

const AI_KINDS = ['bb-venta', 'bb-devolucion', 'bb-despacho', 'bb-pago', 'venta-mayorista', 'abono', 'venta-final', 'pinera-compra', 'pinera-pago', 'gasto'];

  return [

    'Medidas en pulgadas como "ancho x grueso" (ej. "4x6"). Largo en metros (ej. 3 o 4.5); "6,50", "6.5" y "650" son 6.5 m. Cantidades en piezas.',

    `- "bb-devolucion": piezas que vuelven de ${cfg.punto} o se dañaron allá. Campos: fecha, motivo (uno de ${MOTIVOS_DEV.join(', ')}), items [{medida, largo, cant}].`,

    '- "abono": un cliente mayorista le paga a Agrohermanos. Campos: fecha, clienteId, valor, medio.',

    soloKind ? `Esta foto es para un registro de tipo "${soloKind}". Devuelve solo un registro de ese tipo con todas las piezas que aparezcan (medida, largo, cantidad y precio si está). Si ves la remisión, el cliente o la fecha, inclúyelos.` : '',
    'Mensaje:', '<<<', String(msg || '(sin texto: lee la imagen)').slice(0, 8000), '>>>',

// Valores que pueden venir como texto: "55 mil", "1,2 millones", "1.200.000".
function moneyLoose(v) {
  if (typeof v === 'number') return Math.round(v);
  const t = String(v ?? '').toLowerCase();
  const x = parseLoose(t.replace(/[^\d.,-]/g, ''));
  if (/mill[oó]n|millones|\bm\b/.test(t)) return Math.round(x * 1e6);
  if (/\bmil\b|\bk\b/.test(t)) return Math.round(x * 1e3);
  return Math.round(x);
}
function aiItems(list, withPrice) {
  return (Array.isArray(list) ? list : []).map(it => {
    let L = parseLoose(it && it.largo); if (L > 20) L = L / 100;
    const o = { medida: String((it && it.medida) || '').replace(/\s/g, '').replace(/X/g, 'x'), largo: L, cant: parseLoose(it && it.cant) };
    if (withPrice) o.precio = moneyLoose(it && it.precio);
    return o;
  }).filter(it => it.medida && it.cant > 0);
}
function aiNormalize(out) {
  const M = model();
  const regs = Array.isArray(out) ? out : (out && Array.isArray(out.registros) ? out.registros : []);
  const oneOf = (v, list, d) => list.includes(v) ? v : d;
  const cliId = id => M.cli.has(id) ? id : '';
  const money = moneyLoose;
  const res = [];
  for (const r of regs) {
    if (!r || !AI_KINDS.includes(r.tipo)) continue;
    const base = { fecha: isDate(r.fecha) ? r.fecha : M.hoy };
    let pre;
    switch (r.tipo) {
      case 'bb-venta': pre = { ...base, items: aiItems(r.items, true) }; break;
      case 'bb-devolucion': pre = { ...base, motivo: oneOf(r.motivo, MOTIVOS_DEV, 'Pieza dañada'), items: aiItems(r.items, false) }; break;
      case 'bb-despacho': pre = { ...base, remision: String(r.remision || ''), items: aiItems(r.items, false) }; break;
      case 'venta-mayorista': pre = { ...base, clienteId: cliId(r.clienteId), remision: String(r.remision || ''), estado: oneOf(r.estado, ['Entregado', 'Por entregar'], 'Entregado'), items: aiItems(r.items, true) }; break;
      case 'venta-final': { const fc = M.finales.find(c => c.id === r.clienteId); pre = { ...base, clienteId: fc ? fc.id : '', cliente: fc ? { nombre: fc.nombre || '', celular: fc.celular || '', municipio: fc.municipio || '', direccion: fc.direccion || '' } : { nombre: String(r.cliente?.nombre || ''), celular: String(r.cliente?.celular || ''), municipio: String(r.cliente?.municipio || ''), direccion: String(r.cliente?.direccion || '') }, estado: oneOf(r.estado, ['Pendiente', 'Despachado', 'Entregado'], 'Pendiente'), items: aiItems(r.items, true), flete: money(r.flete) }; break; }
      case 'abono': pre = { ...base, clienteId: cliId(r.clienteId), valor: money(r.valor), medio: oneOf(r.medio, MEDIOS, 'Transferencia') }; break;
      case 'bb-pago': case 'pinera-pago': pre = { ...base, valor: money(r.valor), medio: oneOf(r.medio, MEDIOS, 'Transferencia') }; break;
      case 'pinera-compra': pre = { ...base, concepto: oneOf(r.concepto, PINERA_CONCEPTOS, 'Madera'), remision: String(r.remision || ''), salida: String(r.salida || ''), destino: String(r.destino || ''), rastras: parseLoose(r.rastras), valor: money(r.valor) }; break;
      case 'gasto': pre = { ...base, categoria: oneOf(r.categoria, GASTO_CATS, 'Otro'), descripcion: String(r.descripcion || ''), valor: money(r.valor) }; break;
    }
    res.push({ kind: r.tipo, prefill: pre });
  }
  const nota = out && typeof out.nota === 'string' ? out.nota : '';
  return res.map((x, i, a) => ({ ...x, ai: { i: i + 1, n: a.length, nota: i === 0 ? nota : '' } }));
}
function aiErr(e) {
  switch (e && e.code) {
    case 'not_granted': case 'sampling_disabled': return 'Para usar esto, permite que el tablero use Claude cuando te lo pregunte.';
    case 'rate_limited': return 'Claude está ocupado o llegaste a tu límite de uso. Intenta en un rato.';
    case 'invalid_json': return 'Claude no devolvió algo que el tablero pueda leer. Intenta de nuevo o escribe el mensaje más claro.';
    case 'image_rejected': return 'No pude leer esa imagen. Prueba con otra foto en JPG o PNG.';
    case 'images_unavailable': return 'Aquí no se pueden enviar fotos. Pega el texto del mensaje.';
    case 'session_expired': return 'Tu sesión de Claude expiró. Vuelve a entrar y prueba otra vez.';
    case 'refused': return 'Claude no pudo procesar ese mensaje. Prueba escribiéndolo de otra forma.';
    case 'prompt_too_large': return 'El mensaje es muy largo. Pega una parte a la vez.';
    default: return 'No se pudo conectar con Claude. Intenta de nuevo.';
  }
}
