<style>
/* Layout: a fixed rail of business areas on the left, a work area on the right; one filter row on top scopes every number below it. */
:root {
  /* Colores aprobados del manual de marca: verde #25372B y naranja #D46A1F. Fondo blanco (día) o negro (noche). */
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #FAFAFA;
  --sunken: #F3F3F3;
  --line: #EBEBEB;
  --line-strong: #D6D6D6;
  --fg: #111311;
  --fg-2: #454A46;
  --muted: #7A7F7B;
  --accent: #D46A1F;
  --accent-tx: #B4561A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBEDE3;
  --brand: #D46A1F;
  --brand-soft: #FBEDE3;
  --green: #25372B;
  --green-soft: #E5EBE6;
  --label: #25372B;
  --logo-a: #25372B;
  --logo-b: #D46A1F;
  --logo-cut: #FFFFFF;
  --rail-bg: #FFFFFF;
  --rail-line: #EBEBEB;
  --rail-fg: #111311;
  --rail-fg-2: #454A46;
  --rail-muted: #25372B;
  --rail-hover: #F3F3F3;
  --rail-active: #FBEDE3;
  --s1: #25372B;
  --s2: #D46A1F;
  --s3: #4A6FC0;
  --good: #25372B;
  --good-soft: #E5EBE6;
  --warn: #9A5F0E;
  --warn-soft: #FDF1DE;
  --crit: #C0322F;
  --crit-soft: #FDE7E6;
  --scrim: rgba(10, 10, 10, .42);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -20px rgba(0, 0, 0, .22);
  --glow: 0 2px 6px rgba(0, 0, 0, .04), 0 18px 40px -18px rgba(212, 106, 31, .5);
  --f-ui: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0B0B0B; --surface-2: #060606; --sunken: #161616;
    --line: #1F1F1F; --line-strong: #2F2F2F;
    --fg: #F5F5F5; --fg-2: #C4C4C4; --muted: #8C8C8C;
    --accent: #D46A1F; --accent-tx: #D46A1F; --accent-ink: #FFFFFF; --accent-soft: #2A170A;
    --brand: #D46A1F; --brand-soft: #2A170A;
    --green: #25372B; --green-soft: #25372B; --label: #8C8C8C;
    /* De noche el verde de la marca va de fondo (barra lateral, etiquetas) y el logo usa su versión blanca sobre verde. */
    --logo-a: #FFFFFF; --logo-b: #D46A1F; --logo-cut: #25372B;
    --rail-bg: #25372B; --rail-line: #25372B; --rail-fg: #FFFFFF; --rail-fg-2: rgba(255, 255, 255, .8); --rail-muted: rgba(255, 255, 255, .55); --rail-hover: rgba(255, 255, 255, .08); --rail-active: rgba(255, 255, 255, .12);
    --s1: #F2F2F2; --s2: #D46A1F; --s3: #6A8FE0;
    --good: #FFFFFF; --good-soft: #25372B; --warn: #F2B13D; --warn-soft: #261C0B; --crit: #FF6B63; --crit-soft: #2A1110;
    --scrim: rgba(0, 0, 0, .7);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 44px -22px rgba(0, 0, 0, .9);
    --glow: 0 0 0 1px rgba(212, 106, 31, .45), 0 18px 44px -20px rgba(212, 106, 31, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0B0B0B; --surface-2: #060606; --sunken: #161616;
  --line: #1F1F1F; --line-strong: #2F2F2F;
  --fg: #F5F5F5; --fg-2: #C4C4C4; --muted: #8C8C8C;
  --accent: #D46A1F; --accent-tx: #D46A1F; --accent-ink: #FFFFFF; --accent-soft: #2A170A;
  --brand: #D46A1F; --brand-soft: #2A170A;
  --green: #25372B; --green-soft: #25372B; --label: #8C8C8C;
  /* De noche el verde de la marca va de fondo (barra lateral, etiquetas) y el logo usa su versión blanca sobre verde. */
  --logo-a: #FFFFFF; --logo-b: #D46A1F; --logo-cut: #25372B;
  --rail-bg: #25372B; --rail-line: #25372B; --rail-fg: #FFFFFF; --rail-fg-2: rgba(255, 255, 255, .8); --rail-muted: rgba(255, 255, 255, .55); --rail-hover: rgba(255, 255, 255, .08); --rail-active: rgba(255, 255, 255, .12);
  --s1: #F2F2F2; --s2: #D46A1F; --s3: #6A8FE0;
  --good: #FFFFFF; --good-soft: #25372B; --warn: #F2B13D; --warn-soft: #261C0B; --crit: #FF6B63; --crit-soft: #2A1110;
  --scrim: rgba(0, 0, 0, .7);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 44px -22px rgba(0, 0, 0, .9);
  --glow: 0 0 0 1px rgba(212, 106, 31, .45), 0 18px 44px -20px rgba(212, 106, 31, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variation-settings: "wdth" 100;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.neg { color: var(--crit); }
.pos { color: var(--good); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--rail-bg) 0 227px, var(--rail-line) 227px 228px, transparent 228px); }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 28px;
  padding: 22px 14px 18px; background: var(--rail-bg); border-right: 1px solid var(--rail-line); color: var(--rail-fg-2);
}
.brand { display: flex; align-items: center; padding: 2px 6px 0; border: 0; background: none; cursor: pointer; border-radius: 10px; transition: transform .2s, opacity .2s; }
.brand:hover { transform: scale(1.03); }
.brand:active { transform: scale(.98); }
/* Logo del manual de marca, sin fondo: verde y naranja cambian con el tema. */
.brand .logo { display: block; width: 100%; max-width: 196px; height: auto; flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-g { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--rail-muted); padding: 14px 10px 6px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
  color: var(--rail-fg-2); font-weight: 500; text-align: left;
}
.nav button svg { width: 16px; height: 16px; flex: none; opacity: .8; }
.nav button { transition: background .15s, color .15s, box-shadow .15s; }
.nav button:hover { background: var(--rail-hover); color: var(--rail-fg); }
.nav button:hover svg { color: var(--brand); opacity: 1; }
.nav button[aria-current="page"] { background: var(--rail-active); color: var(--rail-fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--brand); }
.nav button[aria-current="page"] svg { color: var(--brand); opacity: 1; }
.nav .badge { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 99px; background: var(--crit-soft); color: var(--crit); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--rail-fg-2); }
.rail-foot .btn { color: inherit; }
.rail-foot .btn:hover { background: var(--rail-hover); color: var(--rail-fg); }
.sync { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.on i { background: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
.sync.local i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

.main { min-width: 0; padding-inline: clamp(16px, 3.2vw, 40px); padding-block: 0 64px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding-block: 18px 12px; display: flex; flex-direction: column; gap: 14px;
  border-bottom: 1px solid var(--line); margin-bottom: 22px;
}
.top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
.top h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; font-variation-settings: "wdth" 112; margin-top: 4px; }
.top h1::after { content: ""; display: inline-block; width: 9px; height: 9px; margin-left: 9px; border-radius: 2px; background: var(--brand); vertical-align: .12em; }
.top-actions { display: flex; gap: 8px; align-items: center; position: relative; }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunken); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  font-family: var(--f-mono); font-size: 11.5px; color: var(--fg-2);
}
.seg button:hover { color: var(--fg); }
.seg button { transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 6px 14px -8px var(--brand); }
.custom { display: flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.custom input { height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-family: var(--f-mono); font-size: 12px; }
.range-txt { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 13px;
  background: var(--brand-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); border-left: 4px solid var(--brand);
}
.banner b { font-weight: 600; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
  border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
  font-weight: 500; font-size: 13px; white-space: nowrap;
}
.btn { transition: border-color .15s, color .15s, background .15s, transform .15s, box-shadow .15s; }
.btn:hover { border-color: var(--brand); color: var(--accent-tx); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { color: var(--accent-ink); transform: translateY(-1px); box-shadow: var(--glow); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--crit); }
.btn.danger.armed { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--fg-2); }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-tx); }

.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 270px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
}
.menu h4 { margin: 0; padding: 10px 10px 4px; font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: transparent; border-radius: 7px; cursor: pointer; text-align: left; font-size: 13px; }
.menu button:hover { background: var(--accent-soft); color: var(--accent-tx); }
.menu button i { width: 6px; height: 6px; border-radius: 2px; background: var(--line-strong); flex: none; }
.menu button:hover i { background: var(--brand); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.thumb { position: relative; display: inline-grid; place-items: center; width: 52px; height: 52px; padding: 0; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: var(--sunken); cursor: zoom-in; transition: transform .15s, border-color .15s, box-shadow .15s; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.thumb:hover { transform: scale(1.06); border-color: var(--brand); box-shadow: var(--glow); }
.thumb-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 12.5px; }
.lightbox { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(0, 0, 0, .82); padding: 24px; cursor: zoom-out; animation: fade .2s ease; }

.lightbox .lb-x { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; cursor: pointer; }
.lightbox .lb-x svg { width: 18px; height: 18px; }
.thumb.big { width: 88px; height: 88px; flex: none; }
.stepper { display: flex; gap: 6px; margin: 0 0 4px; padding: 0; list-style: none; counter-reset: none; }
.stepper li { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sunken); color: var(--muted); font-size: 12px; min-width: 0; }
.stepper li b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--line-strong); color: var(--surface); font: 600 11px/1 var(--f-mono); }

.stepper li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper li.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--brand); }

.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 18px; border: 2px dashed color-mix(in srgb, var(--brand) 55%, var(--line-strong)); border-radius: 14px; background: var(--accent-soft); text-align: center; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.drop svg { width: 30px; height: 30px; color: var(--brand); }

.drop span { font-size: 12.5px; color: var(--fg-2); max-width: 40ch; }

input.sr-only:focus-visible + * , .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.q { margin: 6px 0 0; font-size: 15px; font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }

.dest { border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }

.tbl.asig input, .dest .tbl input { width: 92px; height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); font-family: var(--f-mono); text-align: right; }
.tbl.asig input:focus, .dest .tbl input:focus, .dest select:focus, .dest input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rem-top { display: flex; align-items: center; gap: 14px; }
.hero-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 34px 16px 26px; }
.hero-empty > svg { width: 46px; height: 46px; color: var(--brand); padding: 10px; border-radius: 14px; background: var(--accent-soft); box-sizing: content-box; }

@media (max-width: 560px) { .choices { grid-template-columns: minmax(0, 1fr); } .stepper li span { display: none; } .stepper li { justify-content: center; } }
.foto-link { display: inline-block; margin: 0 0 6px; color: var(--accent-tx); font-weight: 600; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- content blocks ---------- */
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid { display: grid; gap: 18px; }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 16px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-h h3 { font-size: 14.5px; font-weight: 600; }
.card-h p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.card-h .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.section-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.section-h p { color: var(--fg-2); max-width: 70ch; font-size: 13.5px; }
.section-h .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { position: relative; background: var(--surface); padding: 16px 18px 15px; min-width: 0; display: flex; flex-direction: column; gap: 6px; transition: background .2s; }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--brand); transform: scaleX(0); transform-origin: left; transition: transform .3s cubic-bezier(.2, .7, .2, 1); }
.kpi:hover::before { transform: scaleX(1); }
.kpi.go { cursor: pointer; }
.kpi.go:hover { background: var(--accent-soft); }
.kpi.go .kpi-l::after { content: "→"; margin-left: auto; color: var(--brand); opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
.kpi.go:hover .kpi-l::after { opacity: 1; transform: none; }
.kpis:not(.soft) > .kpi:first-child .kpi-v { color: var(--accent-tx); }
.kpi-l { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi-l i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.kpi-v { font-size: 27px; font-weight: 600; letter-spacing: -.015em; font-variation-settings: "wdth" 108; line-height: 1.1; overflow-wrap: anywhere; }
.kpi-v.sm { font-size: 21px; }
.kpi-s { font-size: 12px; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.kpis.soft .kpi { background: var(--surface-2); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 99px; font: 500 11px/1.6 var(--f-mono); white-space: nowrap; background: var(--sunken); color: var(--fg-2); }
.chip svg { width: 11px; height: 11px; flex: none; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.wood { background: var(--brand-soft); color: var(--brand); }

.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.pill { transition: border-color .15s, background .15s, color .15s; }
.pill:hover { border-color: var(--brand); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 4px 14px 4px 4px; font: 600 13px/1 var(--f-ui); cursor: pointer; }
.switch i { position: relative; width: 40px; height: 24px; border-radius: 99px; background: var(--line-strong); transition: background .18s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .18s; }
.switch[aria-checked="true"] { border-color: var(--green); }
.switch[aria-checked="true"] i { background: var(--green); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch:disabled { opacity: .6; cursor: progress; }
.pauta-ctls { display: grid; gap: 12px; margin-bottom: 16px; }
.pauta-ctl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
.pauta-ctl .pc-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pauta-ctl .pc-txt span { color: var(--muted); font-size: 12.5px; }
.pauta-ctl .pc-st { color: var(--fg-2); font-size: 12.5px; }
@media (max-width: 720px) { .pauta-ctl { grid-template-columns: minmax(0, 1fr) auto; } .pauta-ctl .pc-st { grid-column: 1 / -1; order: 3; } .pauta-ctl .btn { justify-self: start; } }

/* tables */
.tbl-wrap { overflow-x: auto; margin-inline: -18px; padding-inline: 18px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 10px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl .r { text-align: right; }
.tbl td.r, .tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
.tbl tbody tr[data-act] { cursor: pointer; }
.tbl tbody td { transition: background .12s; }
.tbl tbody tr[data-act]:hover td { background: var(--accent-soft); }
.tbl .sub { display: block; font-size: 11.5px; color: var(--muted); }
.tbl td .num { white-space: nowrap; }
.tbl th.nt { text-transform: none; font-size: 11px; letter-spacing: .02em; }
.tbl tfoot td { border-top: 1px solid var(--line-strong); border-bottom: 0; font-weight: 600; }
.cell-strong { font-weight: 600; }

.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 0 6px; color: var(--fg-2); }
.empty b { color: var(--fg); font-weight: 600; font-size: 14px; }
.empty p { max-width: 56ch; font-size: 13px; }

/* alerts */
.alerts { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.alert:last-child { border-bottom: 0; }
.alert .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.alert .ico svg { width: 13px; height: 13px; }
.alert.crit .ico { background: var(--crit-soft); color: var(--crit); }
.alert.warn .ico { background: var(--warn-soft); color: var(--warn); }
.alert.info .ico { background: var(--accent-soft); color: var(--accent); }
.alert small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* clients */
.clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.client { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; text-align: left; transition: transform .2s, border-color .2s, box-shadow .2s; }
.client:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--glow); }
.client[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.client-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.client-h b { font-weight: 600; font-size: 15px; }
.client-h span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.client dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
.client dt { font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.client dd { margin: 0; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* bars */
.hb { display: flex; flex-direction: column; gap: 10px; }
.hb-r { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.hb-t { height: 10px; background: var(--sunken); border-radius: 0 4px 4px 0; overflow: hidden; }
.hb-t i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; min-width: 72px; }

.meter { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; min-width: 70px; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.meter.low i { background: var(--warn); }
.meter.out i { background: var(--crit); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .axis-l { stroke: var(--line-strong); stroke-width: 1; }
.chart .tk { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.chart .xh { stroke: var(--line-strong); stroke-width: 1; }
.chart-note { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--fg-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 2px; border-radius: 2px; }
.legend i.box { width: 9px; height: 9px; border-radius: 2px; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 150px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px;
}
.tip .tt { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
.tip .tr { display: flex; align-items: center; gap: 8px; }
.tip .tr + .tr { margin-top: 4px; }
.tip .tr i { width: 12px; height: 2px; border-radius: 2px; flex: none; }
.tip .tr b { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .tr span { color: var(--muted); margin-left: auto; padding-left: 10px; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut .chart { width: 168px; flex: none; }
.donut-leg { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 150px; }
.donut-leg div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 12.5px; }
.donut-leg i { width: 9px; height: 9px; border-radius: 2px; align-self: center; }
.donut-leg b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.donut-leg small { grid-column: 2 / 4; color: var(--muted); font-family: var(--f-mono); font-size: 11px; margin-top: -6px; }

/* breakdown list */
.ledger { display: flex; flex-direction: column; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.ledger div:last-child { border-bottom: 0; }
.ledger span { color: var(--fg-2); }
.ledger b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.ledger .total { border-top: 1px solid var(--line-strong); border-bottom: 0; padding-top: 10px; margin-top: 4px; }
.ledger .total span, .ledger .total b { color: var(--fg); font-weight: 600; }
.ledger span small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.ledger .lk { cursor: pointer; border-radius: 6px; }
.ledger .lk:hover span { color: var(--fg); }
.ledger .lk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ldg-h { margin: 4px 0 2px; font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ldg-h + .ledger { margin-bottom: 14px; }
.inv-res { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.inv-res div { background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.inv-res span { font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.inv-res b { font: 600 16px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
@media (max-width: 720px) { .inv-res { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- drawer & forms ---------- */
.drawer { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr) min(600px, 100%); }
.drawer .scrim { background: var(--scrim); }
.panel { background: var(--surface); display: flex; flex-direction: column; min-height: 0; height: 100vh; height: 100dvh; border-left: 1px solid var(--line); box-shadow: var(--shadow); }
.panel > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 14px; border-bottom: 1px solid var(--line); border-top: 3px solid var(--brand); }
.panel > header h2 { font-size: 20px; font-weight: 600; font-variation-settings: "wdth" 110; margin-top: 4px; }
.panel-b { flex: 1; overflow-y: auto; padding: 18px 22px 26px; display: flex; flex-direction: column; gap: 16px; }
.panel > footer { display: flex; gap: 8px; align-items: center; padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface-2); }
.panel > footer .sp { flex: 1; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .line input, .line select, .pago input, .pago select {
  width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); font-size: 13.5px; min-width: 0;
}
.field textarea { height: auto; min-height: 64px; padding: 9px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .line input:focus, .line select:focus, .pago input:focus, .pago select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field input.money, .field input.qty, .line input.money, .line input.qty, .pago input.money, .pago input.qty { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; }
.form-sec h4 { margin: 0; font-size: 13px; font-weight: 600; }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.line.m-sale { grid-template-columns: minmax(0, 2.4fr) minmax(0, .8fr) minmax(0, 1.2fr) 34px; }
.line.m-bbv { grid-template-columns: minmax(0, 2fr) minmax(0, .7fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 34px; }
.line.m-dmg { grid-template-columns: minmax(0, 2.4fr) minmax(0, .8fr) 34px; }
.line .lsub { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.line .field > label { font-size: 9.5px; }
.pagos { display: flex; flex-direction: column; gap: 8px; }
.pago { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 8px; }
.totals { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.form-err { color: var(--crit); font-size: 13px; background: var(--crit-soft); padding: 9px 12px; border-radius: 8px; }
.note { font-size: 12.5px; color: var(--fg-2); background: var(--sunken); border-radius: 9px; padding: 10px 12px; }

.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); border-left: 4px solid var(--brand);
  max-width: calc(100vw - 32px);
}
.loading { opacity: .55; transition: opacity .2s; }

/* Entrada suave al cambiar de sección */
#view.enter > * { animation: rise .42s cubic-bezier(.2, .7, .2, 1) both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; }
#view.enter > *:nth-child(3) { animation-delay: .08s; }
#view.enter > *:nth-child(4) { animation-delay: .12s; }
#view.enter > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.drawer:not([hidden]) .panel { animation: slide .28s cubic-bezier(.2, .7, .2, 1); }
.drawer:not([hidden]) .scrim { animation: fade .28s ease; }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); background: none; }
  .rail { position: sticky; top: 0; z-index: 25; height: auto; flex-direction: row; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .nav-g, .rail-foot { display: none; }
  .brand { padding: 0; }
  .brand .logo { width: auto; height: 40px; max-width: none; }
  .nav { flex-direction: row; gap: 2px; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  .top { position: static; }
  .g-2-1, .g-1-1, .g-3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .kpis, .kpis.k3 { grid-template-columns: minmax(0, 1fr); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .line.m-sale { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; }
  .line.m-sale .f-prod { grid-column: 1 / -1; }
  .line.m-bbv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .line.m-bbv .f-prod { grid-column: 1 / -1; }
  .hb-r { grid-template-columns: minmax(0, 96px) minmax(0, 1fr) auto; }
  .top h1 { font-size: 22px; }
  .drawer { grid-template-columns: 0 minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    parteSocio: k(l => l.parteSocio), debe: k(l => l.ingreso), costo: k(l => l.costoT), miUtil: k(l => l.util),

  }
  for (const m of d.bbDespachos) {
    if (m.tipo === 'devolucion' || !isDate(m.fecha) || m.fecha < desdeN) continue;
    const c = calcVenta(m);
    if (c.rastras > 0) despachos.push({ fecha: m.fecha, col: 'bbDespachos', ref: m, remision: m.remision || '', destino: cfg.punto, rastras: c.rastras });
  }
  // Lo que salió en una misma remisión es un solo viaje: se suma junto en la nómina.
  const porRem = new Map();
  despachos = despachos.filter(x => {
    const rid = x.ref.remisionId; if (!rid) return true;
    const g = porRem.get(rid) || { fecha: x.fecha, col: 'remisiones', id: rid, ref: x.ref, remision: x.remision, destinos: [], rastras: 0 };
    g.rastras += x.rastras; g.destinos.push(x.destino); porRem.set(rid, g);
    return false;
  });
  for (const g of porRem.values()) despachos.push({ ...g, destino: `Viaje a ${g.destinos.join(' + ')}` });
  despachos.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  const nominaMovs = [];
  for (const x of despachos) for (const t of trab) nominaMovs.push({ fecha: x.fecha, tipo: 'devengo', trabajadorId: t.id, valor: Math.round(x.rastras * tarifaTrab(t, x.ref, cfg)), rastras: x.rastras, detalle: `${x.remision ? 'Rem. ' + x.remision + ' · ' : ''}${x.destino}`, col: x.col, id: x.id || x.ref.id });
  for (const r of d.nomina) if (isDate(r.fecha) && r.fecha >= desdeN) nominaMovs.push({ fecha: r.fecha, tipo: r.tipo === 'cargo' ? 'cargo' : 'pago', trabajadorId: r.trabajadorId, valor: n(r.valor), rastras: 0, detalle: r.concepto || r.nota || (r.tipo === 'cargo' ? 'Trabajo extra' : ''), medio: r.medio || '', col: 'nomina', id: r.id });
  for (const a of d.abonos) if (String(a.destino || '').startsWith('nomina:') && isDate(a.fecha) && a.fecha >= desdeN) nominaMovs.push({ fecha: a.fecha, tipo: 'pago', trabajadorId: a.destino.slice(7), valor: n(a.valor), rastras: 0, detalle: `Le pagó ${cli.get(a.clienteId)?.nombre || 'un cliente'} (abono)`, col: 'abonos', id: a.id });
  nominaMovs.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '') || (a.tipo === 'pago' ? 1 : -1));
  const nominaSaldo = new Map(trab.map(t => [t.id, 0]));
  for (const m of nominaMovs) { const s1 = (nominaSaldo.get(m.trabajadorId) || 0) + (m.tipo === 'pago' ? -m.valor : m.valor); nominaSaldo.set(m.trabajadorId, s1); m.saldo = s1; }

  // Anticipos de clientes finales: pagan el pedido al que se cargaron; los que no tienen pedido pagan los más viejos del cliente.
  const pedFinal = [...entries.filter(e => e.canal === 'final'), ...porEntregar.filter(p => p.canal === 'final')];
  const pedPorId = new Map(pedFinal.map(p => [p.id, p]));
  for (const p of pedFinal) { p.calc.anticipo = 0; }
  const sinPedido = new Map();
  for (const a of d.anticipos) {
    const p = a.pedidoId && pedPorId.get(a.pedidoId);
    if (p) p.calc.anticipo += n(a.valor);
    else sinPedido.set(a.clienteId, (sinPedido.get(a.clienteId) || 0) + n(a.valor));
  }
  for (const p of pedFinal) { p.calc.pagado += p.calc.anticipo; p.calc.saldo = p.calc.total - p.calc.pagado; }
  const anticipoLibre = new Map();
  for (const [cid, monto] of sinPedido) {
    let pool = monto;
    const suyos = pedFinal.filter(p => p.ref.clienteId === cid && p.calc.saldo > 0.5).sort((a, b) => (a.ref.estado === 'Pendiente') - (b.ref.estado === 'Pendiente') || (a.fecha || '').localeCompare(b.fecha || ''));
    for (const p of suyos) { const x = Math.min(pool, p.calc.saldo); p.calc.anticipo += x; p.calc.pagado += x; p.calc.saldo -= x; pool -= x; }
    if (pool > 0.5) anticipoLibre.set(cid, pool);
  }
  // Plata recibida de clientes finales por pedidos que no han salido (o sin pedido): se le debe al cliente hasta entregar.
  const anticiposFinal = sum(porEntregar.filter(p => p.canal === 'final'), p => Math.min(p.calc.pagado, p.calc.total)) + sum([...anticipoLibre.values()]);
  // Lo que deben los clientes finales: pedidos despachados con saldo y pedidos confirmados menos su anticipo.
  const finalPorEntregar = sum(porEntregar.filter(p => p.canal === 'final'), p => Math.max(0, p.calc.saldo));
  const finalSaldo = sum(entries.filter(e => e.canal === 'final'), e => Math.max(0, e.calc.saldo)) + finalPorEntregar;
  const mayorSaldo = sum([...cartera.values()], c => Math.max(0, c.saldo));
  const mayorFavor = sum([...cartera.values()], c => Math.max(0, -c.saldo));

  const allDates = [
    ...d.ventas, ...d.abonos, ...d.bbDespachos, ...d.bbVentas, ...d.bbPagos, ...d.pineraCompras, ...d.pineraPagos, ...d.gastos,
  ].map(x => x.fecha).filter(isDate).sort();

  porEntregar.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  MODEL = { d, cfg, hoy, listas, listaBB, listaBBVenta, porEntregar, bbPorEntregar, cli, mayoristas, finales, trab, nominaMovs, nominaSaldo, despachos, desdeN, entries, cartera, estadoPedido, inv, bbEntries, bbSaldo, ledger, pineraSaldo: run, finalSaldo, finalPorEntregar, anticiposFinal, anticipoLibre, mayorSaldo, mayorFavor, firstDate: allDates[0] || '', lastDate: allDates[allDates.length - 1] || '' };
  MODEL_KEY = key;
  return MODEL;
}

/* =========================================================================
   Rango de fechas
   ========================================================================= */
function rangeBounds() {
  const hoy = todayStr();
  const y = +hoy.slice(0, 4), m = +hoy.slice(5, 7);
  switch (S.range) {
    case 'hoy': return { from: hoy, to: hoy };
    case '7d': return { from: addDays(hoy, -6), to: hoy };
    case '15d': return { from: addDays(hoy, -14), to: hoy };
    case '30d': return { from: addDays(hoy, -29), to: hoy };
    case 'mes': return { from: `${y}-${pad(m)}-01`, to: hoy };
    case 'mesant': {
      const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
      return { from: `${py}-${pad(pm)}-01`, to: addDays(`${y}-${pad(m)}-01`, -1) };
    }
    case 'ano': return { from: `${y}-01-01`, to: hoy };
    case 'todo': {
      const M = model();
      const to = M.lastDate && M.lastDate > hoy ? M.lastDate : hoy;
      return { from: M.firstDate && M.firstDate < to ? M.firstDate : addDays(hoy, -29), to };
    }
    case 'custom': {
      const f = isDate(S.customFrom) ? S.customFrom : addDays(hoy, -29);
      const t = isDate(S.customTo) ? S.customTo : hoy;
      return f <= t ? { from: f, to: t } : { from: t, to: f };
    }
    default: return { from: addDays(hoy, -29), to: hoy };
  }
}
const inR = (f, R) => isDate(f) && f >= R.from && f <= R.to;
const rangeLabel = R => {
  const days = diffDays(R.from, R.to) + 1;
  return R.from === R.to ? fmtDate(R.from) : `${fmtDate(R.from)} → ${fmtDate(R.to)} · ${days} días`;
};

function bucketize(R) {
  const days = diffDays(R.from, R.to) + 1;
  const unit = days <= 35 ? 'day' : days <= 210 ? 'week' : 'month';
  const keys = [];
  if (unit === 'day') for (let s = R.from; s <= R.to; s = addDays(s, 1)) keys.push(s);
  else if (unit === 'week') for (let s = mondayOf(R.from); s <= R.to; s = addDays(s, 7)) keys.push(s);
  else {
    let s = R.from.slice(0, 7) + '-01';
    while (s <= R.to) { keys.push(s); const d = toD(s); d.setUTCMonth(d.getUTCMonth() + 1); s = fromD(d); }
  }
  const keyOf = f => unit === 'day' ? f : unit === 'week' ? mondayOf(f) : f.slice(0, 7) + '-01';
  const label = k => unit === 'month' ? `${MESES[+k.slice(5, 7) - 1]} ${k.slice(2, 4)}` : fmtDay(k);
  const tipLabel = k => unit === 'day' ? fmtDate(k) : unit === 'week' ? `Semana del ${fmtDay(k)}` : `${MESES[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
  const index = new Map(keys.map((k, i) => [k, i]));
  return { unit, keys, keyOf, label, tipLabel, index };
}

/* =========================================================================
   Gráficas (SVG propio, colores desde los tokens del tema)
   ========================================================================= */
let CH = {}, chSeq = 0;
function chartSlot(spec, h = 230) { const id = 'c' + (++chSeq); CH[id] = spec; return `<div class="chart" data-chart="${id}" style="height:${h}px"></div>`; }
function drawCharts() {
  for (const el of $$('[data-chart]')) {
    const sp = CH[el.dataset.chart];
    if (sp) { try { DRAW[sp.type](el, sp); } catch (e) { el.innerHTML = '<div class="chart-note">No se pudo dibujar la gráfica.</div>'; } }
  }
}
function niceTicks(lo, hi, count = 4) {
  if (lo === hi) { hi = lo + (lo === 0 ? 1 : Math.abs(lo) * .5); }
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = a; v <= b + step * 1e-6; v += step) ticks.push(+v.toFixed(6));
  return { lo: a, hi: b, ticks };
}
function tipRows(tip, title, rows) {
  tip.textContent = '';
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = title; tip.appendChild(t);
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'tr';
    const i = document.createElement('i'); i.style.background = r.color; if (r.box) { i.style.height = '9px'; i.style.width = '9px'; }
    const b = document.createElement('b'); b.textContent = r.value;
    const s = document.createElement('span'); s.textContent = r.label;
    row.append(i, b, s); tip.appendChild(row);
  }
}
function placeTip(el, tip, x, y) {
  tip.hidden = false;
  const W = el.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = x + 14; if (left + tw > W) left = x - tw - 14; if (left < 0) left = Math.max(0, Math.min(W - tw, x - tw / 2));
  tip.style.left = left + 'px'; tip.style.top = Math.max(0, Math.min(el.clientHeight - th, y - th / 2)) + 'px';
}

const DRAW = {
  line(el, sp) {
    const W = Math.max(260, el.clientWidth), H = el.clientHeight || 230, N = sp.labels.length;
    if (N < 2) { el.innerHTML = `<div class="chart-note">${esc(sp.empty || 'Elige un rango de varios días para ver la tendencia.')}</div>`; return; }
    const vals = sp.series.flatMap(s => s.values);
    const yt = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
    const labW = Math.max(...yt.ticks.map(t => sp.fmtY(t).length)) * 6.6 + 10;
    const m = { t: 10, r: 14, b: 24, l: Math.max(40, labW) };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const x = i => m.l + i * iw / (N - 1);
    const y = v => m.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
    let g = '';
    for (const t of yt.ticks) {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="${t === 0 ? 'axis-l' : 'grid-l'}"/>`;
      g += `<text x="${m.l - 8}" y="${y(t).toFixed(1)}" class="tk" text-anchor="end" dominant-baseline="middle">${esc(sp.fmtY(t))}</text>`;
    }
    const every = Math.max(1, Math.ceil(N / Math.max(2, Math.floor(iw / 64))));
    for (let i = 0; i < N; i += every) g += `<text x="${x(i).toFixed(1)}" y="${H - 6}" class="tk" text-anchor="${i === 0 ? 'start' : 'middle'}">${esc(sp.fmtX(sp.labels[i]))}</text>`;
    const base = y(Math.max(yt.lo, 0));
    for (const s of sp.series) {
      const pts = s.values.map((v, i) => [x(i), y(v)]);
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
      if (s.area) g += `<path d="${d}L${x(N - 1).toFixed(1)} ${base.toFixed(1)}L${x(0).toFixed(1)} ${base.toFixed(1)}Z" style="fill:${s.color};fill-opacity:.10;stroke:none"/>`;
      g += `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
      const L = pts[N - 1]; g += `<circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;
    }
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.aria || '')}">${g}<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><g class="hov"></g><rect x="${m.l}" y="0" width="${iw}" height="${H}" style="fill:transparent"/></svg><div class="tip" hidden></div>`;
    const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), hov = svg.querySelector('.hov');
    const show = cx => {
      const i = Math.max(0, Math.min(N - 1, Math.round((cx - m.l) / (iw / (N - 1)))));
      const X = x(i).toFixed(1);
      xh.setAttribute('x1', X); xh.setAttribute('x2', X); xh.setAttribute('visibility', 'visible');
      hov.innerHTML = sp.series.map(s => `<circle cx="${X}" cy="${y(s.values[i]).toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`).join('');
      tipRows(tip, sp.tipX(sp.labels[i]), sp.series.map(s => ({ color: s.color, value: sp.fmtTip(s.values[i]), label: s.label })));
      placeTip(el, tip, +X, m.t + ih / 2);
    };
    const hide = () => { xh.setAttribute('visibility', 'hidden'); hov.innerHTML = ''; tip.hidden = true; };
    svg.addEventListener('pointermove', e => show(e.clientX - svg.getBoundingClientRect().left));
    svg.addEventListener('pointerleave', hide);
  },
  donut(el, sp) {
    const S0 = Math.min(el.clientWidth || 168, 168), r = S0 / 2 - 9, sw = 16, C = 2 * Math.PI * r;
    const total = sum(sp.items, i => Math.max(0, i.value));
    let g = `<circle cx="${S0 / 2}" cy="${S0 / 2}" r="${r}" style="fill:none;stroke:var(--sunken);stroke-width:${sw}"/>`;
    let acc = 0;
    const segs = [];
    if (total > 0) for (const it of sp.items) {
      const v = Math.max(0, it.value); if (!v) continue;
      const len = v / total * C, gap = sp.items.filter(i => i.value > 0).length > 1 ? 2 : 0;
      g += `<circle data-i="${segs.length}" cx="${S0 / 2}" cy="${S0 / 2}" r="${r}" style="fill:none;stroke:${it.color};stroke-width:${sw};cursor:default" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${S0 / 2} ${S0 / 2})"/>`;
      segs.push(it); acc += len;
    }
    g += `<text x="${S0 / 2}" y="${S0 / 2 - 4}" text-anchor="middle" style="fill:var(--fg);font:600 17px var(--f-ui)">${esc(sp.center)}</text>`;
    g += `<text x="${S0 / 2}" y="${S0 / 2 + 15}" text-anchor="middle" class="tk">${esc(sp.centerLabel || '')}</text>`;
    el.style.height = S0 + 'px';
    el.innerHTML = `<svg width="${S0}" height="${S0}" viewBox="0 0 ${S0} ${S0}" role="img" aria-label="${esc(sp.aria || '')}">${g}</svg><div class="tip" hidden></div>`;
    const tip = el.querySelector('.tip');
    $$('circle[data-i]', el).forEach(c => {
      c.addEventListener('pointermove', e => {
        const it = segs[+c.dataset.i], rc = el.getBoundingClientRect();
        tipRows(tip, it.label, [{ color: it.color, box: true, value: sp.fmt(it.value), label: pct(it.value / total) }]);
        placeTip(el, tip, e.clientX - rc.left, e.clientY - rc.top);
      });
      c.addEventListener('pointerleave', () => { tip.hidden = true; });
    });
  },
};

function hbars(items, { fmt, color = 'var(--s1)', max } = {}) {

}

function delta(cur, prev) {
  if (!prev || !Number.isFinite(cur / prev)) return '';

  if (!Number.isFinite(d)) return '';
  const tone = d >= 0 ? 'good' : 'crit';

function renderFilters() {

const VIEW_FN = {};

function prevRange(R) {
  const days = diffDays(R.from, R.to) + 1;
  return { from: addDays(R.from, -days), to: addDays(R.from, -1) };
}
function periodo(M, R) {
  const E = M.entries.filter(e => inR(e.fecha, R));
  const G = M.d.gastos.filter(g => inR(g.fecha, R));
  const PD = pautaDias(M.cfg, R.from, R.to, M.hoy), pauta = sum(PD, x => x.valor);
  const NX = nominaExtras(M, R), extras = sum(NX, x => x.valor);
  const ingreso = sum(E, e => e.ingreso), utilB = sum(E, e => e.util), gastos = sum(G, g => g.valor) + pauta + extras;
  return { E, G, PD, pauta, NX, extras, ingreso, utilB, gastos, utilN: utilB - gastos, rastras: sum(E, e => e.rastras), piezas: sum(E, e => e.piezas) };
}
// Trabajos extra de nómina: no son por rastra, así que no están en el costo y cuentan como gasto.
const nominaExtras = (M, R) => M.nominaMovs.filter(m => m.tipo === 'cargo' && inR(m.fecha, R));
function trend(R, entries, gastos, pick) {
  const B = bucketize(R);
  const a = B.keys.map(() => 0), b = B.keys.map(() => 0);
  for (const e of entries) { const i = B.index.get(B.keyOf(e.fecha)); if (i != null) { a[i] += pick ? pick(e) : e.ingreso; b[i] += e.util; } }
  for (const g of gastos || []) { const i = B.index.get(B.keyOf(g.fecha)); if (i != null) b[i] -= n(g.valor); }
  return { B, a, b };
}
function trendChart(R, entries, gastos, o = {}) {
  const T = trend(R, entries, gastos);
  return chartSlot({
    type: 'line', labels: T.B.keys, fmtX: T.B.label, tipX: T.B.tipLabel, fmtY: v => cop(v, true), fmtTip: v => cop(v),
    aria: o.aria || 'Ventas y utilidad en el tiempo',
    series: [
      { label: o.aLabel || 'Ventas', color: 'var(--s3)', values: T.a },
      { label: o.bLabel || 'Utilidad', color: 'var(--s1)', values: T.b, area: true },
    ],
  }, o.h || 240);
}
const trendLegend = (a = 'Ventas', b = 'Utilidad') => `<div class="legend"><span><i style="background:var(--s3)"></i>${a}</span><span><i style="background:var(--s1)"></i>${b}</span></div>`;

function alertas(M) {
  const out = [];
  for (const p of M.porEntregar) {
    const dd = diffDays(M.hoy, p.fecha);
    out.push([dd < 0 ? 'crit' : dd <= 7 ? 'warn' : 'info', `Entrega a ${p.cliente}: ${num(p.calc.piezas, 0)} pzs por ${cop(p.calc.total)}`,
      dd < 0 ? `Estaba para el ${fmtDate(p.fecha)}. Márcalo como ${p.canal === 'final' ? 'despachado' : p.canal === 'bb' ? 'entregada' : 'entregado'} cuando salga.` : dd === 0 ? 'La entrega es hoy.' : `Para el ${fmtDate(p.fecha)}, en ${dd} ${dd === 1 ? 'día' : 'días'}.`, p.canal === 'final' ? 'final' : p.canal === 'bb' ? 'bb' : 'mayoristas']);
  }
  for (const c of M.cartera.values()) {
    if (c.vencido > 0.5) out.push(['crit', `${c.cliente.nombre} tiene ${cop(c.vencido)} vencido`, `Lleva ${c.mora} días de mora. Saldo total ${cop(c.saldo)}.`, 'mayoristas']);
    else if (c.prox && diffDays(M.hoy, c.prox) <= 5 && c.saldo > 0.5) out.push(['warn', `${c.cliente.nombre} tiene un pago por vencer`, `Vence el ${fmtDate(c.prox)}. Saldo ${cop(c.saldo)}.`, 'mayoristas']);
  }
  const bajos = [...M.inv.values()].filter(r => r.desp > 0 && r.stock <= n(M.cfg.stockMin));
  if (bajos.length) out.push(['warn', `${bajos.length} ${bajos.length === 1 ? 'referencia está' : 'referencias están'} por acabarse en ${M.cfg.punto}`, bajos.slice(0, 4).map(r => `${r.nombre}: ${num(r.stock, 0)}`).join(' · '), 'bb']);
  if (M.bbSaldo > 0.5) {
    const ult = M.d.bbPagos.map(p => p.fecha).filter(isDate).sort().pop();
    out.push([ult && diffDays(ult, M.hoy) > 15 ? 'warn' : 'info', `${M.cfg.socio} te debe ${cop(M.bbSaldo)}`, ult ? `Último pago el ${fmtDate(ult)}.` : 'Todavía no hay pagos registrados.', 'bb']);
  }
  if (M.pineraSaldo > 0.5) out.push(['info', `Le debes ${cop(M.pineraSaldo)} a la pinera`, 'Saldo del estado de cuenta con La Pinera.', 'compras']);
  const debeN = M.trab.filter(t => (M.nominaSaldo.get(t.id) || 0) > 0.5);
  if (debeN.length) { const sab = sabadoDe(M.hoy), dd = diffDays(M.hoy, sab); out.push([dd <= 1 ? 'warn' : 'info', `Nómina: le debes ${cop(sum(debeN, t => M.nominaSaldo.get(t.id)))}`, `${debeN.map(t => `${t.nombre} ${cop(M.nominaSaldo.get(t.id))}`).join(' · ')}. Se paga el sábado ${fmtDay(sab)}${dd === 0 ? ' (hoy)' : ''}.`, 'nomina']); }
  if (M.finalSaldo > 0.5) out.push(['warn', `Clientes finales te deben ${cop(M.finalSaldo)}`, 'Pedidos con pago pendiente.', 'final']);
  return out;
}
function alertList(list) {
  if (!list.length) return `<div class="empty"><b>Todo en orden.</b><p>No hay pagos vencidos, ni inventario bajo, ni deudas pendientes.</p></div>`;
  const ic = { crit: 'alert', warn: 'clock', info: 'info' };
  return `<div class="alerts">${list.map(([t, h, s, v]) => `<div class="alert ${t}"><span class="ico">${icon(ic[t])}</span><div>${esc(h)}<small>${esc(s)}</small></div><button type="button" class="btn ghost sm" data-act="nav" data-v="${v}">Ver</button></div>`).join('')}</div>`;
}

function onboarding() {

/* ---------- Resumen ---------- */
// Pendientes: pedidos que faltan por entregar y quién le debe a quién hoy.
function pendientes(M) {
  const PE = M.porEntregar;
  const tp = table([
    { h: 'Entrega', f: p => { const dd = diffDays(M.hoy, p.fecha); return `<span class="num">${fmtDate(p.fecha)}</span><span class="sub ${dd < 0 ? 'neg' : ''}">${dd < 0 ? `atrasado ${-dd} d` : dd === 0 ? 'hoy' : `en ${dd} d`}</span>`; } },
    { h: 'Cliente', f: p => `<span class="cell-strong">${esc(p.cliente)}</span><span class="sub">${p.canal === 'final' ? 'Cliente final' : p.canal === 'bb' ? `Sociedad · te liquida ${cop(p.calc.debe, true)}` : 'Mayorista'} · ${num(p.calc.piezas, 0)} pzs · ${num(p.calc.rastras)} rastras</span>` },
    { h: 'Total', r: 1, f: p => cop(p.calc.total) },
    { h: 'Anticipo', r: 1, f: p => p.calc.pagado > 0.5 ? cop(p.calc.pagado) : '<span class="muted">—</span>' },
    { h: 'Cobrar al entregar', r: 1, f: p => `<b>${cop(Math.max(0, p.calc.total - p.calc.pagado))}</b>` },
  ], PE, { act: p => editAttr(p.col || 'ventas', p.id), empty: '<p class="muted">No hay pedidos por entregar.</p>',
    foot: PE.length > 1 ? ['Total', '', cop(sum(PE, p => p.calc.total)), cop(sum(PE, p => p.calc.pagado)), cop(sum(PE, p => Math.max(0, p.calc.total - p.calc.pagado)))] : null });

  const fila = (label, sub, v, view) => `<div${view ? ` class="lk" data-act="nav" data-v="${view}" role="button" tabindex="0"` : ''}><span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span><b>${cop(v)}</b></div>`;
  const deben = [], debes = [];
  for (const k of M.cartera.values()) {
    if (k.saldo > 0.5) deben.push([k.cliente.nombre, ['Mayorista', k.vencido > 0.5 ? `${cop(k.vencido)} vencido` : '', k.porEntregar > 0.5 ? `${cop(k.porEntregar, true)} de pedido por entregar` : '', !k.vencido && !k.porEntregar && k.prox ? `vence el ${fmtDay(k.prox)}` : ''].filter(Boolean).join(' · '), k.saldo, 'mayoristas']);
    else if (k.saldo < -0.5) debes.push([k.cliente.nombre, 'Saldo a favor del mayorista · se descuenta del próximo pedido', -k.saldo, 'mayoristas']);
  }
  if (M.bbSaldo > 0.5) deben.push([M.cfg.socio, `Ventas de ${M.cfg.punto}`, M.bbSaldo, 'bb']);
  if (M.bbPorEntregar > 0.5) deben.push([M.cfg.socio, `Ventas de la sociedad por entregar · lo que te liquida`, M.bbPorEntregar, 'bb']);
  const finDeben = new Map();
  for (const e of M.entries) if (e.canal === 'final' && e.calc.saldo > 0.5) { const r = finDeben.get(e.cliente) || { v: 0, desp: 0, pend: 0, ant: 0 }; r.v += e.calc.saldo; r.desp++; finDeben.set(e.cliente, r); }
  for (const p of M.porEntregar) if (p.canal === 'final' && p.calc.saldo > 0.5) { const r = finDeben.get(p.cliente) || { v: 0, desp: 0, pend: 0, ant: 0 }; r.v += p.calc.saldo; r.pend++; r.ant += p.calc.pagado; finDeben.set(p.cliente, r); }
  for (const [nm, r] of finDeben) deben.push([nm, ['Cliente final', r.desp ? `${r.desp} ${r.desp === 1 ? 'pedido despachado' : 'pedidos despachados'}` : '', r.pend ? `${r.pend === 1 ? 'pedido' : r.pend + ' pedidos'} por entregar` : '', r.ant > 0.5 ? `ya dio ${cop(r.ant, true)} de anticipo` : ''].filter(Boolean).join(' · '), r.v, 'final']);
  if (M.pineraSaldo > 0.5) debes.push(['La pinera', 'Compra de madera', M.pineraSaldo, 'compras']);
  for (const t of M.trab) { const v = M.nominaSaldo.get(t.id) || 0; if (v > 0.5) debes.push([t.nombre, `Nómina · se paga el sábado ${fmtDay(sabadoDe(M.hoy))}`, v, 'nomina']); }
  // Un anticipo de un pedido no es plata que debas (debes la madera). Solo cuenta el que no tiene pedido.
  for (const [cid, v] of M.anticipoLibre) debes.push([M.cli.get(cid)?.nombre || 'Cliente final', 'Anticipo sin pedido · se descuenta del próximo', v, 'final']);
  const bloque = (titulo, rows, vacio) => `<h4 class="ldg-h">${titulo}</h4><div class="ledger">${rows.length ? rows.sort((a, b) => b[2] - a[2]).map(r => fila(...r)).join('') + (rows.length > 1 ? `<div class="total"><span>Total</span><b>${cop(sum(rows, r => r[2]))}</b></div>` : '') : `<div><span class="muted">${vacio}</span><b></b></div>`}</div>`;
  const deudas = bloque('Te deben', deben, 'Nadie te debe.') + bloque('Tú debes', debes, 'No debes nada.');
  return `<div class="grid g-2-1">
    ${card('Pedidos por entregar', tp, { sub: 'Mayoristas y clientes finales. Toca uno para marcarlo cuando salga.' })}
    ${card('Deudas', deudas, { sub: 'Lo que te deben y lo que debes hoy, sin importar el rango de fechas.' })}
  </div>`;
}
VIEW_FN.resumen = R => {
  const M = model();
  const P = periodo(M, R);
  const Q = S.range === 'todo' ? null : periodo(M, prevRange(R));
  const invPzs = sum([...M.inv.values()], r => Math.max(0, r.stock));
  const invVal = sum([...M.inv.values()], r => Math.max(0, r.stock) * r.pbb);
  const porCobrar = M.mayorSaldo + M.finalSaldo + Math.max(0, M.bbSaldo) + M.bbPorEntregar;
  const margen = P.ingreso ? P.utilN / P.ingreso : NaN;
  const porRastra = P.rastras ? P.utilN / P.rastras : 0;

  const top = `<div class="kpis">
    ${kpi('Ventas', cop(P.ingreso), `${P.E.length} ${P.E.length === 1 ? 'venta' : 'ventas'}${Q ? ' ' + delta(P.ingreso, Q.ingreso) : ''}`)}
    ${kpi('Utilidad neta', signed(P.utilN), `Margen ${pct(margen)}${Q ? ' ' + delta(P.utilN, Q.utilN) : ''}`, { cls: '' })}
    ${kpi('Rastras vendidas', num(P.rastras, 2), `${num(P.piezas, 0)} piezas`)}
    ${kpi('Utilidad por rastra', signed(porRastra), 'Utilidad neta ÷ rastras vendidas')}
  </div>`;
  const pos = `<div class="kpis soft">
    ${kpi('Por cobrar hoy', cop(porCobrar), `Mayoristas ${cop(M.mayorSaldo, true)} · ${esc(M.cfg.socio)} ${cop(Math.max(0, M.bbSaldo) + M.bbPorEntregar, true)} · Finales ${cop(M.finalSaldo, true)}${M.mayorFavor > 0.5 ? ` · Saldo a favor de mayoristas ${cop(M.mayorFavor, true)}` : ''}`, { cls: 'sm', go: 'mayoristas' })}
    ${kpi('Saldo con la pinera', M.pineraSaldo >= 0 ? cop(M.pineraSaldo) : cop(-M.pineraSaldo), Math.abs(M.pineraSaldo) < 0.5 ? 'Sin saldo' : M.pineraSaldo > 0 ? 'Le debes' : 'A tu favor', { cls: 'sm', go: 'compras' })}
    ${kpi(`Inventario en ${esc(M.cfg.punto)}`, `${num(invPzs, 0)} pzs`, `${cop(invVal)} a precio de sociedad`, { cls: 'sm', go: 'bb' })}
    ${kpi('Gastos del período', cop(P.gastos), `${P.G.length} ${P.G.length === 1 ? 'registro' : 'registros'}${P.pauta ? ` + ${cop(P.pauta, true)} de pauta` : ''}${P.extras ? ` + ${cop(P.extras, true)} de nómina extra` : ''} · ya restados de la utilidad`, { cls: 'sm', go: 'compras' })}
  </div>`;

  if (!M.firstDate) return top + pendientes(M) + onboarding();

  const canales = ['mayorista', 'bb', 'final'].map(k => ({ label: CANAL[k].label, color: CANAL[k].color, value: sum(P.E.filter(e => e.canal === k), e => e.ingreso), util: sum(P.E.filter(e => e.canal === k), e => e.util), rastras: sum(P.E.filter(e => e.canal === k), e => e.rastras) }));
  const totCan = sum(canales, c => c.value);
  const donut = totCan > 0 ? `<div class="donut">${chartSlot({ type: 'donut', items: canales, center: cop(totCan, true), centerLabel: 'ventas', fmt: v => cop(v), aria: 'Ventas por canal' }, 168)}
    <div class="donut-leg">${canales.map(c => `<div><i style="background:${c.color}"></i><span>${c.label}</span><b>${pct(c.value / totCan)}</b><small>${cop(c.value, true)} · ${num(c.rastras, 1)} rastras</small></div>`).join('')}</div></div>`
    : `<div class="chart-note" style="height:168px">Sin ventas en este período.</div>`;

  const porMedida = new Map();
  for (const e of P.E) for (const l of e.lines) {
    const k = medidaOf(l);
    const r = porMedida.get(k) || { label: k, value: 0, rastras: 0 };
    r.value += l.util; r.rastras += l.rastrasT; porMedida.set(k, r);
  }
  const med = [...porMedida.values()].sort((a, b) => b.value - a.value).slice(0, 8);

  const ult = table([
    { h: 'Fecha', f: e => `<span class="num">${fmtDate(e.fecha)}</span>` },
    { h: 'Canal', f: e => `<span class="chip" style="gap:6px"><i style="width:8px;height:8px;border-radius:2px;background:${CANAL[e.canal].color}"></i>${CANAL[e.canal].label}</span>` },
    { h: 'Cliente', f: e => esc(e.cliente) },
    { h: 'Rastras', r: 1, f: e => num(e.rastras) },
    { h: 'Venta', r: 1, f: e => cop(e.ingreso) },
    { h: 'Utilidad', r: 1, f: e => signed(e.util) },
  ], P.E.slice(0, 8), { act: e => editAttr(e.src, e.id), empty: '<p>No hay ventas en este período.</p>' });

  return `${top}${pos}${pendientes(M)}
    <div class="grid g-2-1">
      ${card('Ventas y utilidad', trendLegend('Ventas', 'Utilidad neta') + trendChart(R, P.E, [...P.G, ...P.PD, ...P.NX]), { sub: 'Lo que te queda a ti en cada canal, después de costos, gastos y pauta.' })}
      ${card('Ventas por canal', donut, { sub: 'Barro Blanco cuenta lo que Rubén te liquida.' })}
    </div>
    <div class="grid g-1-1">
      ${card('Utilidad por medida', med.length ? hbars(med, { fmt: v => cop(v, true) }) : '<div class="chart-note" style="height:120px">Sin ventas en este período.</div>', { sub: 'Las medidas que más te dejan en el período.' })}
      ${card('Atención', alertList(alertas(M)), { sub: 'Lo que necesita tu atención hoy.' })}
    </div>
    ${card('Últimas ventas', ult, { acts: btn('Ver mayoristas', 'data-act="nav" data-v="mayoristas"', 'ghost sm') })}`;
};

/* ---------- Mayoristas ---------- */
function estadoChip(p, hoy) {
  if (!p) return '';
  if (p.pend <= 0.5) return chip('good', 'Pagado', 'check');
  if (p.vence < hoy) return chip('crit', `Vencido · ${diffDays(p.vence, hoy)} d`, 'alert');
  if (p.pagado > 0.5) return chip('warn', `Abonado ${pct(p.pagado / p.total)}`, 'clock');
  return chip('', `Vence ${fmtDay(p.vence)}`, 'clock');
}
VIEW_FN.mayoristas = R => {
  const M = model();
  const clientes = M.mayoristas.slice().sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
  const head = `<div class="section-h"><p>Clientes que te compran al por mayor con crédito. Un pedido confirmado ya es lo que te deben, aunque todavía no se entregue; los abonos pagan primero los pedidos más viejos, así ves qué está vencido.</p>
    <div class="acts">${addBtn('Pedido', 'venta-mayorista', 'primary sm')}${addBtn('Abono', 'abono')}${addBtn('Cliente', 'cliente')}</div></div>`;
  if (!clientes.length) return head + card('', emptyState('Agrega tus clientes mayoristas', 'Crea a Madera San Fermín y Madera San Nicolás con sus días de crédito y su lista de precios. Después registras pedidos y abonos.', addBtn('Cliente mayorista', 'cliente', '')));

  const E = M.entries.filter(e => e.canal === 'mayorista' && inR(e.fecha, R));
  const sel = S.filterCli && M.cli.has(S.filterCli) ? S.filterCli : '';
  const cards = clientes.map(c => {
    const k = M.cartera.get(c.id);

  return `${head}<div class="clients">${cards}</div>${peCard}${kp}
    ${card(sel ? `Pedidos de ${esc(M.cli.get(sel).nombre)}` : 'Pedidos', ped, { acts: sel ? btn('Ver todos', `data-act="cli" data-id="${esc(sel)}"`, 'ghost sm') : '' })}

  if (!inv.length && !M.d.bbPagos.length && !M.bbEntries.length) return head + pbCard + card('', emptyState('Todavía no hay movimientos con Barro Blanco', `Registra el primer despacho con la relación de despacho: medidas, largos y cantidades. El precio de sociedad sale de la lista “${esc(M.listaBB ? M.listaBB.nombre : 'Sociedad Barro Blanco')}”.`, addBtn('Despacho al punto', 'bb-despacho', '')))
    + card(`Inventario en ${esc(cfg.punto)}`, `<div class="inv-res"><div><span>Piezas</span><b>0</b></div><div><span>Rastras</span><b>0</b></div><div><span>Referencias</span><b>0</b></div><div><span>A precio de sociedad</span><b>$0</b></div><div><span>Tu costo</span><b>$0</b></div><div><span>Por acabarse</span><b>0</b></div></div><p class="muted">Cuando registres el primer despacho, aquí ves cada pieza que hay en el punto, lo vendido y lo que queda.</p>`, { sub: 'Lo que hay hoy en el punto: despachado menos devuelto menos vendido.' });

  const E = M.bbEntries.filter(e => inR(e.fecha, R));
  const k = f => sum(E, e => f(e.calc));
  const venta = k(c => c.venta), base = k(c => c.base), up = k(c => c.utilPunto), mi = k(c => c.miParte), socio = k(c => c.parteSocio), debe = k(c => c.debe), costo = k(c => c.costo), miU = k(c => c.miUtil), ras = k(c => c.rastras);

    ${kpi('Vendido en el punto', cop(venta), `${num(ras)} rastras · ${E.length} reportes`)}
    ${kpi('Tu utilidad', signed(miU), `${cop(mi, true)} de tu ${p}% + margen sobre tu costo`)}

  const invT = table([

    { h: 'Precio sociedad', r: 1, f: r => cop(r.pbb) },

    { h: 'Valor', r: 1, f: r => cop(Math.max(0, r.stock) * r.pbb) },
  ], inv, { empty: '<p>No hay piezas en el punto.</p>', foot: inv.length > 1 ? ['Total', num(sum(inv, r => r.desp - r.dev), 0), num(sum(inv, r => r.vend), 0), num(invPzs, 0), '', '', ...(M.listaBBVenta ? [''] : []), cop(invVal)] : null });
  const invRas = sum(inv, r => Math.max(0, r.stock) * r.rastras), bajos = inv.filter(r => r.desp > 0 && r.stock <= n(cfg.stockMin));

    { h: 'Venta punto', r: 1, f: e => cop(e.calc.venta) },

  const P0 = M.d.bbPagos.filter(x => inR(x.fecha, R)).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  return `${head}${kp}${pbCard}

  const pend = M.porEntregar.filter(p => p.canal === 'final');

  const dir = new Map();
  const nuevo = (o = {}) => ({ id: '', nombre: 'Sin nombre', empresa: '', oficio: '', celular: '', municipio: '', n: 0, total: 0, saldo: 0, anticipo: 0, pend: 0, ultima: '', ...o });
  for (const c of M.finales) dir.set('id:' + c.id, nuevo({ id: c.id, nombre: c.nombre, empresa: c.empresa || '', oficio: c.oficio || '', celular: c.celular || '', municipio: c.municipio || '', anticipo: M.anticipoLibre.get(c.id) || 0 }));

    r.n++; r.total += e.ingreso; r.saldo += Math.max(0, e.calc.saldo); if ((e.fecha || '') > r.ultima) r.ultima = e.fecha; dir.set(key, r);
  }

    const r = dir.get(key) || nuevo({ nombre: c.nombre || 'Sin nombre', celular: c.celular || '', municipio: c.municipio || '' });
    r.pend++; r.anticipo += Math.min(p.calc.pagado, p.calc.total); r.saldo += Math.max(0, p.calc.saldo); dir.set(key, r);
  }
  const dt = table([
    { h: 'Cliente', f: r => `<span class="cell-strong">${esc(r.nombre)}</span><span class="sub">${esc([r.empresa !== r.nombre ? r.empresa : '', r.oficio && r.oficio !== 'Persona' ? r.oficio : ''].filter(Boolean).join(' · '))}</span>` },
    { h: 'Municipio', f: r => esc(r.municipio || '—') },

    { h: 'Comprado', r: 1, f: r => cop(r.total) },

/* ---------- Pauta (publicidad en Meta) ---------- */
const PLATAFORMAS = ['Meta (Facebook e Instagram)', 'Google', 'TikTok', 'Otra'];
const campanas = (cfg = CFG()) => (cfg.pauta && Array.isArray(cfg.pauta.campanas) ? cfg.pauta.campanas : []);
// Días que la campaña estuvo prendida: [{desde, hasta}] (hasta vacío = sigue prendida). Las campañas viejas usaban inicio/fin.
const periodosDe = c => Array.isArray(c.periodos) ? c.periodos.filter(p => isDate(p.desde)) : isDate(c.inicio) ? [{ desde: c.inicio, hasta: c.fin || '' }] : [];
const enPeriodo = (p, f) => f >= p.desde && (!isDate(p.hasta) || f <= p.hasta);
const campActiva = (c, f, hoy) => f <= hoy && periodosDe(c).some(p => enPeriodo(p, f));
const periodoHoy = (c, hoy) => periodosDe(c).find(p => enPeriodo(p, hoy));
const primerDia = cs => cs.flatMap(c => periodosDe(c).map(p => p.desde)).sort()[0] || '';
const mensualDe = c => n(c.presupuestoMensual) || n(c.presupuestoDiario) * 30;
const finDeMes = mes => addDays(fromD(new Date(Date.UTC(+mes.slice(0, 4), +mes.slice(5, 7), 1))), -1);
function diasActivosMes(c, mes, hoy) {
  let k = 0;
  for (let f = mes + '-01'; f.slice(0, 7) === mes; f = addDays(f, 1)) if (campActiva(c, f, hoy)) k++;
  return k;
}
const tieneReal = (c, mes) => c.reales && c.reales[mes] !== undefined && c.reales[mes] !== null && c.reales[mes] !== '';
// Gasto de pauta día por día: el cobro real del mes repartido entre sus días activos o, si no hay, el presupuesto diario.
function pautaDias(cfg, from, to, hoy) {
  const out = [], cs = campanas(cfg);
  const ini = primerDia(cs);
  if (!ini) return out;
  const fin = to < hoy ? to : hoy, cache = new Map();
  for (let f = from < ini ? ini : from; f <= fin; f = addDays(f, 1)) {
    let v = 0;
    for (const c of cs) {
      if (!campActiva(c, f, hoy)) continue;
      const mes = f.slice(0, 7);
      if (tieneReal(c, mes)) {
        const k = (c.id || c.nombre) + mes;
        if (!cache.has(k)) cache.set(k, diasActivosMes(c, mes, hoy));
        v += n(c.reales[mes]) / Math.max(1, cache.get(k));
      } else v += n(c.presupuestoDiario);
    }
    if (v) out.push({ fecha: f, valor: v });
  }
  return out;
}

VIEW_FN.pauta = R => {
  const M = model(), cfg = M.cfg, hoy = M.hoy, cs = campanas(cfg);
  const head = `<div class="section-h"><p>Lo que inviertes en publicidad en Meta (Facebook e Instagram). Mientras la pauta está prendida, cada día suma su presupuesto diario; apagada no suma nada. Si Meta te cobra otro valor en un mes, registra el cobro real y ese reemplaza el cálculo. La pauta se suma a los gastos y se resta de la utilidad neta.</p>
    <div class="acts">${addBtn('Campaña', 'campana', cs.length ? 'sm' : 'primary sm')}${cs.length ? addBtn('Cobro real del mes', 'pauta-real') : ''}</div></div>`;
  if (!cs.length) return head + card('', emptyState('Todavía no hay campañas', 'Crea tu campaña de Meta con su presupuesto mensual o diario. La prendes o la apagas con un interruptor y el gasto se calcula solo.', addBtn('Campaña', 'campana', '')));
  const ctl = `<div class="pauta-ctls">${cs.map(c => {
    const on = !!periodoHoy(c, hoy), ps = periodosDe(c), ult = ps.slice().sort((a, b) => a.desde.localeCompare(b.desde)).pop();
    const desde = on ? `Prendida desde el ${fmtDate(periodoHoy(c, hoy).desde)}` : ult ? (isDate(ult.hasta) && ult.hasta < hoy ? `Apagada desde el ${fmtDate(addDays(ult.hasta, 1))}` : `Programada desde el ${fmtDate(ult.desde)}`) : 'Apagada · no ha estado prendida';
    return `<div class="pauta-ctl">
      <div class="pc-txt"><b>${esc(c.nombre)}</b><span>${esc(c.plataforma || '')}</span><span>${cop(mensualDe(c))} al mes · ${cop(c.presupuestoDiario)} al día</span></div>
      <button type="button" class="switch" role="switch" aria-checked="${on}" data-act="pauta-switch" data-id="${esc(c.id)}"><i></i><span>${on ? 'Prendida' : 'Apagada'}</span></button>
      <span class="pc-st">${esc(desde)}</span>
      ${btn(`${icon('edit')}Presupuesto`, `data-act="campana-edit" data-id="${esc(c.id)}"`, 'sm')}
    </div>`;
  }).join('')}</div>`;

  const PD = pautaDias(cfg, R.from, R.to, hoy), pautaR = sum(PD, x => x.valor);
  const activas = cs.filter(c => campActiva(c, hoy, hoy));
  const diario = sum(activas, c => c.presupuestoDiario);
  const mes = hoy.slice(0, 7), fm = finDeMes(mes), quedan = diffDays(hoy, fm);
  const llevaMes = sum(pautaDias(cfg, mes + '-01', hoy, hoy), x => x.valor);
  const proy = llevaMes + sum(activas, c => { const p = periodoHoy(c, hoy); return n(c.presupuestoDiario) * Math.max(0, isDate(p.hasta) ? Math.min(quedan, diffDays(hoy, p.hasta)) : quedan); });
  const fin = M.entries.filter(e => e.canal === 'final' && inR(e.fecha, R)), vf = sum(fin, e => e.ingreso);

  const kp = `<div class="kpis">
    ${kpi('Pauta del período', cop(pautaR), `${PD.length} ${PD.length === 1 ? 'día' : 'días'} con pauta · ya restada de la utilidad`, { dot: 'var(--s2)' })}
    ${kpi('Presupuesto diario', cop(diario), activas.length ? `${activas.length} ${activas.length === 1 ? 'campaña prendida' : 'campañas prendidas'} · ${cop(sum(activas, mensualDe), true)} al mes` : 'Pauta apagada: hoy no suma')}
    ${kpi(`Proyección de ${MESES[+mes.slice(5, 7) - 1]}`, cop(proy), activas.length ? `Llevas ${cop(llevaMes)}; si sigue prendida hasta el ${fmtDay(fm)}` : `Llevas ${cop(llevaMes)}; apagada no suma más`)}
    ${kpi('Ventas a clientes finales por cada $1', pautaR && vf ? `$${num(vf / pautaR, 1)}` : '—', fin.length ? `${fin.length} ${fin.length === 1 ? 'pedido' : 'pedidos'} · ${cop(pautaR / fin.length)} de pauta por pedido` : 'Sin pedidos de clientes finales en el período')}
  </div>`;

  // Pauta frente a ventas a clientes finales, en el tiempo
  const B = bucketize(R);
  const pv = B.keys.map(() => 0), vv = B.keys.map(() => 0);
  for (const d of PD) { const i = B.index.get(B.keyOf(d.fecha)); if (i != null) pv[i] += d.valor; }
  for (const e of fin) { const i = B.index.get(B.keyOf(e.fecha)); if (i != null) vv[i] += e.ingreso; }
  const ch = chartSlot({ type: 'line', labels: B.keys, fmtX: B.label, tipX: B.tipLabel, fmtY: v => cop(v, true), fmtTip: v => cop(v), aria: 'Pauta y ventas a clientes finales',
    series: [{ label: 'Ventas a clientes finales', color: 'var(--s3)', values: vv }, { label: 'Pauta', color: 'var(--s2)', values: pv, area: true }] }, 220);
  const leg = `<div class="legend"><span><i style="background:var(--s3)"></i>Ventas a clientes finales</span><span><i style="background:var(--s2)"></i>Pauta</span></div>`;

  // Mes a mes
  const primero = (primerDia(cs) || hoy).slice(0, 7);
  const meses = [];
  for (let m = mes; m >= primero && meses.length < 12; m = addDays(m + '-01', -1).slice(0, 7)) meses.push(m);
  const filas = meses.map(m => {
    const dias = sum(cs, c => diasActivosMes(c, m, hoy));
    const presu = sum(cs, c => n(c.presupuestoDiario) * diasActivosMes(c, m, hoy));
    const reales = cs.filter(c => tieneReal(c, m));

    const ef = M.entries.filter(e => e.canal === 'final' && (e.fecha || '').slice(0, 7) === m);
    return { m, dias, presu, real: reales.length ? sum(reales, c => c.reales[m]) : null, usado, ped: ef.length, ventas: sum(ef, e => e.ingreso) };
  });
  const tm = table([
    { h: 'Mes', f: x => `<b>${MESES[+x.m.slice(5, 7) - 1]} ${x.m.slice(0, 4)}</b>` },
    { h: 'Días activos', r: 1, f: x => num(x.dias, 0) },
    { h: 'Por presupuesto', r: 1, f: x => cop(x.presu) },
    { h: 'Cobro real de Meta', r: 1, f: x => x.real == null ? '<span class="muted">Sin registrar</span>' : cop(x.real) },
    { h: 'Gasto contado', r: 1, f: x => `<b>${cop(x.usado)}</b>` },

/* ---- Nómina: se gana con cada despacho (rastras × tarifa) y se paga los sábados ---- */
const sabadoDe = s => addDays(s, 6 - toD(s).getUTCDay());
const OFICIOS = [['aserrada', 'Aserrada'], ['arriada', 'Arriada']];
