async function llenarConFoto(file) {
  if (!S.form || !S.sample) return;
  const kind = S.form.kind, form = $('#form'), st = $('#foto-status', form);
  if (st) { st.hidden = false; st.textContent = 'Claude está leyendo la foto…'; }
  const ctl = new AbortController(); S.aiCtl = ctl;
  try {
    const out = await S.sample.json(aiPrompt('', true, kind), { signal: ctl.signal, cache: false, images: [file] });
    const reg = aiNormalize(out).find(r => r.kind === kind);
    if (!reg) { if (st) st.textContent = `No encontré piezas en esa foto.${out && out.nota ? ' ' + out.nota : ''}`; return; }
    const pre = reg.prefill;
    // Lo que ya elegiste se queda si la foto no lo dice.
    const cli = val(form, 'f-cliente') || val(form, 'f-clifinal');
    if (!pre.clienteId && cli) pre.clienteId = cli;
    for (const [k, id] of [['remision', 'f-remision'], ['estado', 'f-estado']]) if (!pre[k] && val(form, id)) pre[k] = val(form, id);
    if (kind === 'venta-final' && !pre.cliente?.nombre && val(form, 'f-nombre')) pre.cliente = { nombre: val(form, 'f-nombre'), celular: val(form, 'f-celular'), municipio: val(form, 'f-municipio'), direccion: val(form, 'f-direccion') };
    S.aiCtl = null;
    const ai = { i: 1, n: 1, nota: out && typeof out.nota === 'string' ? out.nota : '' };
    if (S.form.isNew) openForm(kind, null, pre, ai); else openForm(kind, { ...S.form.rec, ...pre }, null, ai);
  } catch (e) {
    if (st) st.textContent = e && e.code === 'cancelled' ? '' : aiErr(e);
  } finally { if (S.aiCtl === ctl) S.aiCtl = null; }
}

function pautaSwitch(id) {
  const hoy = todayStr();
  return guardarCampanas(campanas(S.config).map(c => {
    if (c.id !== id) return c;
    const { inicio, fin, ...resto } = c;
    let ps = periodosDe(c).map(p => ({ ...p }));
    const abierto = ps.find(p => enPeriodo(p, hoy));
    if (abierto) { abierto.hasta = addDays(hoy, -1); ps = ps.filter(p => p.hasta >= p.desde); }
    else {
      const ayer = ps.find(p => p.hasta === addDays(hoy, -1));
      if (ayer) ayer.hasta = ''; else ps.push({ desde: hoy, hasta: '' });
    }
    return { ...resto, periodos: ps.sort((a, b) => a.desde.localeCompare(b.desde)) };
  }));
}

/* ---- Fotos: comprobantes y remisiones que se guardan con el registro ---- */
// En Claude quedan como archivos del tablero (se ven en /_blob/<id>); en la versión Google, en carpetas de tu Drive.
const driveId = r => r.fotoId || (String(r.fotoUrl || '').match(/\/d\/([\w-]+)/) || [])[1] || '';
const tieneFoto = r => !!(r && (r.foto || r.fotoUrl || r.fotoId));
const puedeGuardarFoto = () => (S.mode === 'db' && !!S.assets) || S.mode === 'gas';
// Achica la foto (máx. 1600 px, JPEG) para que suba rápido. Si el navegador no la puede abrir, va la original.
async function achicarFoto(file) {
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    return b && b.size < file.size ? b : file;
  } catch { return file; }
}
const blobB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(b); });
async function guardarFoto(file, nombre, carpeta = 'comprobantes') {
  const b = await achicarFoto(file);
  if (S.mode === 'db' && S.assets) {
    const tipo = /^image\/(jpeg|png|webp|gif)$/.test(b.type) ? undefined : { type: 'image/jpeg' };
    const r = await S.assets.upload(b, tipo);
    return { foto: r.id };
  }
  if (S.mode === 'gas') {
    const url = await gasCall('guardarImagen', nombre, await blobB64(b), b.type || 'image/jpeg', carpeta);
    return { fotoUrl: url, fotoId: driveId({ fotoUrl: url }) };
  }
  return {};
}
// En Google la foto se pide al servidor una vez y queda en memoria.
const FOTOS = new Map();
function srcFoto(r) {
  if (r.foto) return Promise.resolve('/_blob/' + r.foto);
  const id = driveId(r);
  if (!id || S.mode !== 'gas') return Promise.resolve('');
  if (!FOTOS.has(id)) FOTOS.set(id, gasCall('leerImagen', id).catch(() => { FOTOS.delete(id); return ''; }));
  return FOTOS.get(id);
}
// Miniatura que abre la foto en grande dentro del tablero.
function fotoThumb(r, alt = 'Foto') {
  if (!tieneFoto(r)) return '';
  if (r.foto) return `<button type="button" class="thumb" data-act="ver-foto" data-src="/_blob/${esc(r.foto)}" aria-label="Ver ${esc(alt)}"><img src="/_blob/${esc(r.foto)}" alt="${esc(alt)}" loading="lazy"></button>`;
  const id = driveId(r);
  return id ? `<button type="button" class="thumb" data-act="ver-foto" data-drive="${esc(id)}" aria-label="Ver ${esc(alt)}"><img data-drive-img="${esc(id)}" alt="${esc(alt)}"><span>${icon('spark')}</span></button>` : '';
}
// Después de pintar: carga las miniaturas que vienen de Drive.
function cargarMiniaturas() {
  for (const img of $$('img[data-drive-img]')) {
    if (img.src) continue;
    srcFoto({ fotoId: img.dataset.driveImg }).then(src => { if (src && img.isConnected) { img.src = src; img.parentElement.classList.add('ok'); } });
  }
}
async function verFoto(t) {
  const lb = $('#lightbox');
  lb.hidden = false; lb.querySelector('img').removeAttribute('src');
  lb.querySelector('.lb-st').textContent = 'Cargando la foto…';
  const src = t.dataset.src || await srcFoto({ fotoId: t.dataset.drive });
  if (lb.hidden) return;
  if (!src) { lb.querySelector('.lb-st').textContent = 'No se pudo cargar la foto.'; return; }
  lb.querySelector('img').src = src; lb.querySelector('.lb-st').textContent = '';
}
const cerrarFoto = () => { const lb = $('#lightbox'); lb.hidden = true; lb.querySelector('img').removeAttribute('src'); };
const fotoField = (r, label = 'Foto del comprobante') => fld('f-foto', label, `${tieneFoto(r) ? `<div class="thumb-row">${fotoThumb(r, 'foto guardada')}<span class="muted">Foto guardada. Sube otra para cambiarla.</span></div>` : ''}<input id="f-foto" name="f-foto" type="file" accept="image/*">`,
  { full: true, hint: [puedeGuardarFoto() ? 'Se guarda con el registro.' : 'En este modo la foto no se guarda.', S.sample && S.sampleImg ? 'Claude la lee y llena el valor y la fecha.' : ''].filter(Boolean).join(' ') });

// Claude lee un comprobante de pago y devuelve valor, fecha, medio y referencia.
async function leerComprobante(file, form) {
  if (!S.sample || !S.sampleImg) return;
  const st = $('#foto-status', form);
  if (st) { st.hidden = false; st.textContent = 'Claude está leyendo el comprobante…'; }
  const ctl = new AbortController(); S.aiCtl = ctl;
  try {
    const out = await S.sample.json([
      `Lee este comprobante de pago (transferencia, consignación o recibo) de un cliente de Agrohermanos, en Colombia. Hoy es ${todayStr()}.`,
      `Responde solo JSON: {"valor": número en pesos sin puntos (el valor enviado, sin el 4x1000), "fecha": "AAAA-MM-DD", "medio": uno de ${JSON.stringify(MEDIOS)}, "referencia": "banco y número de comprobante", "de": "quién envía", "para": "quién recibe", "nota": "lo que no se entienda"}.`,
      'No inventes nada: deja vacío lo que no se lea.',
    ].join('\n'), { signal: ctl.signal, cache: false, images: [file] });
    if (!out || typeof out !== 'object') return;
    const set = (id, v) => { const el = $('#' + id, form); if (el && v && !el.value.trim()) el.value = v; };
    if (moneyLoose(out.valor)) { const el = $('#f-valor', form); if (el) el.value = moneyIn(moneyLoose(out.valor)); }
    if (isDate(out.fecha)) { const el = $('#f-fecha', form); if (el) el.value = out.fecha; }
    if (MEDIOS.includes(out.medio)) { const el = $('#f-medio', form); if (el) el.value = out.medio; }
    set('f-nota', [out.referencia, out.de ? `de ${out.de}` : '', out.para ? `a ${out.para}` : ''].filter(Boolean).join(' · '));
    if (st) st.textContent = 'Listo: revisa el valor y la fecha antes de guardar.' + (out.nota ? ' ' + out.nota : '');
    recalcForm();
  } catch (e) {
    if (st) st.textContent = e && e.code === 'cancelled' ? '' : aiErr(e);
  } finally { if (S.aiCtl === ctl) S.aiCtl = null; }
}

/* =========================================================================
   Remisiones: cada cargue que sale. Foto → despiece → para quién → precios → guardar.
   Guarda la remisión y crea (o entrega) los pedidos y despachos de cada destino; la nómina sale de ahí.
   ========================================================================= */
const DEST_TIPOS = [['', 'Elige…'], ['bb', 'Barro Blanco (despacho al punto)'], ['mayorista', 'Un mayorista'], ['final', 'Un cliente final'], ['pedido', 'Un pedido que estaba por entregar']];
const REM_PASOS = ['Fotos', 'Despiece', 'Para quién', 'Confirmar'];
const nomLinea = l => l.unidad === 'rastra' ? `Rastras de ${num(l.largo)} m` : `${l.medida} × ${num(l.largo)} m`;
const remPedidos = () => model().porEntregar;
function destNombre(d, M = model()) {
  if (d.tipo === 'bb') return M.cfg.punto;
  if (d.tipo === 'mayorista') return M.cli.get(d.clienteId)?.nombre || 'Mayorista';
  if (d.tipo === 'final') return d.clienteId === '__nuevo' ? (d.nuevo?.nombre || 'Cliente nuevo') : (M.cli.get(d.clienteId)?.nombre || 'Cliente final');
  if (d.tipo === 'pedido') { const p = M.porEntregar.find(x => x.id === d.pedidoId); return p ? p.cliente : 'Pedido'; }
  return 'Sin elegir';
}
// Con qué precios queda cada destino, dicho en palabras para el paso “Para quién”.
function destPrecioInfo(d, M = model()) {
  if (d.tipo === 'bb') return `Va sin precio: queda en el inventario de ${M.cfg.punto} con un valor estimado a precio de venta al cliente final. El precio se pone cuando ${M.cfg.socio} venda.`;
  if (d.tipo === 'mayorista') { if (!d.clienteId) return ''; const L = M.listas.get(M.cli.get(d.clienteId)?.listaId); return L ? `Precios de la lista “${L.nombre}”. En el último paso los ves y los puedes cambiar.` : 'No tiene lista de precios: los escribes en el último paso.'; }
  if (d.tipo === 'final') { if (!d.clienteId) return ''; const L = M.listas.get(M.cfg.listaFinal); return L ? `Precios de la lista “${L.nombre}”. En el último paso los puedes cambiar.` : 'Los precios los escribes en el último paso.'; }
  if (d.tipo === 'pedido') return d.pedidoId ? 'Con los precios del pedido: se marca como entregado.' : '';
  return '';
}
// Cuánto vale lo que se le asigna a un destino: a precio de su lista, estimado para Barro Blanco, o el total del pedido.
function destValor(d, cants, W, M = model()) {
  if (!d.tipo) return null;
  if (d.tipo === 'pedido') { const p = M.porEntregar.find(x => x.id === d.pedidoId); return p ? { valor: p.calc.total } : null; }
  const items = W.items.map((l, j) => ({ ...l, cant: n(cants[j]) })).filter(l => l.cant > 0);
  if (d.tipo === 'bb') return { valor: estimadoBB(items), estimado: true };
  let valor = 0, falta = 0;
  for (const l of items) { const pr = destPrecio(d, l, M); if (pr) valor += l.cant * pr; else falta += l.cant; }
  return { valor, falta };
}
// Precio sugerido de una pieza según a dónde va: la lista del mayorista o la de clientes finales. Barro Blanco va sin precio.
function destPrecio(d, l, M = model()) {
  if (d.tipo === 'mayorista') return listaPrecio(M.listas.get(M.cli.get(d.clienteId)?.listaId), l.medida, l.largo) || 0;
  if (d.tipo === 'final') return listaPrecio(M.listas.get(M.cfg.listaFinal), l.medida, l.largo) || 0;
  return 0;
}
const remRastras = items => sum(items, l => n(l.cant) * n(l.rastras));
const remNomina = ras => model().trab.map(t => [t.nombre, ras * tarifaTrab(t, { mo: moSnap() })]);
// Al dividir, el destino 1 se queda con lo que no se le asignó a los demás.
function remResto(W) {
  if (W.modo !== 'varios' || !Array.isArray(W.asig) || !W.asig[0]) return;
  W.items.forEach((l, j) => { W.asig[0][j] = n(l.cant) - sum(W.asig.slice(1), a => n(a[j])); });
}
function remAsigInit(W) {
  const ok = Array.isArray(W.asig) && W.asig.length === W.destinos.length && W.asig.every(a => a.length === W.items.length);
  if (!ok) W.asig = W.destinos.map((d, i) => W.items.map(l => i === 0 ? n(l.cant) : 0));
  if (W.modo === 'uno') W.asig = [W.items.map(l => n(l.cant))];
  remResto(W);
}
const remStepper = W => `<ol class="stepper">${REM_PASOS.map((p, i) => `<li class="${i + 1 === W.step ? 'on' : i + 1 < W.step ? 'done' : ''}"><b>${i + 1 < W.step ? icon('check') : i + 1}</b><span>${p}</span></li>`).join('')}</ol>`;
// Fotos de la remisión que se está cargando: se pueden subir varias (una por hoja o por parte).
const REM_MAX_FOTOS = 10;
const remFotos = () => S.remFotos || (S.remFotos = []);
function remFotosLimpiar() { for (const f of remFotos()) URL.revokeObjectURL(f.url); S.remFotos = []; }
function remAgregarFotos(files) {
  const F = remFotos(), nuevas = [...files].filter(f => /^image\//.test(f.type) || !f.type);
  for (const file of nuevas.slice(0, Math.max(0, REM_MAX_FOTOS - F.length))) F.push({ file, url: URL.createObjectURL(file) });
}
const remFotoBtn = (f, i, cls = 'thumb big') => `<button type="button" class="${cls}" data-act="ver-foto" data-src="${esc(f.url)}" aria-label="Ver la foto ${i + 1}"><img src="${esc(f.url)}" alt="Foto ${i + 1} de la remisión"></button>`;
const remFotoPrev = () => { const F = remFotos(); return !F.length ? '' : F.length === 1 ? remFotoBtn(F[0], 0) : `<div class="fotos mini">${F.map((f, i) => remFotoBtn(f, i, 'thumb')).join('')}</div>`; };
// Fotos guardadas de una remisión: la lista nueva o la foto sola de antes.
const fotosDe = r => Array.isArray(r.fotos) && r.fotos.length ? r.fotos : tieneFoto(r) ? [r] : [];

// Lee lo que está en pantalla antes de cambiar de paso o repintar.
function remRead(form, W) {
  if ($('#f-fecha', form)) W.fecha = val(form, 'f-fecha');
  if ($('#f-remision', form)) W.numero = val(form, 'f-remision');
  if (W.step === 2) W.items = $$('[data-line]', form).map(row => readRow(row, 'dmg')).filter(l => l.medida || l.cant).map(({ ok, ...l }) => l);
  if (W.step === 3) {
    for (const el of $$('[data-dest]', form)) {
      const i = +el.dataset.dest, d = W.destinos[i]; if (!d) continue;
      const g = k => el.querySelector(`[data-rk="${k}"]`)?.value ?? undefined;
      if (g('tipo') !== undefined) d.tipo = g('tipo');
      if (g('cliente') !== undefined) d.clienteId = g('cliente');
      if (g('pedido') !== undefined) d.pedidoId = g('pedido');
      if (el.querySelector('[data-rk="nombre"]')) d.nuevo = { nombre: g('nombre').trim(), celular: g('celular').trim(), municipio: g('municipio').trim(), direccion: g('direccion').trim() };
    }
    for (const inp of $$('[data-asig]', form)) { const [i, j] = inp.dataset.asig.split(':').map(Number); if (W.asig[i]) W.asig[i][j] = parseQty(inp.value); }
    remResto(W);
  }
  if (W.step === 4) for (const inp of $$('[data-precio]', form)) { const [i, j] = inp.dataset.precio.split(':').map(Number); W.destinos[i].precios = { ...(W.destinos[i].precios || {}), [j]: parseMoney(inp.value) }; }
}
// Repinta el paso. Al cambiar de paso vuelve arriba; dentro del mismo paso (elegir destino, agregar o quitar) se queda donde estaba.
function remPaint(quedarse = false) {
  const F = FORMS.remision, W = S.form.rec, form = $('#form'), pb = form.querySelector('.panel-b'), y = pb.scrollTop;
  pb.innerHTML = `<div class="form-err" id="form-err" hidden></div>${F.body(W)}`;
  $('#f-submit', form).textContent = F.cta(W);
  const back = $('[data-act="rem-back"]', form); if (back) back.hidden = W.step <= 1;
  recalcForm(); cargarMiniaturas();
  pb.scrollTop = quedarse ? y : 0;
}
function remIr(step) { const W = S.form.rec; W.step = step; remPaint(); }

const remPrompt = (nFotos = 1, parte = false) => [
  nFotos > 1
    ? `Lee estas ${nFotos} fotos de una remisión de cargue de madera de Agrohermanos (Antioquia, Colombia): lo que se subió al camión. Son hojas o partes de la misma remisión${parte ? ' (y hay más fotos que se leen aparte)' : ''}: junta el despiece de todas en una sola lista. Si la misma hoja sale en dos fotos, cuéntala una sola vez.`
    : `Lee la foto de una remisión de cargue de madera de Agrohermanos (Antioquia, Colombia): lo que se subió al camión.${parte ? ' Es parte de una remisión con más fotos que se leen aparte.' : ''}`,
  `Hoy es ${todayStr()}. Escribe las fechas como AAAA-MM-DD.`,
  'Medidas en pulgadas "ancho x grueso" (ej. "4x6"). Largo en metros (ej. 3 o 4.5; "6,50", "6.5" y "650" son 6.5 m). Cantidad en piezas.',
  'Si la remisión dice para quién va (un cliente, Barro Blanco, Fermín, San Nicolás…), ponlo en "destino". Si hay partes para clientes distintos, explícalo en "nota".',
  'Responde solo JSON: {"fecha":"","numero":"","destino":"","items":[{"medida":"4x6","largo":3,"cant":10}],"nota":""}',
  'No inventes nada: deja vacío lo que no se lea.',
].join('\n');
async function remLeerFotos() {
  const W = S.form.rec, st = $('#foto-status'), b = $('#f-submit');
  const files = remFotos().map(f => f.file), max = Math.max(1, n(S.sampleImg.maxCount) || files.length);
  if (st) { st.hidden = false; st.textContent = files.length > 1 ? `Claude está leyendo las ${files.length} fotos y sacando el despiece…` : 'Claude está leyendo la remisión y sacando el despiece…'; }
  if (b) b.disabled = true;
  const ctl = new AbortController(); S.aiCtl = ctl;
  try {
    const items = [], notas = [];
    let fecha = '', numero = '';
    for (let i = 0; i < files.length; i += max) {
      const lote = files.slice(i, i + max);
      const out = await S.sample.json(remPrompt(lote.length, files.length > max), { signal: ctl.signal, cache: false, images: lote });
      items.push(...aiItems(out && out.items, false).map(l => { const info = piezaInfo(l.medida, l.largo); return info ? { unidad: 'pieza', medida: info.label, largo: l.largo, cant: l.cant, rastras: +info.rastras.toFixed(6), costo: Math.round(info.costo) } : { medida: l.medida, largo: l.largo, cant: l.cant }; }));
      if (!fecha && isDate(out && out.fecha)) fecha = out.fecha;
      if (!numero && out && out.numero) numero = String(out.numero);
      if (out && out.destino) notas.push(`Dice que va para: ${out.destino}.`);
      if (out && out.nota) notas.push(out.nota);
    }
    if (fecha) W.fecha = fecha;
    if (numero) W.numero = numero;
    W.items = items.length ? items : [{}];
    W.notaIA = [...new Set(notas)].join(' ');
    S.aiCtl = null;
    remIr(2);
  } catch (e) {
    if (st) st.textContent = e && e.code === 'cancelled' ? '' : `${aiErr(e)} Puedes llenarla a mano.`;
  } finally {
    if (S.aiCtl === ctl) S.aiCtl = null;
    if (b) b.disabled = false;
  }
}

function remBody(W) {
  const M = model();
  if (W.step === 1) {
    const F = remFotos(), ia = S.sample && S.sampleImg;
    const fotos = F.length
      ? `<div class="fotos">${F.map((f, i) => `<div class="ft">${remFotoBtn(f, i)}<button type="button" class="x" data-act="rem-quitar-foto" data-i="${i}" aria-label="Quitar la foto ${i + 1}">${icon('x')}</button></div>`).join('')}${F.length < REM_MAX_FOTOS ? `<label class="add" for="f-rem-foto">${icon('plus')}<span>Agregar otra foto</span></label>` : ''}</div>
        <p class="muted" style="font-size:12.5px;margin:0">${F.length === 1 ? '1 foto' : `${F.length} fotos`}. ${ia ? 'Cuando estén todas, toca “Leer con Claude”: saca el despiece de todas juntas.' : 'Se guardan con la remisión y llenas el despiece a mano.'}</p>`
      : `<label class="drop" for="f-rem-foto">${icon('up')}<b>Sube las fotos de la remisión</b><span>Una o varias: si tiene varias hojas, súbelas todas. ${ia ? 'Claude saca el despiece de todas juntas: medidas, largos y cantidades.' : 'Se guardan con la remisión y llenas el despiece a mano.'}</span></label>`;
    return `${remStepper(W)}${fotos}
    <input id="f-rem-foto" type="file" accept="image/*" multiple class="sr-only">
    <div class="note" id="foto-status" hidden></div>
    <div class="form-grid">${fld('f-fecha', 'Fecha del cargue', dateF('f-fecha', W.fecha))}${fld('f-remision', 'N.º de remisión', inp('f-remision', W.numero, { ph: 'Opcional' }))}</div>
    <div>${btn(F.length ? 'Llenar el despiece a mano' : 'Llenarla a mano, sin foto', 'data-act="rem-manual"', 'ghost sm')}</div>`;
  }
  if (W.step === 2) {
    return `${remStepper(W)}
      <div class="rem-top">${remFotoPrev()}<div class="form-grid" style="flex:1">${fld('f-fecha', 'Fecha del cargue', dateF('f-fecha', W.fecha))}${fld('f-remision', 'N.º de remisión', inp('f-remision', W.numero, { ph: 'Opcional' }))}</div></div>
      ${W.notaIA ? `<div class="note"><b>Claude:</b> ${esc(W.notaIA)}</div>` : ''}
      ${linesBlock('dmg', W.items.length ? W.items : [{}], 'Despiece: revisa y corrige')}
      <div id="live"></div>${datalistMedidas(M)}`;
  }
  if (W.step === 3) {
    remAsigInit(W);
    const ras = remRastras(W.items);
    const choice = (m, t, sub) => `<button type="button" class="choice" data-act="rem-modo" data-m="${m}" aria-pressed="${W.modo === m}"><b>${t}</b><span>${sub}</span></button>`;
    let h = `${remStepper(W)}<div class="note">${num(sum(W.items, l => l.cant), 0)} piezas · ${num(ras)} rastras${W.numero ? ` · remisión ${esc(W.numero)}` : ''}.</div>
      <h4 class="q">¿Para quién es esta remisión?</h4>
      <div class="choices">${choice('uno', 'Todo para un solo destino', 'Un cliente, Barro Blanco o un pedido')}${choice('varios', 'Dividir entre varios', 'Parte para uno, parte para otro')}</div>`;
    if (!W.modo) return h;
    const fins = M.finales.map(c => [c.id, c.nombre]), mays = M.mayoristas.map(c => [c.id, c.nombre]);
    const peds = M.porEntregar.map(p => [p.id, `${p.canal === 'final' ? 'Cliente final' : p.canal === 'bb' ? 'Sociedad' : 'Mayorista'} · ${p.cliente} · ${num(p.calc.piezas, 0)} pzs · ${fmtDay(p.fecha)}`]);
    h += W.destinos.map((d, i) => `<div class="dest" data-dest="${i}">
      <div class="dest-h"><span class="dest-n">${W.modo === 'varios' ? `Destino ${i + 1}` : 'Destino'}</span>${W.modo === 'varios' && W.destinos.length > 1 ? `<button type="button" class="icon-btn" data-act="rem-rm-dest" data-i="${i}" aria-label="Quitar destino">${icon('x')}</button>` : ''}</div>
      <div class="form-grid">
        <div class="field full"><label>Va para</label><select data-rk="tipo">${DEST_TIPOS.map(([v, l]) => `<option value="${v}"${d.tipo === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
        ${d.tipo === 'mayorista' ? `<div class="field full"><label>Mayorista</label><select data-rk="cliente">${[['', 'Elige…'], ...mays].map(([v, l]) => `<option value="${esc(v)}"${d.clienteId === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>` : ''}
        ${d.tipo === 'final' ? `<div class="field full"><label>Cliente final</label><select data-rk="cliente">${[['', 'Elige…'], ...fins, ['__nuevo', '+ Cliente nuevo']].map(([v, l]) => `<option value="${esc(v)}"${d.clienteId === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
          ${d.clienteId === '__nuevo' ? `<div class="field"><label>Nombre</label><input data-rk="nombre" value="${esc(d.nuevo?.nombre || '')}" placeholder="Nombre y apellido"></div><div class="field"><label>Celular</label><input data-rk="celular" inputmode="tel" value="${esc(d.nuevo?.celular || '')}" placeholder="300 000 0000"></div><div class="field"><label>Municipio</label><input data-rk="municipio" value="${esc(d.nuevo?.municipio || '')}" placeholder="Guarne, Rionegro…"></div><div class="field"><label>Dirección de entrega</label><input data-rk="direccion" value="${esc(d.nuevo?.direccion || '')}" placeholder="Vereda, finca, obra"></div>` : ''}` : ''}
        ${d.tipo === 'pedido' ? `<div class="field full"><label>Pedido por entregar</label>${peds.length ? `<select data-rk="pedido">${[['', 'Elige…'], ...peds].map(([v, l]) => `<option value="${esc(v)}"${d.pedidoId === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select><span class="hint">Se marca como entregado con la fecha de esta remisión.</span>` : '<span class="hint">No hay pedidos por entregar.</span>'}</div>` : ''}
      </div>${destPrecioInfo(d, M) ? `<div class="dest-precio">${esc(destPrecioInfo(d, M))}</div>` : ''}</div>`).join('');
    if (W.modo === 'varios') {
      h += `<div>${btn(`${icon('plus')}Agregar destino`, 'data-act="rem-add-dest"', 'sm')}</div>
        <div class="form-sec"><h4>¿Cuántas piezas van para cada uno?</h4></div>
        <div class="note">Escribe en la columna de cada destino cuántas piezas de cada medida le van. Lo que no le pongas a nadie se queda en <b>${esc(destNombre(W.destinos[0], M))}</b> (destino 1): esa columna se llena sola.</div>
        <div class="tbl-wrap"><table class="tbl asig"><thead><tr><th>Pieza</th><th class="r">Total</th>${W.destinos.map((d, i) => `<th class="r nt">${esc(destNombre(d, M))}${i === 0 ? '<span class="sub">lo que queda</span>' : ''}</th>`).join('')}</tr></thead><tbody>
        ${W.items.map((l, j) => `<tr><td>${esc(nomLinea(l))}</td><td class="r">${num(l.cant, 0)}</td>${W.destinos.map((d, i) => i === 0
          ? `<td class="r"><span class="asig-auto" data-auto0="${j}">${num(W.asig[0][j], 0)}</span></td>`
          : `<td class="r"><input class="qty" inputmode="decimal" data-asig="${i}:${j}" value="${esc(qtyIn(W.asig[i][j]))}" placeholder="0" aria-label="${esc(nomLinea(l))} para ${esc(destNombre(d, M))}"></td>`).join('')}</tr>`).join('')}
        </tbody><tfoot>
          <tr><td>Piezas</td><td class="r">${num(sum(W.items, l => l.cant), 0)}</td>${W.destinos.map((d, i) => `<td class="r" data-tp="${i}"></td>`).join('')}</tr>
          <tr><td>Valor</td><td></td>${W.destinos.map((d, i) => `<td class="r" data-tv="${i}"></td>`).join('')}</tr>
        </tfoot></table></div>`;
    }
    return h + '<div id="live"></div>';
  }
  // Paso 4: precios y confirmar
  let h = `${remStepper(W)}<div class="rem-top">${remFotoPrev()}<div><b>${W.numero ? `Remisión ${esc(W.numero)}` : 'Remisión sin número'}</b><span class="muted" style="display:block;font-size:12.5px">${fmtDate(W.fecha)} · ${num(sum(W.items, l => l.cant), 0)} piezas · ${num(remRastras(W.items))} rastras</span></div></div>
    ${W.destinos.some(d => d.tipo === 'mayorista' || d.tipo === 'final') ? '<div class="note">Revisa el precio de cada pieza: sale de la lista de cada cliente. Si se vendió a otro precio, cámbialo aquí.</div>' : ''}`;
  h += W.destinos.map((d, i) => {
    const lines = W.items.map((l, j) => ({ l, j, cant: n(W.asig[i][j]) })).filter(x => x.cant > 0);
    if (d.tipo === 'pedido') {
      const p = M.porEntregar.find(x => x.id === d.pedidoId);
      const pz = sum(lines, x => x.cant);
      return `<div class="dest"><div class="dest-h"><span class="dest-n">${esc(destNombre(d, M))}</span>${chip('wood', 'Pedido por entregar')}</div>
        <div class="ledger"><div><span>Pedido</span><b>${p ? `${num(p.calc.piezas, 0)} pzs · ${cop(p.calc.total)}` : '—'}</b></div><div><span>En esta remisión</span><b>${num(pz, 0)} pzs</b></div></div>
        ${p && Math.abs(pz - p.calc.piezas) > 0.5 ? `<div class="note">La remisión trae ${num(pz, 0)} piezas para este pedido y el pedido tiene ${num(p.calc.piezas, 0)}. Se marca entregado con lo del pedido; si cambió algo, edítalo después.</div>` : ''}</div>`;
    }
    if (d.tipo === 'bb') {
      const est = sum(lines, ({ l, cant }) => cant * (l.unidad === 'rastra' ? 0 : pvFor(l.medida, l.largo)));
      return `<div class="dest"><div class="dest-h"><span class="dest-n">${esc(destNombre(d, M))}</span>${chip('wood', 'Barro Blanco')}</div>
        <div class="note">Va sin precio: queda en el inventario del punto. El estimado es a precio de venta al cliente final; el precio real se pone cuando ${esc(M.cfg.socio)} venda.</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">Precio venta</th><th class="r">Estimado</th></tr></thead><tbody>
        ${lines.map(({ l, cant }) => { const pv = l.unidad === 'rastra' ? 0 : pvFor(l.medida, l.largo); return `<tr><td>${esc(nomLinea(l))}</td><td class="r">${num(cant, 0)}</td><td class="r">${pv ? cop(pv) : '<span class="muted">Sin precio</span>'}</td><td class="r">${pv ? cop(cant * pv) : '—'}</td></tr>`; }).join('')}
        </tbody><tfoot><tr><td>Total estimado</td><td class="r">${num(sum(lines, x => x.cant), 0)}</td><td></td><td class="r">${cop(est)}</td></tr></tfoot></table></div></div>`;
    }
    const lab = 'Precio c/u';

async function remGuardar(W) {
  const M = model(), mo = moSnap(), remisionId = 'rem-' + uid();
  const extra = { remisionId, remision: W.numero || '', fecha: W.fecha, mo };
  const destinos = [];
  for (const [i, d] of W.destinos.entries()) {
    // Lo que va a Barro Blanco no lleva precio: se pone cuando se vende.
    const items = W.items.map(({ precio, ...l }, j) => ({ ...l, cant: n(W.asig[i][j]), ...(d.tipo === 'bb' ? {} : { precio: n(d.precios?.[j] ?? destPrecio(d, l, M)) }) })).filter(l => l.cant > 0);
    const r = { tipo: d.tipo, nombre: destNombre(d, M), piezas: sum(items.filter(l => l.unidad !== 'rastra'), l => l.cant), rastras: remRastras(items) };
    if (d.tipo === 'bb') {
      r.col = 'bbDespachos'; r.valor = estimadoBB(items); r.estimado = true;
      r.id = await Store.save('bbDespachos', { tipo: 'despacho', items, ...extra });
    } else if (d.tipo === 'mayorista') {
      r.col = 'ventas'; r.valor = sum(items, l => l.cant * l.precio);
      r.id = await Store.save('ventas', { canal: 'mayorista', estado: 'Entregado', clienteId: d.clienteId, items, flete: 0, costoFlete: 0, ...extra });
    } else if (d.tipo === 'final') {
      let cid = d.clienteId;
      if (cid === '__nuevo') { cid = await Store.save('clientes', { tipo: 'final', oficio: 'Persona', ...d.nuevo }); r.clienteNuevo = cid; }
      const c = cid === d.clienteId ? M.cli.get(cid) || {} : d.nuevo;
      r.col = 'ventas'; r.valor = sum(items, l => l.cant * l.precio);
      r.id = await Store.save('ventas', { canal: 'final', estado: 'Despachado', clienteId: cid, cliente: { nombre: c.nombre || '', celular: c.celular || '', municipio: c.municipio || '', direccion: c.direccion || '' }, items, pagos: [], flete: 0, costoFlete: 0, ...extra });
    } else if (d.tipo === 'pedido') {
      const p = M.porEntregar.find(x => x.id === d.pedidoId), col = p.col || 'ventas';
      const orig = D()[col].find(x => x.id === p.id);
      const estado = p.canal === 'bb' ? 'Entregada' : p.canal === 'final' ? 'Despachado' : 'Entregado';
      await Store.save(col, { ...orig, estado, remisionId, remision: W.numero || orig.remision || '', fecha: W.fecha, mo: orig.mo || mo, antes: { estado: orig.estado || '', fecha: orig.fecha || '', remision: orig.remision || '' } });
      Object.assign(r, { col, id: p.id, convertido: true, nombre: p.cliente, piezas: p.calc.piezas, rastras: p.calc.rastras, valor: p.calc.total });
    }
    destinos.push(r);
  }
  const rec = { fecha: W.fecha, numero: W.numero || '', items: W.items, destinos, piezas: sum(destinos, x => x.piezas), rastras: sum(destinos, x => x.rastras), valor: sum(destinos, x => x.valor), mo };
  const F = remFotos();
  if (F.length && puedeGuardarFoto()) {
    const fotos = [];
    for (const [i, f] of F.entries()) {
      try { const g = await guardarFoto(f.file, `remision-${W.numero || W.fecha}${F.length > 1 ? `-${i + 1}` : ''}.jpg`, 'remisiones'); if (tieneFoto(g)) fotos.push(g); } catch { /* sigue con las demás */ }
    }
    if (fotos.length) rec.fotos = fotos;
    if (fotos.length < F.length) toast(fotos.length ? `La remisión se guardó, pero ${F.length - fotos.length} de las ${F.length} fotos no se pudieron subir.` : 'La remisión se guardó, pero las fotos no se pudieron subir.');
  }
  await Store.save('remisiones', { ...rec, id: remisionId });
  remFotosLimpiar();
}

function parseGrid(txt) {
  const rows = String(txt || '').replace(/\r/g, '').split('\n').map(r => r.split('\t'));
  const hi = rows.findIndex(r => r.filter(c => parseMedida(c)).length >= 2);
  if (hi < 0) return { error: 'No encontré una fila con medidas (por ejemplo 2x4, 4x6). Copia la tabla desde Excel con la fila de medidas incluida.' };
  const header = rows[hi].map(c => parseMedida(c));
  const precios = {}; let celdas = 0; const largos = new Set();
  for (const r of rows.slice(hi + 1)) {
    const L = parseQty(r[0]);
    if (!L || L > 30) continue;
    r.forEach((c, j) => {
      if (!j || !header[j]) return;
      const v = Math.round(parseLoose(c));
      if (!(v > 0)) return;
      (precios[header[j].key] = precios[header[j].key] || {})[largoKey(L)] = v; celdas++; largos.add(L);
    });
  }
  if (!celdas) return { error: 'Encontré las medidas pero ningún precio. La primera columna debe tener los largos en metros.' };
  return { precios, celdas, medidas: Object.keys(precios).length, largos: largos.size };
}

async function submitForm(e) {

}

async function saveFile(filename, text) {
  if (S.mode === 'gas') {
    try { S.lastExport = { filename, url: await gasCall('guardarArchivo', filename, text) }; toast('Copia guardada en tu Drive'); render(); }
    catch { toast('No se pudo guardar la copia en tu Drive.'); }
    return;
  }
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Archivo listo'); }
    catch (e) { if (!e || e.code !== 'declined') toast('No se pudo preparar la descarga.'); }
    return;
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  } catch { toast('Este navegador no permitió la descarga.'); }
}
function exportJSON() {
  const payload = { app: 'tablero-agrohermanos', version: 1, exportado: new Date().toISOString(), config: S.config };

function exportCSV() {

let pendingImport = null;
function handleImportFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j || typeof j !== 'object' || !COLS.some(c => Array.isArray(j[c]))) throw new Error('formato');
      pendingImport = j;
      const total = sum(COLS, c => Array.isArray(j[c]) ? j[c].length : 0);
      $('#import-zone').innerHTML = `<div class="note" style="margin-bottom:10px">El archivo trae <b>${num(total, 0)}</b> registros${j.exportado ? ` (exportado el ${esc(fmtDate(String(j.exportado).slice(0, 10)))})` : ''}.</div>
        <div class="pills">${btn('Restaurar ahora', 'data-act="import-go"', 'primary')}${btn('Cancelar', 'data-act="import-cancel"', 'ghost')}</div>`;
    } catch { toast('Ese archivo no es una copia de este tablero.'); }
  };
  rd.readAsText(file);
}
async function runImport() {
  if (!pendingImport) return;
  if (S.demo) { toast('Sal del ejemplo para restaurar una copia.'); return; }
  const j = pendingImport; pendingImport = null;
  let done = 0;
  try {
    for (const c of COLS) for (const rec of (Array.isArray(j[c]) ? j[c] : [])) {
      if (!rec || typeof rec !== 'object') continue;
      await Store.save(c, { ...rec, id: rec.id || uid() }); done++;
      if (done % 20 === 0) toast(`Restaurando… ${done}`);
    }
    if (j.config && typeof j.config === 'object') await Store.saveConfig(j.config);
    toast(`Listo: ${done} registros restaurados`);
  } catch (e) { toast(`Se restauraron ${done} registros. ${errMsg(e)}`); }
  render();
}

function ts(v) { const t = Date.parse(v || ''); return isNaN(t) ? 0 : t; }
function cuando(v) {
  const t = ts(v); if (!t) return '';
  const m = (Date.now() - t) / 60000;
  if (m < 1 && m > -1) return 'ahora';
  if (m > 0 && m < 60) return `hace ${Math.round(m)} min`;
  if (m > 0 && m < 720) return `hace ${Math.round(m / 60)} h`;
  return fFecha.format(new Date(t)) + ' · ' + fHora.format(new Date(t));
}
function cuandoCorto(v) { const t = ts(v); return t ? fFecha.format(new Date(t)) + ' · ' + fHora.format(new Date(t)) : ''; }
/* Revisión diaria: lun–sáb 7:58 a. m. de Colombia = 12:58 UTC. */
function proximaDiaria(now = new Date()) {
  let d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 12, 58));
  if (d <= now) d = new Date(d.getTime() + 864e5);
  while (d.getUTCDay() === 0) d = new Date(d.getTime() + 864e5);
  return d;
}
function proximaTxt() { const d = proximaDiaria(); return fDia.format(d).replace('.', '') + ' · ' + fHora.format(d); }

/* ---------- estado visible de cada agente ---------- */
function ag(id) { return S.agentes[id] || null; }
function info(id) { const r = ROSTER.find(x => x.id === id) || { id, nombre: id, rol: '' }; const a = ag(id) || {}; return { ...r, ...a, nombre: a.nombre || r.nombre, rol: a.rol || r.rol }; }
function visOf(id) {
  const a = ag(id); if (!a) return 'formacion';
  const e = ESTADOS[a.estado] ? a.estado : 'espera';
  if (e === 'trabajando' && Date.now() - ts(a.actualizado) > 45 * 60e3) return 'senal';
  if (e === 'espera' && a.ultimo && Date.now() - ts(a.ultimo.fecha) < 3 * 3600e3) return 'listo';
  return e;
}
function stateLine(id) {
  const a = info(id), v = visOf(id);
  if (v === 'trabajando') return a.tarea || 'Trabajando';
  if (v === 'senal') return 'Se quedó sin señal en: ' + (a.tarea || 'su última tarea');
  if (v === 'formacion') return `Fase ${a.fase || '—'} · ${a.siguienteCorto || 'por crear'}`;
  if (v === 'listo') return 'Terminó ' + cuando(a.ultimo && a.ultimo.fecha);
  if (v === 'error') return a.tarea || 'Revisar la última corrida';
  return a.horario === 'diaria' ? 'Próxima: ' + proximaTxt() : (HORARIO[a.horario] || 'En espera');
}

/* ---------- base de datos ---------- */
async function conectar() {
  if (S.dbTried) return S.db; S.dbTried = true;
  try { S.db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch { S.db = null; }
  if (!S.db) { S.sinDatos = true; pintarHud(); return null; }
  S.db.collection('agentes').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = { ...d.data(), id: d.id }; });
    S.agentes = m; S.sinDatos = false; cambio();
  }, () => { S.sinDatos = true; pintarHud(); });
  return S.db;
}
function escucharBitacora() {
  if (!S.db || S.unLog) return;
  S.unLog = S.db.collection('agentesActividad').orderBy('ts', 'desc').limit(60).onSnapshot(snap => {
    const nuevos = [];
    const lista = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    if (S.logSeen) lista.forEach(e => { if (!S.logSeen.has(e.id)) nuevos.push(e); });
    S.logSeen = new Set(lista.map(e => e.id));
    S.log = lista; S.nuevos = new Set(nuevos.map(e => e.id));
    nuevos.forEach(e => Escena.destello(e.agente));
    Escena.muros();
    pintarFeed(); if (S.sel) pintarPanel();
  }, () => { /* sin bitácora: la oficina sigue con las fichas */ });
}
let ultimoConteo = -1;
function cambio() {
  ROSTER.forEach(r => { S.vis[r.id] = visOf(r.id); });
  Escena.aplicar();
  pintarHud();
  const n = ROSTER.filter(r => S.vis[r.id] === 'trabajando').length;
  if (n !== ultimoConteo) { ultimoConteo = n; try { window.dispatchEvent(new CustomEvent('ah-equipo')); } catch { /* nada */ } }
}

/* ---------- HUD ---------- */
function dot(v) { return `<i class="d st-${v}"></i>`; }
function pintarHud() {
  if (!S.open) return;
  pintarStats(); pintarRoster(); pintarFeed(); if (S.sel) pintarPanel();
}
function pintarStats() {
  const c = { op: 0, tr: 0, fo: 0 };
  ROSTER.forEach(r => { const v = S.vis[r.id] || visOf(r.id); if (v === 'formacion') c.fo++; else c.op++; if (v === 'trabajando') c.tr++; });
  $('#of-stats').innerHTML = S.sinDatos
    ? `<span class="of-chip" style="color:#F2B13D"><i></i>Sin conexión a la base de datos</span>`
    : `<span class="of-chip" style="color:#58C285"><i></i><b>${c.op}</b> operativos</span>`
    + `<span class="of-chip" style="color:#FF8A3D"><i></i><b>${c.tr}</b> trabajando</span>`
    + `<span class="of-chip" style="color:#8FA597"><i></i><b>${c.fo}</b> en formación</span>`;
  $('#of-prox').textContent = 'Revisión diaria: ' + proximaTxt();
}
function pintarRoster() {
  let h = '<h3 class="of-h">Tripulación · 11 agentes</h3>';
  for (const r of ROSTER) {
    const v = S.vis[r.id] || visOf(r.id);
    const al = DATOS.alarmas[r.id];
    h += `<button type="button" class="of-ag" data-of="sel" data-id="${r.id}" aria-pressed="${S.sel === r.id}">${dot(v)}<b>${esc(info(r.id).nombre)}</b><span${al ? ' class="al"' : ''}>${esc(al ? 'Alarma: ' + al.txt : stateLine(r.id))}</span></button>`;
  }
  $('#of-roster').innerHTML = h;
  for (const st of Escena.tags()) {
    const v = S.vis[st.id] || visOf(st.id);
    const al = DATOS.alarmas[st.id];
    st.el.innerHTML = `${dot(v)}${esc(info(st.id).nombre)}<small>${esc(ESTADOS[v].label)}</small>${al ? `<em class="of-al">${esc(al.txt)}</em>` : ''}`;
    st.el.classList.toggle('alarma', !!al);

}
function pintarFeed() {
  if (!S.open) return;
  const L = S.log.slice(0, 6);
  let h = '<h3 class="of-h">Bitácora en vivo</h3>';
  if (!L.length) h += `<p class="vacio">${S.sinDatos ? 'Sin conexión a la base de datos del tablero.' : 'Todavía no hay actividad. Aquí aparece cada paso de los agentes mientras trabajan.'}</p>`;
  else h += '<ol>' + L.map(e => `<li class="${S.nuevos && S.nuevos.has(e.id) ? 'nuevo' : ''}"><time class="of-mono">${esc(cuandoCorto(e.ts))}</time><span class="who" style="color:${(ESTADOS[tipoVis(e.tipo)] || ESTADOS.espera).css}">${esc(info(e.agente).nombre)}</span><span class="what">${esc(e.texto)}</span></li>`).join('') + '</ol>';
  $('#of-feed').innerHTML = h;
}
function tipoVis(t) { return t === 'inicio' || t === 'paso' ? 'trabajando' : t === 'error' ? 'error' : 'espera'; }

function pintarPanel() {

      <button type="button" class="of-p-x" data-of="cerrar-ficha" aria-label="Cerrar ficha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      <p>${esc(a.rol)}</p>
      <span class="of-pill pc-${v}"><i class="d st-${v}"></i>${esc(E.label)}${v === 'listo' ? ' · ' + esc(cuando(ult.fecha)) : ''}</span>

    <div class="of-two">
      <div class="of-box"><h4 class="of-h">Qué hizo</h4><p>${esc(ult.texto || 'Nada todavía.')}</p>${ult.fecha ? `<time class="of-mono">${esc(cuandoCorto(ult.fecha))}</time>` : ''}</div>

  $('#of-panel').setAttribute('aria-labelledby', 'of-p-t');
}

/* ---------- selección ---------- */
function seleccionar(id, desde) {
  S.sel = id || null;
  $('#of-panel').hidden = !S.sel;
  if (S.sel) pintarPanel();
  pintarRoster();
  Escena.enfocar(S.sel);
  if (S.sel && desde === 'teclado') { const b = $('#of-panel [data-of="cerrar-ficha"]'); if (b) b.focus(); }
}

/* ---------- abrir y cerrar ---------- */
let reloj = 0, refresco = 0;
async function abrir(opener) {
  if (S.open) return;
  S.open = true; S.opener = opener || document.activeElement;
  $('#of').hidden = false;
  document.documentElement.style.overflow = 'hidden';
  await conectar(); escucharBitacora();
  ROSTER.forEach(r => { S.vis[r.id] = visOf(r.id); });
  pintarHud();
  const tick = () => { try { $('#of-hora').textContent = fReloj.format(new Date()); } catch { /* nada */ } };
  tick(); reloj = setInterval(tick, 1000);
  refresco = setInterval(() => { if (S.open) cambio(); }, 30000);
  $('#of-x').focus();
  const sb = $('.of-acc [data-of="sonido"]'); if (sb) sb.setAttribute('aria-pressed', String(Sonido.on));
  if (Sonido.on) Sonido.c();
  Escena.iniciar().then(() => { leerDatos(); soltarCelebracion(); });
}
function cerrar() {
  if (!S.open) return;
  S.open = false; $('#of').hidden = true;
  document.documentElement.style.overflow = '';
  clearInterval(reloj); clearInterval(refresco);
  Escena.parar(); Escena.recorrido(false);
  if (S.unLog) { try { S.unLog(); } catch { /* nada */ } S.unLog = null; S.logSeen = null; }
  const o = S.opener; S.opener = null;
  try { if (o && o.isConnected) o.focus(); else { const b = document.querySelector('[data-v="equipo"]'); if (b) b.focus(); } } catch { /* nada */ }
}

document.addEventListener('click', e => {
  if (!S.open) return;
  const t = e.target.closest('[data-of]'); if (!t) return;
  const a = t.dataset.of;
  if (a === 'sel') seleccionar(S.sel === t.dataset.id && t.closest('#of-roster') ? null : t.dataset.id, e.detail === 0 ? 'teclado' : 'clic');
  else if (a === 'cerrar-ficha') seleccionar(null);
  else if (a === 'luz') { Escena.luz(t.dataset.v); document.querySelectorAll('[data-of="luz"]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); }
  else if (a === 'tour') { if (S.sel) seleccionar(null); $('#of-meta').hidden = true; const on = Escena.recorrido(); document.querySelectorAll('.of-acc [data-of="tour"]').forEach(b => b.setAttribute('aria-pressed', String(!!on))); }
  else if (a === 'metas') abrirMetas();
  else if (a === 'celebrar') { if (S.sel) seleccionar(null); Escena.celebrar({ monto: '¡Vamos, Agro Hermanos!', texto: 'Así se celebra cuando entra plata' }); }
  else if (a === 'sonido') { Sonido.set(!Sonido.on); t.setAttribute('aria-pressed', String(Sonido.on)); if (Sonido.on) Sonido.c(); }
  else if (a === 'ir') { const v = t.dataset.v; cerrar(); setTimeout(() => { const b = document.querySelector(`#nav [data-v="${v}"]`); if (b) b.click(); }, 60); }
  else if (a === 'copiar') {
    const el = $('#of-llamar'); const txt = el ? el.textContent : '';
    const ok = () => { t.textContent = 'Copiado'; setTimeout(() => { t.textContent = 'Copiar'; }, 1600); };
    const manual = () => { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Seleccionado: copia con Ctrl+C'; } catch { /* nada */ } };
    try { navigator.clipboard.writeText(txt).then(ok, manual); } catch { manual(); }
  }
});
$('#of-x').addEventListener('click', cerrar);
$('#of-meta').addEventListener('submit', guardarMetas);
document.addEventListener('keydown', e => {
  if (!S.open || e.key !== 'Escape') return;
  e.preventDefault(); e.stopPropagation();
  if (Escena.enTour()) { Escena.recorrido(false); return; }
  if (!$('#of-meta').hidden) { $('#of-meta').hidden = true; return; }
  if (S.sel) seleccionar(null); else cerrar();
}, true);
/* ---------- sonido: aplausos, pólvora y truenos (hechos aquí mismo, sin archivos) ---------- */
const Sonido = {
  ctx: null, on: true,
  init() { try { this.on = localStorage.getItem('ah.oficina.sonido') !== '0'; } catch { this.on = true; } },
  set(v) { this.on = v; try { localStorage.setItem('ah.oficina.sonido', v ? '1' : '0'); } catch { /* nada */ } if (!v && this.ctx) try { this.ctx.suspend(); } catch { /* nada */ } },
  c() {
    if (!this.on) return null;
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch { /* nada */ } }
    return this.ctx;
  },
  ruido(c, dur) { const b = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; },
  fuente(c, buf, filtro, frec, q) { const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = filtro; f.frequency.value = frec; if (q) f.Q.value = q; const g = c.createGain(); s.connect(f).connect(g).connect(c.destination); return { s, g }; },
  boom(k = 1) {

    const { s, g } = this.fuente(c, this.ruido(c, 1.8), 'lowpass', 520);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.7 * k, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6); s.start(t);
    for (let i = 0; i < 14; i++) {
      const tt = t + .25 + Math.random() * 1.1, n = this.fuente(c, this.ruido(c, .05), 'highpass', 2500);
      n.g.gain.setValueAtTime(.0001, tt); n.g.gain.exponentialRampToValueAtTime(.12 * k, tt + .004); n.g.gain.exponentialRampToValueAtTime(.0001, tt + .045); n.s.start(tt);
    }
  },
  silbido() {
    const c = this.c(); if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(1900, t + 1.1);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.025, t + .1); g.gain.exponentialRampToValueAtTime(.0001, t + 1.15);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 1.2);
  },
  aplausos(dur = 8) {
    const c = this.c(); if (!c) return;
    const sr = c.sampleRate, b = c.createBuffer(2, Math.floor(sr * dur), sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let k = 0; k < dur * 55; k++) {
        const ini = Math.floor(Math.random() * (d.length - sr * .03)), largo = Math.floor(sr * (.01 + Math.random() * .012)), a = .25 + Math.random() * .5;
        for (let i = 0; i < largo; i++) d[ini + i] += (Math.random() * 2 - 1) * a * Math.exp(-i / (largo * .25));
      }
      for (let i = 0; i < d.length; i++) { const u = i / d.length; d[i] *= Math.min(1, u * 6) * Math.min(1, (1 - u) * 3); }
    }
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .6;
    const g = c.createGain(); g.gain.value = .45; s.connect(f).connect(g).connect(c.destination); s.start();
  },
  trueno(k = 1) {
    const c = this.c(); if (!c) return; const t = c.currentTime;
    const { s, g } = this.fuente(c, this.ruido(c, 4.5), 'lowpass', 170);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.9 * k, t + .12);
    for (let i = 1; i < 6; i++) g.gain.exponentialRampToValueAtTime((.35 + Math.random() * .5) * k, t + .12 + i * .45);
    g.gain.exponentialRampToValueAtTime(.0001, t + 4.3); s.start(t);
  },
};
Sonido.init();

/* ---------- datos del tablero: qué se carga, cuándo entra plata, alarmas y metas ---------- */
const TB = () => window.AHTablero || null;
const DATOS = { cargue: null, alarmas: {}, metas: null, vistos: null, porCelebrar: [] };
const LS_PLATA = 'ah.oficina.plata';
const diaSemana = f => { try { return new Intl.DateTimeFormat('es-CO', { weekday: 'long', timeZone: 'UTC' }).format(new Date(f + 'T12:00:00Z')); } catch { return f; } };
function cargueDe(M, tb) {
  const hoy = M.hoy, rems = (M.d.remisiones || []).slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || String(b.creado || '').localeCompare(String(a.creado || '')));
  const dest = r => (r.destinos || []).map(x => x.nombre).filter(Boolean).join(' + ');
  const remHoy = rems.find(r => r.fecha === hoy);
  if (remHoy) return { tipo: 'rem', titulo: `Remisión ${remHoy.numero ? remHoy.numero : 'de hoy'}${dest(remHoy) ? ' · ' + dest(remHoy) : ''}`, sub: `${tb.num(remHoy.piezas, 0)} pzs · ${tb.num(remHoy.rastras)} rastras · salió hoy` };
  const pe = (M.porEntregar || []).slice().sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')));
  if (pe.length) {
    const p = pe[0], nom = p.canal === 'bb' ? `Barro Blanco${p.ref && p.ref.cliente ? ' · ' + p.ref.cliente : ''}` : p.cliente;
    const cuando = p.fecha < hoy ? `atrasado, era para el ${tb.fmtDay(p.fecha)}` : p.fecha === hoy ? 'se entrega hoy' : `para el ${diaSemana(p.fecha)} ${tb.fmtDay(p.fecha)}`;

  /* ---------- bosque, terreno, vía y cordilleras ---------- */
  // Altura del terreno: claro plano alrededor de la oficina y de la vía; lomas suaves después; montaña al fondo.
  const VIA = { a: 33, b: 27.5 };                      // elipse de la vía de tierra alrededor del claro
  function distVia(x, z) { return Math.hypot(x / VIA.a, z / VIA.b); }
  function alturaTerreno(x, z) {
    const d = Math.hypot(x, z * 1.2);
    const loma = (Math.sin(x * .021) * Math.cos(z * .017) * 4.2 + Math.sin(x * .05 + z * .03) * 1.6 + Math.sin(x * .11 - z * .07) * .5) * clamp((d - 38) / 45, 0, 1);
    return loma + Math.pow(clamp((d - 110) / 160, 0, 1), 1.4) * 34 - (d < 17 ? .14 : 0);
  }
  // Ciprés (Cupressus lusitanica): copa cónica densa en pisos que cuelgan, verde azulado oscuro.
  function geoCipres(pisos, radio, base) {
    const pts = [new T.Vector2(.001, base)];
    const h = (1 - base - .04) / pisos;
    for (let k = 0; k < pisos; k++) {
      const y0 = base + k * h, r = radio * Math.pow(1 - k / pisos, .92) + .035;
      pts.push(new T.Vector2(r, y0), new T.Vector2(r * .56, y0 + h * .92));
    }
    pts.push(new T.Vector2(.03, .985), new T.Vector2(.001, 1));
    const g = new T.LatheGeometry(pts, 14);
    const p = g.attributes.position, colr = [], np = pts.length;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), y = p.getY(i), a = Math.atan2(z, x);
      const f = 1 + Math.sin(a * 3 + y * 23) * .1 + Math.sin(a * 7 - y * 41) * .07 + Math.sin(a * 5 + y * 9) * .06;
      p.setX(i, x * f); p.setZ(i, z * f);
      const j = i % np, punta = j % 2 === 1;                    // las puntas de cada piso reciben luz
      const v = punta ? .95 + Math.sin(a * 5 + y * 30) * .05 : .42 + y * .12;
      colr.push(v, v, v);
    }
    g.setAttribute('color', new T.Float32BufferAttribute(colr, 3));
    g.computeVertexNormals();
    return g;
  }
  function bosque() {
    const alto = Q === 'high';
    // Terreno con pasto, tierra en la vía y en el camino de entrada.
    const tg = new T.PlaneGeometry(700, 700, alto ? 180 : 110, alto ? 180 : 110); tg.rotateX(-Math.PI / 2);
    const p = tg.attributes.position, colr = [], cc = new T.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i, alturaTerreno(x, z) - .06);
      const dv = Math.abs(distVia(x, z) - 1) * VIA.a, camino = Math.abs(x) < 1.6 && z > 9 && z < VIA.b + 1;
      const n = Math.sin(x * .7) * Math.cos(z * .9) * .5 + .5;
      if (dv < 2.2 || camino) cc.setHSL(.08, .32, .26 + n * .05);                   // tierra
      else if (enLoteCorte(x, z)) cc.setHSL(.1 + n * .05, .3, .2 + n * .07);           // lote recién cortado
      else if (Math.hypot(x, z * 1.2) < 24) cc.setHSL(.24 + n * .03, .42, .3 + n * .06); // pasto podado del claro
      else cc.setHSL(.27 + n * .05, .38, .18 + n * .07);                            // pasto de monte

    }

    const suelo = mesh(tg, new T.MeshStandardMaterial({ vertexColors: true, map: texPasto(), roughness: .96 }), scene);
    suelo.castShadow = false;
    // Camino de piedra hacia la entrada.
    for (let i = 0; i < 14; i++) fijo(new T.CylinderGeometry(.42 + rnd() * .18, .48, .07, 9), M.piedra, scene, [-.7 + rnd() * 1.4, alturaTerreno(0, 11 + i * 1.15) + .02, 11 + i * 1.15]);

    // Viento en las copas (los árboles se mecen un poco).
    const conViento = mat => {
      mat.onBeforeCompile = sh => {
        sh.uniforms.uTime = U.uTime;
        sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
          `#include <begin_vertex>
          #ifdef USE_INSTANCING
          float fase = instanceMatrix[3][0] * .13 + instanceMatrix[3][2] * .07;
          float hh = max(position.y, 0.0);
          transformed.x += sin(uTime * 1.1 + fase) * .045 * hh * hh;
          transformed.z += cos(uTime * .9 + fase) * .03 * hh * hh;

    };

    const copaPin = new T.InstancedMesh(geoCipres(alto ? 6 : 5, .36, .42), conViento(new T.MeshStandardMaterial({ vertexColors: true, roughness: .9 })), alto ? 320 : 120);
    const troncoG = new T.CylinderGeometry(.022, .045, 1, 6); troncoG.translate(0, .5, 0);

    const m4 = new T.Matrix4(), q = new T.Quaternion(), sc = new T.Vector3(), ps = new T.Vector3(), e = new T.Euler();
    let nc = 0, npn = 0;
    const libre = (x, z) => !enFaena(x, z) && !(Math.abs(x) < 19 && z > -15 && z < 17) && !(Math.abs(x) < 3.5 && z > 8 && z < 40) && Math.abs(distVia(x, z) - 1) * VIA.a > 4;
    const plantar = (x, z, h, pino) => {

        m4.compose(ps, q, sc.set(h * .9, h * .62, h * .9)); tronPin.setMatrixAt(npn, m4);

      if (!libre(x, z)) continue;

    monte(copaCip.count, 170);
    copaCip.count = tronCip.count = nc; copaPin.count = tronPin.count = npn;

        const hp = h.attributes.position; for (let k = 0; k < hp.count; k++) { const y = hp.getY(k); hp.setZ(k, y * y * .55); hp.setX(k, hp.getX(k) * (1 - y * .7)); }

    for (let i = 0, k = 0; i < nH && k < 9000; k++) {

      if (enLoteCorte(x, z)) continue;

    for (let i = 0, k = 0; i < nB && k < 9000; k++) {

      const x = Math.cos(ang) * rad * 1.15, z = Math.sin(ang) * rad;
      if (Math.abs(x) < 15 && z > -11 && z < 15) continue;
      if (Math.abs(distVia(x, z) - 1) * VIA.a < 2.8 || (Math.abs(x) < 2 && z > 9)) continue;
      if (enLoteCorte(x, z)) continue;

    // Rocas con musgo.
    for (let i = 0; i < 18; i++) {
      const ang = rnd() * 6.28, r = 16 + rnd() * 10, s = .35 + rnd() * 1.1, x = Math.cos(ang) * r * 1.2, z = Math.sin(ang) * r;

    const nb = document.createElement('canvas'); nb.width = nb.height = 128; const bx = nb.getContext('2d');
    for (let i = 0; i < 14; i++) {

      g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); bx.fillStyle = g; bx.fillRect(0, 0, 128, 128);

      sp.position.set(Math.cos(ang) * r, alturaTerreno(Math.cos(ang) * r, Math.sin(ang) * r) + 2 + rnd() * 5, Math.sin(ang) * r);
      sp.scale.set(40 + rnd() * 40, 9 + rnd() * 7, 1); sp.userData.v = .3 + rnd() * .5; sp.userData.x0 = sp.position.x;
      scene.add(sp); LUZ.bruma.push(sp);

  /* ---------- cielo y luz ---------- */
  function cieloYLuz() {

      const u = LUZ.sky.material.uniforms; u.turbidity.value = 7; u.rayleigh.value = 1.4; u.mieCoefficient.value = .006; u.mieDirectionalG.value = .78;
    } else {

    }
    const sp = []; for (let i = 0; i < 1600; i++) { const th = Math.random() * 6.28, ph = Math.acos(Math.random() * .92 + .06); sp.push(1400 * Math.sin(ph) * Math.cos(th), 1400 * Math.cos(ph), 1400 * Math.sin(ph) * Math.sin(th)); }
    const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.Float32BufferAttribute(sp, 3));
    LUZ.estrellas = new T.Points(sg, new T.PointsMaterial({ color: 0xdfeee5, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
    scene.add(LUZ.estrellas);
    scene.fog = new T.FogExp2(0xbfd0c8, .0045);
    LUZ.hemi = new T.HemisphereLight(0xcfe6ff, 0x2a3a22, .6); scene.add(LUZ.hemi);
    LUZ.sol = new T.DirectionalLight(0xfff1dc, 2.2);
    LUZ.sol.castShadow = Q === 'high';
    if (Q === 'high') {
      const c = LUZ.sol.shadow.camera; c.left = -20; c.right = 20; c.top = 20; c.bottom = -20; c.near = 1; c.far = 140;
      LUZ.sol.shadow.mapSize.set(4096, 4096); LUZ.sol.shadow.bias = -.0006; LUZ.sol.shadow.normalBias = .06;
    }
    scene.add(LUZ.sol, LUZ.sol.target);
    LUZ.interior = [[0, 3.8, .4], [-7, 3.8, -3], [7, 3.8, -3], [0, 3.8, -6]].map(p => { const l = new T.PointLight(0xffd9a8, .5, 16, 1.6); l.position.set(p[0], p[1], p[2]); scene.add(l); return l; });
    LUZ.vSol = new T.Vector3();
  }
  function horaBogota() {
    try { const s = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()).split(':'); return +s[0] + (+s[1]) / 60; } catch { return new Date().getHours(); }
  }
  function aplicarLuz() {
    const h = luzModo === 'dia' ? 10.5 : (luzModo === 'noche' || luzModo === 'tormenta') ? 21.5 : luzModo === 'tarde' ? 17.55 : horaBogota();
    const elev = 72 * Math.sin(Math.PI * (h - 6) / 12);
    const dia = clamp((elev + 4) / 22, 0, 1);
    const phi = T.MathUtils.degToRad(90 - Math.max(elev, -10)), theta = T.MathUtils.degToRad(110 - 160 * clamp((h - 6) / 12, 0, 1));
    LUZ.vSol.setFromSphericalCoords(1, phi, theta);
    if (LUZ.sky) { const u = LUZ.sky.material.uniforms; u.sunPosition.value.copy(LUZ.vSol); u.rayleigh.value = 1.2 + (1 - dia) * 2; }
    if (LUZ.fondo) LUZ.fondo.material.color.setScalar(.12 + .88 * dia);
    const dir = elev > 2 ? LUZ.vSol : new T.Vector3(-.4, .8, .45).normalize();
    LUZ.sol.position.copy(dir).multiplyScalar(70); LUZ.sol.target.position.set(0, 0, 0);
    LUZ.sol.intensity = elev > 2 ? .4 + 2.3 * dia : .1;
    LUZ.sol.color.copy(elev > 2 ? new T.Color().setHSL(.09, .55 - .35 * dia, .72 + .2 * dia) : new T.Color(0x8fb0ff));
    LUZ.hemi.intensity = .06 + .67 * dia;
    LUZ.hemi.color.setHSL(.58, .4, .55 + .3 * dia);
    scene.fog.color.copy(new T.Color(0x070b10).lerp(new T.Color(0xbfd0c8), dia));
    scene.fog.density = .0045 + (1 - dia) * .004;
    LUZ.estrellas.material.opacity = (1 - dia) * .95;
    LUZ.interior.forEach(l => { l.intensity = .35 + (1 - dia) * 1.1; });
    R.toneMappingExposure = .7 + .22 * dia;
    LUZ.dia = dia;
    const fc = scene.fog.color;
    (LUZ.cordilleras || []).forEach(c => { c.m.material.color.copy(c.base).multiplyScalar(.22 + .78 * dia).lerp(fc, c.k); });
    const neblina = clamp(1 - Math.abs(dia - .45) * 1.7, 0, 1);
    (LUZ.bruma || []).forEach(b => { b.material.opacity = .1 + .32 * neblina; b.material.color.setScalar(.2 + .8 * dia); });
    if (luciernagas) luciernagas.material.opacity = (1 - dia) * .9;
    aves.forEach(a => { a.g.visible = dia > .4; });
    // Atardecer naranja (a la hora real o con el botón) y tormenta con lluvia y rayos.
    const tarde = elev > 0 && (luzModo === 'tarde' || (luzModo === 'ahora' && h > 16.4 && h < 18.4));
    if (LUZ.sky) { const u = LUZ.sky.material.uniforms; u.turbidity.value = tarde ? 13 : 7; u.mieCoefficient.value = tarde ? .014 : .006; if (tarde) u.rayleigh.value = 3.4; }
    if (tarde) {
      LUZ.sol.color.setHSL(.06, .95, .6); LUZ.sol.intensity = 2.6;
      LUZ.hemi.color.setHSL(.07, .55, .62);
      scene.fog.color.lerp(new T.Color(0xe08a4f), .55);
      R.toneMappingExposure = .86;
    }
    const torm = luzModo === 'tormenta';
    if (torm) {
      scene.fog.color.set(0x0a0d12); scene.fog.density = .016; LUZ.estrellas.material.opacity = 0; LUZ.hemi.intensity = .05; LUZ.sol.intensity = .05;
      if (LUZ.sky) LUZ.sky.material.uniforms.rayleigh.value = .3;
      aves.forEach(a => { a.g.visible = false; });
    }
    LUZ.hemiBase = LUZ.hemi.intensity; LUZ.fogBase = scene.fog.color.clone();
    const madrugada = clamp(1 - Math.abs(h - 6.8) / 2.2, 0, 1), ocaso = clamp(1 - Math.abs(h - 17.8) / 1.6, 0, 1);
    CLIMA.k = torm ? .55 : luzModo === 'dia' ? .12 : Math.max(.18, madrugada * .85, ocaso * .5, (1 - dia) * .3);
  }

  /* ---------- paseos: un agente en espera se levanta, va al café, a la ventana o a las pantallas, y vuelve ---------- */
  const PASEO = { s: null, fase: '', t: 0, ruta: [], i: 0, espera: 14, dest: null, yaw: 0, ciclo: 0 };
  const DESTINOS = [
    { id: 'cafe', arco: [7.45, 4.7], puntos: [[7.95, 7.25], [8.7, 7.5]], mira: Math.PI, cafe: true },
    { id: 'ventana', arco: [-7.45, 4.7], puntos: [[-7.55, 7.2], [-7.55, 8.15]], mira: 0 },
    { id: 'muroIzq', arco: [-6.9, -4.7], puntos: [[-8.6, -6.4], [-9.3, -7.35]], mira: Math.PI },
    { id: 'muroDer', arco: [6.9, -4.7], puntos: [[8.6, -6.4], [9.3, -7.35]], mira: Math.PI },
  ];
  const angDe = (x, z) => Math.atan2(x - CENTRO.x, -(z - CENTRO.z));

  function sentarPose(p) { p.piernas.forEach(l => { l.cadera.rotation.x = -Math.PI / 2; l.rodilla.rotation.x = Math.PI / 2; }); p.torso.rotation.set(0, 0, 0); }

    scene.attach(p.g);

    const dest = opciones[rnd() < .7 ? 0 : 1].d;

        if (sorbo > .6) p.head.rotation.x = -.18;
      } else {
        p.brazos.forEach((b, j) => { b.hombro.rotation.set(.25, 0, (j ? 1 : -1) * .12); b.codo.rotation.set(-.4, 0, 0); });
        p.head.rotation.set(-.05, Math.sin(t * .6) * .45, 0);
      }
      if (PASEO.t > 7.5) {
        p.taza.visible = false;
        PASEO.ruta = PASEO.ruta.slice(0, -1).reverse().concat([PASEO.asiento.clone()]);
        PASEO.i = 0; PASEO.fase = 'volver'; PASEO.t = 0;
      }
    }
  }

  /* ---------- animación ---------- */
  const tv = { v: null, a: null };
  function poseTrabajo(p, t, k) {
    p.torso.rotation.x = .1 + Math.sin(t * 1.4 + k) * .015;
    p.head.rotation.set(.22 + Math.sin(t * 2.1 + k) * .04, Math.sin(t * .9 + k) * .12, 0);
    p.brazos.forEach((b, j) => {
      b.hombro.rotation.set(-.5 + Math.sin(t * 9 + j * 2 + k) * .03, 0, (j ? 1 : -1) * .1);
      b.codo.rotation.set(-1.05 + Math.sin(t * 17 + j * 3.1 + k) * .07, 0, 0);
    });
  }
  function poseCalma(p, t, k, s) {
    p.torso.rotation.x = -.1 + Math.sin(t * .8 + k) * .015;
    p.head.rotation.set(-.02 + Math.sin(t * .5 + k) * .05, Math.sin(t * .3 + k * 1.3) * .55, 0);
    const [d, iz] = p.brazos;
    iz.hombro.rotation.set(-.25, 0, .12); iz.codo.rotation.set(-.85, 0, 0);
    const ciclo = (t + s.cafe) % 14, sorbo = ciclo > 11 ? Math.sin((ciclo - 11) / 3 * Math.PI) : 0;
    d.hombro.rotation.set(-.25 - sorbo * .95, 0, -.12 + sorbo * .25); d.codo.rotation.set(-.85 - sorbo * 1.05, 0, 0);
    if (sorbo > .5) p.head.rotation.x = -.15;
  }
  function frame() {
    raf = requestAnimationFrame(frame);
    if (document.hidden) return;
    const dt = Math.min(clock.getDelta(), .05), t = clock.getElapsedTime();
    const reducir = RM.matches;
    U.uTime.value = t;
    if (intro < 1) intro = Math.min(1, intro + dt / 2.6);
    if (TOUR) tourFrame(dt);
    else {
      if (!reducir && !S.sel && performance.now() - ultimaInteraccion > 8000) camG.az += dt * .035;
      const k = reducir ? 1 : 1 - Math.pow(.002, dt);
      for (const key of ['az', 'pol', 'rad', 'tx', 'ty', 'tz']) camS[key] += (camG[key] - camS[key]) * k;
      const extra = reducir ? 0 : (1 - easeOut(intro));
      const kr = camS.rad, kp = camS.pol, ka = camS.az;
      camS.rad += extra * 40; camS.pol -= extra * .45; camS.az += extra * .9;
      ponerCamara(); camS.rad = kr; camS.pol = kp; camS.az = ka;
    }

    if (holo && !reducir) {
      holo.userData.anillos.forEach((r, i) => { r.rotation.z = t * (.15 + i * .05) * (i % 2 ? -1 : 1); r.position.y = .12 + Math.sin(t * .8 + i) * .04 + i * .015; });
      holo.userData.giro.rotation.y = t * .45; holo.userData.giro.position.y = 1.05 + Math.sin(t * 1.2) * .05;
    }
    if (!reducir && !PASEO.s && !CELE) {
      PASEO.espera -= dt;
      if (PASEO.espera <= 0) {
        const libres = st.filter(x => (x.vis === 'espera' || x.vis === 'listo') && S.sel !== x.id && x.ola <= 0);
        if (libres.length) iniciarPaseo(libres[Math.floor(rnd() * libres.length)]); else PASEO.espera = 12;
      }
    }
    st.forEach(s => {
      const v = s.vis || 'formacion', p = s.p, trabajando = v === 'trabajando';
      if (CELE && CELE.t < CELE.dur - 1) { poseFiesta(s, t); return; }
      if (s.parado) sentarDeNuevo(s);
      if (PASEO.s === s) { if (!reducir) paseoFrame(dt, t); }
      else if (!reducir) {
        if (trabajando) poseTrabajo(p, t, s.i); else poseCalma(p, t, s.i, s);
        if (s.ola > 0) {
          s.ola -= dt; const d = p.brazos[0];
          d.hombro.rotation.set(0, 0, -2.45); d.codo.rotation.set(0, 0, Math.sin(t * 11) * .38 - .25);
          p.head.rotation.set(-.05, 0, Math.sin(t * 3) * .08);
          if (s.p.boca) s.p.boca.scale.y = .03;
        } else if (s.p.boca) s.p.boca.scale.y = trabajando && s.id === 'seguimiento' ? .02 + Math.abs(Math.sin(t * 9)) * .02 : .02;
        s.silla.rotation.y = trabajando ? Math.sin(t * .7 + s.i) * .05 : Math.sin(t * .25 + s.i) * .18;
        const bl = (t + s.parpadeo) % 4.2 < .12 ? .12 : 1;
        p.ojos.forEach(o => { o.scale.y = bl; });
        if (v === 'formacion') M.holoP.opacity = .22 + Math.abs(Math.sin(t * 1.3)) * .12;
      }
      if (PASEO.s === s) { /* el ojo y el pelo siguen; las poses las pone el paseo */ const bl = (t + s.parpadeo) % 4.2 < .12 ? .12 : 1; p.ojos.forEach(o => { o.scale.y = bl; }); }
      if (trabajando) {
        s.halo.rotation.z = t * 2.4;
        const f = reducir ? .5 : (t * .9) % 1, sc = 1 + f * .7; s.pulse.scale.set(sc, sc, sc); s.pulseMat.opacity = (1 - f) * .7;
        s.beam.forEach((b, j) => { const u = reducir ? j / s.beam.length : (t * .45 + j / s.beam.length) % 1; s.curve.getPoint(u, b.position); b.material.opacity = Math.sin(u * Math.PI) * .9; });
        if (t - s.ult > .14) { s.ult = t; pintarPantalla(s, t); pintarMini(s, t); }
      } else s.pulseMat.opacity = 0;
      if (s.fut) {
        const f = s.fut;
        if (v === 'formacion' || reducir) f.sp.visible = false;
        else {
          const u = (t * (trabajando ? .7 : .2) + s.i * .17) % 1;
          f.sp.visible = true; f.sp.position.lerpVectors(f.b, f.a, u);
          f.sp.material.opacity = Math.sin(u * Math.PI) * (trabajando ? 1 : .55);
          f.sp.material.color.setHex(trabajando ? 0xFF9A4D : 0x7CF0A8);
        }
      }
      if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * .6);
      s.padMat.opacity = Math.min(1, (v === 'formacion' ? .3 : .75) + s.flash * .6 + (S.sel === s.id ? .25 : 0));
    });
    if (!reducir) {
      const a = t * .18;
      drone.position.set(Math.cos(a) * 19, 7.5 + Math.sin(t * 1.3) * .4, Math.sin(a) * 15);
      drone.rotation.set(Math.sin(t) * .05, -a, .12);
      const b = t * .32;
      bot.position.set(CENTRO.x + Math.sin(b) * 4.6, 2.2 + Math.sin(t * 2) * .12, CENTRO.z + Math.sin(b * 2) * 2.4);
      bot.rotation.y = Math.atan2(Math.cos(b) * 4.6, Math.cos(b * 2) * 4.8);
      bot.userData.ojo.scale.x = .06 + Math.abs(Math.sin(t * 2)) * .02;
      faenaFrame(dt, t);
      if (camion) {
        const v = 7.5, ux = camion.userData.u += dt * v / ((VIA.a + VIA.b) / 2);
        const x = Math.cos(ux) * VIA.a, z = Math.sin(ux) * VIA.b, dx = -Math.sin(ux) * VIA.a, dz = Math.cos(ux) * VIA.b;
        camion.position.set(x, alturaTerreno(x, z) + .02, z); camion.rotation.y = Math.atan2(dx, dz);
        camion.userData.ruedas.forEach(r => { r.rotation.x -= dt * v / .46; });
        camion.userData.luces.forEach(l => { l.material.opacity = (1 - (LUZ.dia || 0)) * .9; });
      }
      const vuelo = (t * 9) % 320 - 160;
      aves.forEach((av, i) => {
        av.g.position.set(vuelo + av.off.x, 30 + av.off.y + Math.sin(t + i) * .5, -40 + av.off.z + Math.sin(t * .2) * 6);
        av.g.rotation.y = -Math.PI / 2;
        const fl = Math.sin(t * 9 + av.fase) * .7; av.l.rotation.z = fl; av.r.rotation.z = -fl;
      });
      (LUZ.bruma || []).forEach((b, i) => { b.position.x = b.userData.x0 + Math.sin(t * .03 * b.userData.v + i) * 12; });
      if (luciernagas && LUZ.dia < .6) {
        const pa = luciernagas.geometry.attributes.position, base = luciernagas.userData.base;
        for (let i = 0; i < pa.count; i++) { pa.array[i * 3] = base[i * 3] + Math.sin(t * .6 + i) * .6; pa.array[i * 3 + 1] = base[i * 3 + 1] + Math.sin(t * 1.1 + i * 2) * .3; }
        pa.needsUpdate = true;
      }
    }
    if (t - ultimoVideo > 1 / (Q === 'high' ? 30 : 15)) { ultimoVideo = t; pintarVideo(t); }
    if (t - ultimoReloj > 1) { ultimoReloj = t; pintarMuros(); if (luzModo === 'ahora' && (t | 0) % 60 === 0) aplicarLuz(); }
    if (vigas) vigas.visible = cam.position.y < 4.4;
    // Cuando la cámara está cerca de la mesa de mando, el holograma se atenúa para no encandilar.
    if (holo) {
      const dc = Math.hypot(cam.position.x - CENTRO.x, cam.position.z - CENTRO.z), kh = clamp((dc - 3.6) / 3, 0, 1);
      holo.userData.col.material.opacity = .1 * kh; holo.userData.nucleo.material.opacity = .55 * kh;
      holo.userData.anillos.forEach((r, i) => { r.material.opacity = (.9 - i * .11) * (.25 + .75 * kh); });
      if (mesaLed) mesaLed.visible = kh > .5;
    }
    extrasFrame(dt, t, reducir);
    if (composer) composer.render(); else R.render(scene, cam);
    medirFluidez();
    const w = innerWidth, h = innerHeight;
    tagEls.forEach(s => {
      tv.v = tv.v || new T.Vector3(); const p = tv.v.copy(s.tagPos).project(cam);
      const d = cam.position.distanceTo(s.tagPos);
      const vis = p.z < 1 && p.x > -1.1 && p.x < 1.1 && p.y > -1.1 && p.y < 1.1 && d < 40;
      s.el.hidden = !vis; if (!vis) return;
      s.el.style.transform = `translate(${(p.x * .5 + .5) * w}px, ${(-p.y * .5 + .5) * h}px) translate(-50%, -100%) scale(${clamp(12 / d, .62, 1.08).toFixed(3)})`;
      s.el.style.zIndex = String(1000 - Math.round(d * 10));
    });
    if (ytTag) {
      const p = tv.v.copy(ytPos).project(cam), d = cam.position.distanceTo(ytPos);
      const vis = p.z < 1 && p.x > -1 && p.x < 1 && p.y > -1 && p.y < 1 && d < 45;
      ytTag.hidden = !vis;
      if (cargaTag) {
        const q = (tv.w = tv.w || new T.Vector3()).copy(cargaPos).project(cam), dq = cam.position.distanceTo(cargaPos);
        const vq = q.z < 1 && q.x > -1 && q.x < 1 && q.y > -1 && q.y < 1 && dq < 90 && !!cargaTag.innerHTML;
        cargaTag.hidden = !vq;
        if (vq) { cargaTag.style.transform = `translate(${(q.x * .5 + .5) * w}px, ${(-q.y * .5 + .5) * h}px) translate(-50%, -100%) scale(${clamp(26 / dq, .7, 1.05).toFixed(3)})`; cargaTag.style.zIndex = String(1000 - Math.round(dq * 10)); }
      }
      if (vis) { ytTag.style.transform = `translate(${(p.x * .5 + .5) * w}px, ${(-p.y * .5 + .5) * h}px) translate(-50%, 0) scale(${clamp(12 / d, .62, 1.08).toFixed(3)})`; ytTag.style.zIndex = String(1000 - Math.round(d * 10)); }
    }
  }

  async function iniciar() {
    const load = $('#of-load');
    if (fallo) return;
    if (!ok) {
      load.classList.remove('off');
      try { T = await cargarThree(); construir(); }
      catch (e) {
        console.error(e);
        fallo = true; load.classList.add('off');
        const n = document.createElement('p'); n.className = 'of-note of-glass';
        n.textContent = 'No se pudo cargar la vista 3D en este dispositivo. La lista de agentes y sus fichas siguen funcionando.';
        $('#of').appendChild(n); return;
      }
      intro = 0;
    }
    if (!S.open) return;
    aplicar(); aplicarLuz(); ajustar(); pintarRoster(); if (DATOSE) datos(DATOSE);
    load.classList.add('off');
    clock.getDelta();
    if (!setDesde) setDesde = performance.now();
    ESC.desde = performance.now() + 4000; ESC.last = 0; ESC.buenos = 0;   // deja pasar la entrada antes de medir
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function parar() { cancelAnimationFrame(raf); raf = 0; }
  function destello(id) { const s = st.find(x => x.id === id); if (s) s.flash = 1; const t = s && s.el; if (t) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); } pintarMuros(); }
  function luz(modo) { luzModo = modo; if (ok) aplicarLuz(); }
  return { celebrar, recorrido, datos, enTour: () => !!TOUR, lista: () => ok, iniciar, parar, aplicar, enfocar, destello, luz, muros: () => ok && pintarMuros(), tags: () => tagEls, modoLuz: () => luzModo };
})();

/* Siempre escucha las fichas (son 11 documentos) para marcar el menú cuando alguien trabaja. */
setTimeout(() => { conectar(); }, 1500);

window.AHOficina = {
  abrir,
  cerrar,
  get trabajando() { return ROSTER.filter(r => visOf(r.id) === 'trabajando').length; },
};
})();
</script>
