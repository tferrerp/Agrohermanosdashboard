<title>Tablero Agrohermanos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed rail of business areas on the left, a work area on the right; one filter row on top scopes every number below it. */
:root {
  /* Colores aprobados del manual de marca: verde #25372B y naranja #D46A1F. Fondo blanco (día) o negro (noche). */
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #FAFAFA;
  --sunken: #F3F3F3;
  --line: #EBEBEB;
  --line-strong: #D6D6D6;
  --fg: #111311;
  --fg-2: #454A46;
  --muted: #7A7F7B;
  --accent: #D46A1F;
  --accent-tx: #B4561A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBEDE3;
  --brand: #D46A1F;
  --brand-soft: #FBEDE3;
  --green: #25372B;
  --green-soft: #E5EBE6;
  --label: #25372B;
  --logo-a: #25372B;
  --logo-b: #D46A1F;
  --logo-cut: #FFFFFF;
  --rail-bg: #FFFFFF;
  --rail-line: #EBEBEB;
  --rail-fg: #111311;
  --rail-fg-2: #454A46;
  --rail-muted: #25372B;
  --rail-hover: #F3F3F3;
  --rail-active: #FBEDE3;
  --s1: #25372B;
  --s2: #D46A1F;
  --s3: #4A6FC0;
  --good: #25372B;
  --good-soft: #E5EBE6;
  --warn: #9A5F0E;
  --warn-soft: #FDF1DE;
  --crit: #C0322F;
  --crit-soft: #FDE7E6;
  --scrim: rgba(10, 10, 10, .42);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -20px rgba(0, 0, 0, .22);
  --glow: 0 2px 6px rgba(0, 0, 0, .04), 0 18px 40px -18px rgba(212, 106, 31, .5);
  --f-ui: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0B0B0B; --surface-2: #060606; --sunken: #161616;
    --line: #1F1F1F; --line-strong: #2F2F2F;
    --fg: #F5F5F5; --fg-2: #C4C4C4; --muted: #8C8C8C;
    --accent: #D46A1F; --accent-tx: #D46A1F; --accent-ink: #FFFFFF; --accent-soft: #2A170A;
    --brand: #D46A1F; --brand-soft: #2A170A;
    --green: #25372B; --green-soft: #25372B; --label: #8C8C8C;
    /* De noche el verde de la marca va de fondo (barra lateral, etiquetas) y el logo usa su versión blanca sobre verde. */
    --logo-a: #FFFFFF; --logo-b: #D46A1F; --logo-cut: #25372B;
    --rail-bg: #25372B; --rail-line: #25372B; --rail-fg: #FFFFFF; --rail-fg-2: rgba(255, 255, 255, .8); --rail-muted: rgba(255, 255, 255, .55); --rail-hover: rgba(255, 255, 255, .08); --rail-active: rgba(255, 255, 255, .12);
    --s1: #F2F2F2; --s2: #D46A1F; --s3: #6A8FE0;
    --good: #FFFFFF; --good-soft: #25372B; --warn: #F2B13D; --warn-soft: #261C0B; --crit: #FF6B63; --crit-soft: #2A1110;
    --scrim: rgba(0, 0, 0, .7);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 44px -22px rgba(0, 0, 0, .9);
    --glow: 0 0 0 1px rgba(212, 106, 31, .45), 0 18px 44px -20px rgba(212, 106, 31, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0B0B0B; --surface-2: #060606; --sunken: #161616;
  --line: #1F1F1F; --line-strong: #2F2F2F;
  --fg: #F5F5F5; --fg-2: #C4C4C4; --muted: #8C8C8C;
  --accent: #D46A1F; --accent-tx: #D46A1F; --accent-ink: #FFFFFF; --accent-soft: #2A170A;
  --brand: #D46A1F; --brand-soft: #2A170A;
  --green: #25372B; --green-soft: #25372B; --label: #8C8C8C;
  /* De noche el verde de la marca va de fondo (barra lateral, etiquetas) y el logo usa su versión blanca sobre verde. */
  --logo-a: #FFFFFF; --logo-b: #D46A1F; --logo-cut: #25372B;
  --rail-bg: #25372B; --rail-line: #25372B; --rail-fg: #FFFFFF; --rail-fg-2: rgba(255, 255, 255, .8); --rail-muted: rgba(255, 255, 255, .55); --rail-hover: rgba(255, 255, 255, .08); --rail-active: rgba(255, 255, 255, .12);
  --s1: #F2F2F2; --s2: #D46A1F; --s3: #6A8FE0;
  --good: #FFFFFF; --good-soft: #25372B; --warn: #F2B13D; --warn-soft: #261C0B; --crit: #FF6B63; --crit-soft: #2A1110;
  --scrim: rgba(0, 0, 0, .7);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 44px -22px rgba(0, 0, 0, .9);
  --glow: 0 0 0 1px rgba(212, 106, 31, .45), 0 18px 44px -20px rgba(212, 106, 31, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variation-settings: "wdth" 100;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.neg { color: var(--crit); }
.pos { color: var(--good); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--rail-bg) 0 227px, var(--rail-line) 227px 228px, transparent 228px); }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 28px;
  padding: 22px 14px 18px; background: var(--rail-bg); border-right: 1px solid var(--rail-line); color: var(--rail-fg-2);
}
.brand { display: flex; align-items: center; padding: 2px 6px 0; border: 0; background: none; cursor: pointer; border-radius: 10px; transition: transform .2s, opacity .2s; }
.brand:hover { transform: scale(1.03); }
.brand:active { transform: scale(.98); }
/* Logo del manual de marca, sin fondo: verde y naranja cambian con el tema. */
.brand .logo { display: block; width: 100%; max-width: 196px; height: auto; flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-g { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--rail-muted); padding: 14px 10px 6px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
  color: var(--rail-fg-2); font-weight: 500; text-align: left;
}
.nav button svg { width: 16px; height: 16px; flex: none; opacity: .8; }
.nav button { transition: background .15s, color .15s, box-shadow .15s; }
.nav button:hover { background: var(--rail-hover); color: var(--rail-fg); }
.nav button:hover svg { color: var(--brand); opacity: 1; }
.nav button[aria-current="page"] { background: var(--rail-active); color: var(--rail-fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--brand); }
.nav button[aria-current="page"] svg { color: var(--brand); opacity: 1; }
.nav .badge.eq { background: var(--accent-soft); color: var(--accent-tx); animation: eq-pulse 1.4s ease-in-out infinite; }
@keyframes eq-pulse { 50% { opacity: .45; } }
.nav .badge { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 99px; background: var(--crit-soft); color: var(--crit); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--rail-fg-2); }
.rail-foot .btn { color: inherit; }
.rail-foot .btn:hover { background: var(--rail-hover); color: var(--rail-fg); }
.sync { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.on i { background: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
.sync.local i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

.main { min-width: 0; padding-inline: clamp(16px, 3.2vw, 40px); padding-block: 0 64px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding-block: 18px 12px; display: flex; flex-direction: column; gap: 14px;
  border-bottom: 1px solid var(--line); margin-bottom: 22px;
}
.top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
.top h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; font-variation-settings: "wdth" 112; margin-top: 4px; }
.top h1::after { content: ""; display: inline-block; width: 9px; height: 9px; margin-left: 9px; border-radius: 2px; background: var(--brand); vertical-align: .12em; }
.top-actions { display: flex; gap: 8px; align-items: center; position: relative; }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunken); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  font-family: var(--f-mono); font-size: 11.5px; color: var(--fg-2);
}
.seg button:hover { color: var(--fg); }
.seg button { transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 6px 14px -8px var(--brand); }
.custom { display: flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.custom input { height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-family: var(--f-mono); font-size: 12px; }
.range-txt { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 13px;
  background: var(--brand-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); border-left: 4px solid var(--brand);
}
.banner b { font-weight: 600; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
  border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
  font-weight: 500; font-size: 13px; white-space: nowrap;
}
.btn { transition: border-color .15s, color .15s, background .15s, transform .15s, box-shadow .15s; }
.btn:hover { border-color: var(--brand); color: var(--accent-tx); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { color: var(--accent-ink); transform: translateY(-1px); box-shadow: var(--glow); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--crit); }
.btn.danger.armed { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--fg-2); }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-tx); }

.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 270px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
}
.menu h4 { margin: 0; padding: 10px 10px 4px; font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: transparent; border-radius: 7px; cursor: pointer; text-align: left; font-size: 13px; }
.menu button:hover { background: var(--accent-soft); color: var(--accent-tx); }
.menu button i { width: 6px; height: 6px; border-radius: 2px; background: var(--line-strong); flex: none; }
.menu button:hover i { background: var(--brand); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.foto-fill { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 14px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--fg-2); }
.foto-fill .btn { flex: none; }
.foto-fill:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.menu.pop { position: fixed; right: auto; top: 0; left: 0; width: 220px; z-index: 60; }
.thumb { position: relative; display: inline-grid; place-items: center; width: 52px; height: 52px; padding: 0; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: var(--sunken); cursor: zoom-in; transition: transform .15s, border-color .15s, box-shadow .15s; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb img:not([src]) { display: none; }
.thumb span { color: var(--muted); }
.thumb span svg { width: 16px; height: 16px; }
.thumb.ok span { display: none; }
.thumb.roto img { display: none; }
.thumb.roto::after { content: "Sin foto"; font-size: 9.5px; color: var(--muted); text-align: center; }
.thumb:hover { transform: scale(1.06); border-color: var(--brand); box-shadow: var(--glow); }
.thumb-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 12.5px; }
.lightbox { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(0, 0, 0, .82); padding: 24px; cursor: zoom-out; animation: fade .2s ease; }
.lightbox img { max-width: min(100%, 980px); max-height: calc(100dvh - 48px); border-radius: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); background: #fff; }
.lightbox .lb-st { position: absolute; color: #fff; font-size: 14px; }
.lightbox .lb-x { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; cursor: pointer; }
.lightbox .lb-x svg { width: 18px; height: 18px; }
.thumb.big { width: 88px; height: 88px; flex: none; }
.stepper { display: flex; gap: 6px; margin: 0 0 4px; padding: 0; list-style: none; counter-reset: none; }
.stepper li { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sunken); color: var(--muted); font-size: 12px; min-width: 0; }
.stepper li b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--line-strong); color: var(--surface); font: 600 11px/1 var(--f-mono); }
.stepper li b svg { width: 12px; height: 12px; }
.stepper li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper li.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--brand); }
.stepper li.on b { background: var(--brand); color: #fff; }
.stepper li.done { color: var(--fg-2); }
.stepper li.done b { background: var(--green); color: #fff; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 18px; border: 2px dashed color-mix(in srgb, var(--brand) 55%, var(--line-strong)); border-radius: 14px; background: var(--accent-soft); text-align: center; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.drop svg { width: 30px; height: 30px; color: var(--brand); }
.drop b { font-size: 16px; }
.drop span { font-size: 12.5px; color: var(--fg-2); max-width: 40ch; }
.drop:hover { transform: translateY(-1px); box-shadow: var(--glow); border-color: var(--brand); }
input.sr-only:focus-visible + * , .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.q { margin: 6px 0 0; font-size: 15px; font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
.choice b { font-size: 14px; }
.choice span { font-size: 12px; color: var(--muted); }
.choice:hover { border-color: var(--brand); }
.choice[aria-pressed="true"] { border-color: var(--brand); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.dest { border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.dest-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dest-n { font-weight: 600; }
.dest select, .dest input { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-size: 13.5px; }
.tbl.asig input, .dest .tbl input { width: 92px; height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); font-family: var(--f-mono); text-align: right; }
.tbl.asig input:focus, .dest .tbl input:focus, .dest select:focus, .dest input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rem-top { display: flex; align-items: center; gap: 14px; }
.dest-precio { font-size: 12.5px; line-height: 1.45; color: var(--fg-2); padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); }
.asig-auto { display: inline-block; min-width: 92px; height: 32px; line-height: 32px; padding: 0 8px; border-radius: 7px; background: var(--sunken); font-family: var(--f-mono); text-align: right; color: var(--fg-2); box-sizing: border-box; }
.asig-auto.neg { color: var(--crit); }
/* Varias fotos de una remisión */
.fotos { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 8px; }
.fotos .ft { position: relative; }
.fotos .x { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface); color: var(--fg); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.fotos .x svg { width: 12px; height: 12px; }
.fotos .x:hover { border-color: var(--brand); color: var(--brand); }
.fotos .add { width: 88px; height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px dashed color-mix(in srgb, var(--brand) 55%, var(--line-strong)); border-radius: 9px; background: var(--accent-soft); color: var(--brand); font-size: 11px; line-height: 1.2; text-align: center; cursor: pointer; }
.fotos .add svg { width: 18px; height: 18px; }
.fotos .add:hover { border-color: var(--brand); box-shadow: var(--glow); }
.fotos.mini { gap: 6px; margin: 0; max-width: 176px; flex: none; }
.hero-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 34px 16px 26px; }
.hero-empty > svg { width: 46px; height: 46px; color: var(--brand); padding: 10px; border-radius: 14px; background: var(--accent-soft); box-sizing: content-box; }
.hero-empty b { font-size: 17px; }
.hero-empty p { max-width: 52ch; color: var(--fg-2); font-size: 13.5px; }
@media (max-width: 560px) { .choices { grid-template-columns: minmax(0, 1fr); } .stepper li span { display: none; } .stepper li { justify-content: center; } }
.foto-link { display: inline-block; margin: 0 0 6px; color: var(--accent-tx); font-weight: 600; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- content blocks ---------- */
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid { display: grid; gap: 18px; }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 16px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-h h3 { font-size: 14.5px; font-weight: 600; }
.card-h p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.card-h .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.section-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.section-h p { color: var(--fg-2); max-width: 70ch; font-size: 13.5px; }
.section-h .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { position: relative; background: var(--surface); padding: 16px 18px 15px; min-width: 0; display: flex; flex-direction: column; gap: 6px; transition: background .2s; }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--brand); transform: scaleX(0); transform-origin: left; transition: transform .3s cubic-bezier(.2, .7, .2, 1); }
.kpi:hover::before { transform: scaleX(1); }
.kpi.go { cursor: pointer; }
.kpi.go:hover { background: var(--accent-soft); }
.kpi.go .kpi-l::after { content: "→"; margin-left: auto; color: var(--brand); opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
.kpi.go:hover .kpi-l::after { opacity: 1; transform: none; }
.kpis:not(.soft) > .kpi:first-child .kpi-v { color: var(--accent-tx); }
.kpi-l { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi-l i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.kpi-v { font-size: 27px; font-weight: 600; letter-spacing: -.015em; font-variation-settings: "wdth" 108; line-height: 1.1; overflow-wrap: anywhere; }
.kpi-v.sm { font-size: 21px; }
.kpi-v .kpi-pc { font-size: .6em; font-weight: 600; color: var(--muted); margin-left: 8px; letter-spacing: 0; white-space: nowrap; }
.kpi-s { font-size: 12px; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.kpis.soft .kpi { background: var(--surface-2); }
/* Desplegables: cada tarjeta se abre debajo y explica su número */
.kpi.det { cursor: pointer; }
.kpi.det .kpi-l::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-2px) rotate(45deg); opacity: .5; transition: transform .2s, opacity .2s, color .2s; flex: none; }
.kpi.det:hover { background: var(--accent-soft); }
.kpi.det:hover .kpi-l::after { opacity: 1; color: var(--brand); }
.kpi.det.open { background: var(--accent-soft); }
.kpi.det.open::before { transform: scaleX(1); }
.kpi.det.open .kpi-l::after { transform: translateY(1px) rotate(225deg); opacity: 1; color: var(--brand); }
.kpi-det { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: var(--r); padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); animation: det-in .24s cubic-bezier(.2, .7, .2, 1); min-width: 0; }
.kpi-det > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kpi-det > header h3 { font-size: 17px; font-weight: 600; margin-top: 3px; font-variation-settings: "wdth" 106; }
.kpi-det-v { color: var(--accent-tx); }
.kpi-det .ldg-h { margin-top: 6px; }
.det-exp { font-size: 13px; line-height: 1.55; color: var(--fg-2); max-width: 92ch; }
.det-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 30px; align-items: start; }
.det-cols > div { min-width: 0; }
.det-acts { display: flex; gap: 8px; flex-wrap: wrap; }
@keyframes det-in { from { opacity: 0; transform: translateY(-6px); } }
@media (max-width: 760px) { .det-cols { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .kpi-det { animation: none; } }
/* Ficha del cliente */
.ficha { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.ficha-d { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--fg-2); }
.ficha-d > span + span::before { content: "·"; margin-right: 14px; color: var(--line-strong); }
.inv-res.ficha-k { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 0; }
.inv-res.ficha-k small { font-size: 11.5px; color: var(--muted); }
.ficha-top { font-size: 12.5px; color: var(--fg-2); margin: 0; }
@media (max-width: 520px) { .inv-res.ficha-k { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 99px; font: 500 11px/1.6 var(--f-mono); white-space: nowrap; background: var(--sunken); color: var(--fg-2); }
.chip svg { width: 11px; height: 11px; flex: none; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.wood { background: var(--brand-soft); color: var(--brand); }

.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.pill { transition: border-color .15s, background .15s, color .15s; }
.pill:hover { border-color: var(--brand); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 4px 14px 4px 4px; font: 600 13px/1 var(--f-ui); cursor: pointer; }
.switch i { position: relative; width: 40px; height: 24px; border-radius: 99px; background: var(--line-strong); transition: background .18s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .18s; }
.switch[aria-checked="true"] { border-color: var(--green); }
.switch[aria-checked="true"] i { background: var(--green); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch:disabled { opacity: .6; cursor: progress; }
.pauta-ctls { display: grid; gap: 12px; margin-bottom: 16px; }
.pauta-ctl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
.pauta-ctl .pc-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pauta-ctl .pc-txt span { color: var(--muted); font-size: 12.5px; }
.pauta-ctl .pc-st { color: var(--fg-2); font-size: 12.5px; }
@media (max-width: 720px) { .pauta-ctl { grid-template-columns: minmax(0, 1fr) auto; } .pauta-ctl .pc-st { grid-column: 1 / -1; order: 3; } .pauta-ctl .btn { justify-self: start; } }

/* tables */
.tbl-wrap { overflow-x: auto; margin-inline: -18px; padding-inline: 18px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 10px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl .r { text-align: right; }
.tbl td.r, .tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
.tbl tbody tr[data-act] { cursor: pointer; }
.tbl tbody td { transition: background .12s; }
.tbl tbody tr[data-act]:hover td { background: var(--accent-soft); }
.tbl .sub { display: block; font-size: 11.5px; color: var(--muted); }
.tbl td .num { white-space: nowrap; }
.tbl th.nt { text-transform: none; font-size: 11px; letter-spacing: .02em; }
.tbl tfoot td { border-top: 1px solid var(--line-strong); border-bottom: 0; font-weight: 600; }
.cell-strong { font-weight: 600; }

.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 0 6px; color: var(--fg-2); }
.empty b { color: var(--fg); font-weight: 600; font-size: 14px; }
.empty p { max-width: 56ch; font-size: 13px; }

/* alerts */
.alerts { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.alert:last-child { border-bottom: 0; }
/* ---------- Seguimiento de WhatsApp ---------- */
.seg-sync { display: flex; align-items: center; gap: 8px; margin: -6px 0 14px; font-size: 12.5px; color: var(--fg-2); }
.seg-sync svg { width: 14px; height: 14px; color: var(--good); flex: none; }
.seg-sync b { font-weight: 600; color: var(--fg); }
.seg-kpi-small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.seg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.seg-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.seg-item:first-child { padding-top: 2px; }
.seg-item:last-child { border-bottom: 0; padding-bottom: 2px; }
.seg-item.hot { position: relative; }
.seg-item.hot::before { content: ""; position: absolute; left: -18px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--crit); }
.seg-item:first-child.hot::before { top: 2px; }
.seg-main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.seg-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.seg-head b { font-size: 14px; font-weight: 600; }
.seg-tel { font-size: 11.5px; color: var(--muted); }
.seg-wait { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 99px; font: 600 11px/1.6 var(--f-mono); white-space: nowrap; background: var(--sunken); color: var(--fg-2); }
.seg-wait svg { width: 11px; height: 11px; }
.seg-wait.warn { background: var(--warn-soft); color: var(--warn); }
.seg-wait.crit { background: var(--crit-soft); color: var(--crit); }
.seg-res { font-size: 13px; color: var(--fg); max-width: 75ch; }
.seg-precio { display: flex; align-items: center; gap: 6px; font: 500 12px/1.4 var(--f-mono); color: var(--fg-2); }
.seg-precio svg { width: 12px; height: 12px; flex: none; color: var(--brand); }
.seg-msg { font-size: 12.5px; color: var(--fg-2); max-width: 75ch; overflow-wrap: anywhere; }
.seg-who { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 5px; font: 600 10px/1.7 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; background: var(--green-soft); color: var(--good); vertical-align: 1px; }
.seg-who.me { background: var(--sunken); color: var(--muted); }
.seg-next { font-size: 12.5px; font-weight: 500; color: var(--accent-tx); max-width: 75ch; }
.seg-next::before { content: "→ "; }
.seg-acts { display: flex; align-items: flex-start; gap: 4px; }
.seg-acts .icon-btn { width: 30px; height: 30px; }
.btn.wa { text-decoration: none; color: inherit; }
.btn.wa svg { color: var(--good); }
.btn.wa:hover svg { color: var(--accent-tx); }
.seg-foot { margin-top: 12px; font-size: 12px; color: var(--muted); }
.seg-bar { margin-bottom: 12px; }
.seg-f { display: inline-flex; }
.seg-cell { display: block; max-width: 38ch; white-space: normal; font-size: 12.5px; }
.seg-note { display: block; margin-top: 18px; }
.seg-note svg { width: 13px; height: 13px; vertical-align: -2px; }
.seg-det { padding: 0; }
.seg-det > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; cursor: pointer; }
.seg-det > summary::-webkit-details-marker { display: none; }
.seg-det > summary span { display: flex; flex-direction: column; gap: 3px; }
.seg-det > summary b { font-size: 14.5px; font-weight: 600; }
.seg-det > summary small { font-size: 12.5px; color: var(--muted); }
.seg-det > summary svg { width: 15px; height: 15px; color: var(--muted); transition: transform .2s; flex: none; }
.seg-det[open] > summary svg { transform: rotate(180deg); }
.seg-det > .seg-list, .seg-det > .empty { padding: 0 18px 14px; }
.seg-mas { margin-top: 10px; }
.seg-side .seg-item { grid-template-columns: minmax(0, 1fr); }
.seg-side .seg-acts { justify-content: flex-start; }
.seg-pop { width: 236px; max-height: min(78vh, 560px); overflow-y: auto; }
.seg-pop-tel { margin: 0; padding: 0 10px 6px; font-size: 11.5px; color: var(--muted); }
@media (max-width: 640px) {
  .seg-item { grid-template-columns: minmax(0, 1fr); }
  .seg-item.hot::before { left: -16px; }
  .seg-acts { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .seg-det > summary svg { transition: none; } }


/* ---------- Prospectos (agente Mercado) ---------- */
.pr-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.pr-bar .pills { gap: 6px; }
.pr-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pr-item { display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.pr-item:first-child { padding-top: 2px; }
.pr-item:last-child { border-bottom: 0; }
.pr-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pr-head b { font-size: 15px; font-weight: 600; }
.pr-mun { font-size: 12.5px; color: var(--muted); }
.pr-why { font-size: 13px; max-width: 80ch; }
.pr-sig { font-size: 12px; color: var(--muted); max-width: 80ch; }
.pr-msg { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.pr-msg > summary { cursor: pointer; padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--accent-tx); list-style: none; }
.pr-msg > summary::-webkit-details-marker { display: none; }
.pr-msg > summary::before { content: "▸ "; }
.pr-msg[open] > summary::before { content: "▾ "; }
.pr-msg p { padding: 0 12px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; max-width: 80ch; }
.pr-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pr-acts a.btn { text-decoration: none; color: inherit; }
.pr-acts .sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 4px; }
.pr-est { font-size: 11.5px; color: var(--muted); }
.pill[aria-pressed="true"] .muted { color: inherit; opacity: .75; }
.nav .badge.pr { background: var(--accent-soft); color: var(--accent-tx); }
@media (max-width: 640px) { .pr-acts .sep { display: none; } }
.alert .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.alert .ico svg { width: 13px; height: 13px; }
.alert.crit .ico { background: var(--crit-soft); color: var(--crit); }
.alert.warn .ico { background: var(--warn-soft); color: var(--warn); }
.alert.info .ico { background: var(--accent-soft); color: var(--accent); }
.alert small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* clients */
.clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.client { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; text-align: left; transition: transform .2s, border-color .2s, box-shadow .2s; }
.client-f { display: block; margin-top: 10px; font-size: 12px; font-weight: 500; color: var(--accent-tx); }
.client[aria-pressed="true"] .client-f { color: var(--fg-2); }
.client:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--glow); }
.client[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.client-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.client-h b { font-weight: 600; font-size: 15px; }
.client-h span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.client dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
.client dt { font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.client dd { margin: 0; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* bars */
.hb { display: flex; flex-direction: column; gap: 10px; }
.hb-r { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.hb-t { height: 10px; background: var(--sunken); border-radius: 0 4px 4px 0; overflow: hidden; }
.hb-t i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; min-width: 72px; }

.meter { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; min-width: 70px; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.meter.low i { background: var(--warn); }
.meter.out i { background: var(--crit); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .axis-l { stroke: var(--line-strong); stroke-width: 1; }
.chart .tk { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.chart .xh { stroke: var(--line-strong); stroke-width: 1; }
.chart-note { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--fg-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 2px; border-radius: 2px; }
.legend i.box { width: 9px; height: 9px; border-radius: 2px; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 150px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px;
}
.tip .tt { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
.tip .tr { display: flex; align-items: center; gap: 8px; }
.tip .tr + .tr { margin-top: 4px; }
.tip .tr i { width: 12px; height: 2px; border-radius: 2px; flex: none; }
.tip .tr b { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .tr span { color: var(--muted); margin-left: auto; padding-left: 10px; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut .chart { width: 168px; flex: none; }
.donut-leg { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 150px; }
.donut-leg div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 12.5px; }
.donut-leg i { width: 9px; height: 9px; border-radius: 2px; align-self: center; }
.donut-leg b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.donut-leg small { grid-column: 2 / 4; color: var(--muted); font-family: var(--f-mono); font-size: 11px; margin-top: -6px; }

/* breakdown list */
.ledger { display: flex; flex-direction: column; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.ledger div:last-child { border-bottom: 0; }
.ledger span { color: var(--fg-2); }
.ledger b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.ledger .total { border-top: 1px solid var(--line-strong); border-bottom: 0; padding-top: 10px; margin-top: 4px; }
.ledger .total span, .ledger .total b { color: var(--fg); font-weight: 600; }
.ledger span small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.ledger .lk { cursor: pointer; border-radius: 6px; }
.ledger .lk:hover span { color: var(--fg); }
.ledger .lk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ldg-h { margin: 4px 0 2px; font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ldg-h + .ledger { margin-bottom: 14px; }
.inv-res { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.inv-res div { background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.inv-res span { font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.inv-res b { font: 600 16px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
@media (max-width: 720px) { .inv-res { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.inv-res.cta-res { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.inv-res.cta-res b { font-size: 17px; }
.inv-res.cta-res small { font-size: 11.5px; color: var(--muted); }
@media (max-width: 520px) { .inv-res.cta-res { grid-template-columns: 1fr; } }
.cta-mov { min-width: 200px; }
.cta-ln > span:first-child { min-width: 0; }
.cta-ln .num { white-space: nowrap; }
.cta-items { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; padding: 6px 8px; border-radius: 7px; background: var(--sunken); font-size: 11.5px; color: var(--fg-2); }
.cta-ln { display: flex; justify-content: space-between; gap: 12px; }
.cta-ln i { font-style: normal; color: var(--muted); }

/* ---------- drawer & forms ---------- */
.drawer { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr) min(600px, 100%); }
.drawer .scrim { background: var(--scrim); }
.panel { background: var(--surface); display: flex; flex-direction: column; min-height: 0; height: 100vh; height: 100dvh; border-left: 1px solid var(--line); box-shadow: var(--shadow); }
.panel > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 14px; border-bottom: 1px solid var(--line); border-top: 3px solid var(--brand); }
.panel > header h2 { font-size: 20px; font-weight: 600; font-variation-settings: "wdth" 110; margin-top: 4px; }
.panel-b { flex: 1; overflow-y: auto; padding: 18px 22px 26px; display: flex; flex-direction: column; gap: 16px; }
/* Que nada dentro del panel se aplaste (las tablas con scroll quedaban en cero de alto): el panel es el que hace scroll. */
.panel-b > * { flex-shrink: 0; }
.panel > footer { display: flex; gap: 8px; align-items: center; padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface-2); }
.panel > footer .sp { flex: 1; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .line input, .line select, .pago input, .pago select {
  width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); font-size: 13.5px; min-width: 0;
}
.field textarea { height: auto; min-height: 64px; padding: 9px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .line input:focus, .line select:focus, .pago input:focus, .pago select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field input.money, .field input.qty, .line input.money, .line input.qty, .pago input.money, .pago input.qty { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; }
.form-sec h4 { margin: 0; font-size: 13px; font-weight: 600; }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.line.m-sale { grid-template-columns: minmax(0, 2.4fr) minmax(0, .8fr) minmax(0, 1.2fr) 34px; }
.line.m-bbv { grid-template-columns: minmax(0, 2fr) minmax(0, .7fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 34px; }
.line.m-dmg { grid-template-columns: minmax(0, 2.4fr) minmax(0, .8fr) 34px; }
.line .lsub { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.line .field > label { font-size: 9.5px; }
.pagos { display: flex; flex-direction: column; gap: 8px; }
.pago { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 8px; }
.pago.mprecio { grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr) 34px; }
.totals { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.form-err { color: var(--crit); font-size: 13px; background: var(--crit-soft); padding: 9px 12px; border-radius: 8px; }
.note { font-size: 12.5px; color: var(--fg-2); background: var(--sunken); border-radius: 9px; padding: 10px 12px; }

.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); border-left: 4px solid var(--brand);
  max-width: calc(100vw - 32px);
}
.loading { opacity: .55; transition: opacity .2s; }

/* Entrada suave al cambiar de sección */
#view.enter > * { animation: rise .42s cubic-bezier(.2, .7, .2, 1) both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; }
#view.enter > *:nth-child(3) { animation-delay: .08s; }
#view.enter > *:nth-child(4) { animation-delay: .12s; }
#view.enter > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.drawer:not([hidden]) .panel { animation: slide .28s cubic-bezier(.2, .7, .2, 1); }
.drawer:not([hidden]) .scrim { animation: fade .28s ease; }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- Bandeja: propuestas de los agentes para aprobar ---------- */

<!-- =========================================================================
     Equipo: oficina 3D de los agentes (puente de mando).
     Lee las colecciones "agentes" (una ficha y estado por agente) y
     "agentesActividad" (bitácora). Cada corrida escribe ahí su progreso
     y la oficina lo anima en vivo. Esta vista solo lee.
     ========================================================================= -->
<style>
/* Puente de mando: un solo mundo oscuro a propósito (negro con naranja y verde de la marca), igual en tema claro y oscuro. */
.of {
  --of-bg: #020403;
  --of-ink: #E8EFEA;
  --of-ink-2: #A9B8AE;
  --of-dim: #6F8277;
  --of-or: #FF8A3D;
  --of-or-d: #D46A1F;
  --of-gr: #58C285;
  --of-gr-d: #25372B;
  --of-amber: #F2B13D;
  --of-crit: #FF5A4E;
  --of-line: rgba(88, 194, 133, .22);
  --of-line-or: rgba(255, 138, 61, .45);
  --of-glass: rgba(4, 9, 6, .78);
  --of-glass-2: rgba(10, 20, 14, .9);
  position: fixed; inset: 0; z-index: 400; overflow: hidden;
  background: var(--of-bg); color: var(--of-ink); color-scheme: dark;
  font-family: var(--f-ui, "Archivo", system-ui, sans-serif);
  -webkit-font-smoothing: antialiased; font-variation-settings: "wdth" 100;
}
.of * { box-sizing: border-box; }
.of :focus-visible { outline: 2px solid var(--of-or); outline-offset: 2px; }
.of button { font: inherit; color: inherit; }
.of-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.of-cv.drag { cursor: grabbing; }
.of-vign { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(130% 100% at 50% 50%, transparent 62%, rgba(0, 0, 0, .55) 100%),
    linear-gradient(180deg, rgba(0, 0, 0, .45) 0, transparent 22%, transparent 78%, rgba(0, 0, 0, .5) 100%); }
.of-mono { font-family: var(--f-mono, "JetBrains Mono", ui-monospace, monospace); font-variant-numeric: tabular-nums; }

/* Barra superior */
.of-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 0; pointer-events: none; }
.of-top > * { pointer-events: auto; }
.of-id { display: flex; gap: 12px; align-items: center; min-width: 0; }
.of-id svg { width: 34px; height: 38px; flex: none; }
.of-eb { font-family: var(--f-mono, monospace); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--of-or); }
.of-id h2 { margin: 2px 0 0; font-size: 21px; line-height: 1.1; font-weight: 720; letter-spacing: .03em; text-transform: uppercase; font-variation-settings: "wdth" 125; text-wrap: balance; }
.of-right { display: flex; gap: 10px; align-items: flex-start; }
.of-luz { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--of-line); background: rgba(2, 4, 3, .62); border-radius: 4px; align-self: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.of-luz button { border: 0; background: transparent; padding: 6px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; letter-spacing: .06em; color: var(--of-ink-2); }
.of-luz button[aria-pressed="true"] { background: var(--of-or-d); color: #fff; }
.of-set { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; align-self: center; border: 1px solid rgba(255, 59, 48, .5); background: rgba(40, 6, 4, .6); border-radius: 4px; color: #ffdcd8; font-size: 11px; letter-spacing: .06em; text-decoration: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .15s, border-color .15s; }
.of-acc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.of-acc button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--of-line); background: rgba(2, 4, 3, .62); border-radius: 3px; cursor: pointer; font-size: 11px; letter-spacing: .05em; color: var(--of-ink-2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color .15s, color .15s; }
.of-acc button:hover { border-color: var(--of-or); color: var(--of-ink); }
.of-acc button[aria-pressed="true"] { border-color: var(--of-or); color: #fff; background: rgba(212, 106, 31, .32); }
.of-acc button[data-of="sonido"][aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
.of-acc svg { width: 13px; height: 13px; flex: none; }
.of-meta { margin-top: 10px; width: 270px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.of-meta label { font-size: 11px; color: var(--of-ink-2); }
.of-meta input { height: 34px; padding: 0 10px; border: 1px solid var(--of-line); background: rgba(0, 0, 0, .45); color: var(--of-ink); border-radius: 3px; font: inherit; font-size: 14px; }
.of-meta .row { display: flex; gap: 8px; margin-top: 6px; }
.of-btn.ghost { background: transparent; border-color: var(--of-line); }
.of-meta-msg { font-size: 12px; color: var(--of-gr); min-height: 1em; margin: 0; }
.of-cele { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 40px; text-align: center; pointer-events: none; background: radial-gradient(closest-side, rgba(40, 14, 2, .78), rgba(40, 14, 2, 0)); animation: of-cele .9s cubic-bezier(.2, 1.6, .4, 1); }
.of-cele b { font-size: clamp(34px, 6vw, 76px); line-height: 1; font-weight: 800; color: #FFD27A; text-shadow: 0 0 26px rgba(255, 138, 61, .85); font-variant-numeric: tabular-nums; }
.of-cele span:last-child { font-size: 15px; color: #fff; }
@keyframes of-cele { from { transform: translateX(-50%) scale(.55); opacity: 0; } }
.of-cine { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

    for (let i = 0, k = 0; i < nH && k < 9000; k++) {
      const ang = rnd() * Math.PI * 2, rad = 17 + rnd() * 26;
      const x = Math.cos(ang) * rad * 1.15, z = Math.sin(ang) * rad;
      if (Math.abs(x) < 15 && z > -11 && z < 15) continue;
      if (Math.abs(distVia(x, z) - 1) * VIA.a < 2.6 || (Math.abs(x) < 2 && z > 9)) continue;
      if (enLoteCorte(x, z)) continue;
      const s = .5 + rnd() * .9;
      m4.compose(ps.set(x, alturaTerreno(x, z) - .05, z), q.setFromEuler(e.set(0, rnd() * 6, 0)), sc.set(s, s * (.8 + rnd() * .5), s)); hel.setMatrixAt(i, m4);
      cc.setHSL(.25 + rnd() * .08, .45, .2 + rnd() * .1).convertSRGBToLinear(); hel.setColorAt(i, cc);
      i++;
    }
    hel.castShadow = alto; scene.add(hel);
    const nB = alto ? 220 : 90;
    const arb = new T.InstancedMesh(new T.IcosahedronGeometry(1, 1), new T.MeshStandardMaterial({ color: 0xffffff, roughness: .9 }), nB);
    for (let i = 0, k = 0; i < nB && k < 9000; k++) {
      const ang = rnd() * Math.PI * 2, rad = 18 + rnd() * 20;
      const x = Math.cos(ang) * rad * 1.15, z = Math.sin(ang) * rad;
      if (Math.abs(x) < 15 && z > -11 && z < 15) continue;
      if (Math.abs(distVia(x, z) - 1) * VIA.a < 2.8 || (Math.abs(x) < 2 && z > 9)) continue;
      if (enLoteCorte(x, z)) continue;
      const s = .5 + rnd() * 1.2;
      m4.compose(ps.set(x, alturaTerreno(x, z) + s * .2, z), q.setFromEuler(e.set(0, rnd() * 6, 0)), sc.set(s * 1.3, s * .75, s * 1.15)); arb.setMatrixAt(i, m4);
      cc.setHSL(.26 + rnd() * .07, .38, .15 + rnd() * .08).convertSRGBToLinear(); arb.setColorAt(i, cc);
      i++;
    }
    arb.castShadow = alto; scene.add(arb);

    // Pasto alto alrededor del edificio.
    const nP = alto ? 2600 : 700;
    const pg = new T.ConeGeometry(.035, .55, 3); pg.translate(0, .27, 0);
    const pasto = new T.InstancedMesh(pg, conViento(new T.MeshStandardMaterial({ color: 0xffffff, roughness: 1 })), nP);
    for (let i = 0, k = 0; i < nP && k < 30000; k++) {
      const x = (rnd() - .5) * 64, z = (rnd() - .5) * 56;
      if (Math.abs(x) < 14.4 && z > -10.2 && z < 12.6) continue;
      if (Math.abs(x) < 1.8 && z > 9) continue;
      if (Math.abs(distVia(x, z) - 1) * VIA.a < 2.4) continue;
      const s = .45 + rnd() * 1.1;
      m4.compose(ps.set(x, alturaTerreno(x, z) - .04, z), q.setFromEuler(e.set((rnd() - .5) * .5, rnd() * 6, (rnd() - .5) * .5)), sc.set(s, s, s)); pasto.setMatrixAt(i, m4);
      cc.setHSL(.22 + rnd() * .08, .45, .24 + rnd() * .12).convertSRGBToLinear(); pasto.setColorAt(i, cc);
      i++;
    }
    scene.add(pasto);

    // Rocas con musgo.
    for (let i = 0; i < 18; i++) {
      const ang = rnd() * 6.28, r = 16 + rnd() * 10, s = .35 + rnd() * 1.1, x = Math.cos(ang) * r * 1.2, z = Math.sin(ang) * r;
      if (Math.abs(distVia(x, z) - 1) * VIA.a < 3 || (Math.abs(x) < 2.5 && z > 9)) continue;
      fijo(new T.DodecahedronGeometry(1, 1), std(0x5f625b, { roughness: .92 }), scene, [x, alturaTerreno(x, z) + s * .15, z], [rnd(), rnd() * 6, rnd()], [s * 1.3, s * .65, s]);
    }

    // Cordilleras lejanas en capas: entre más lejos, más se pierden en la bruma.
    LUZ.cordilleras = [];
    [[300, 26, 20, 0x26392c, .3, 1.2], [420, 48, 30, 0x2c4537, .5, 2.7], [580, 78, 42, 0x3d5a52, .7, 4.1]].forEach(([radio, base, amp, hex, k, semi]) => {
      const N = 220, pos = [], idx = [];
      for (let i = 0; i <= N; i++) {
        const a = i / N * Math.PI * 2;
        const h = base + amp * (.5 * Math.sin(a * 3 + semi) + .28 * Math.sin(a * 7 + semi * 2) + .14 * Math.sin(a * 17 + semi * 3) + .08 * Math.sin(a * 41 + semi));
        const x = Math.sin(a) * radio, z = Math.cos(a) * radio;
        pos.push(x, -40, z, x, h, z);
        if (i < N) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2);
      }
      const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
      const m = new T.Mesh(g, new T.MeshBasicMaterial({ color: col(hex), fog: false, side: T.DoubleSide }));
      m.renderOrder = -1; scene.add(m);
      LUZ.cordilleras.push({ m, base: col(hex), k });
    });

    // Bruma entre los árboles (se nota más en la mañana y al atardecer).
    const nb = document.createElement('canvas'); nb.width = nb.height = 128; const bx = nb.getContext('2d');
    for (let i = 0; i < 14; i++) {
      const g = bx.createRadialGradient(20 + rnd() * 88, 40 + rnd() * 48, 0, 64, 64, 30 + rnd() * 34);
      g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); bx.fillStyle = g; bx.fillRect(0, 0, 128, 128);
    }
    const bt = new T.CanvasTexture(nb);
    LUZ.bruma = [];
    for (let i = 0; i < (alto ? 22 : 10); i++) {
      const ang = rnd() * 6.28, r = 36 + rnd() * 90;
      const sp = new T.Sprite(new T.SpriteMaterial({ map: bt, color: 0xffffff, transparent: true, opacity: .5, depthWrite: false, fog: true }));
      sp.position.set(Math.cos(ang) * r, alturaTerreno(Math.cos(ang) * r, Math.sin(ang) * r) + 2 + rnd() * 5, Math.sin(ang) * r);
      sp.scale.set(40 + rnd() * 40, 9 + rnd() * 7, 1); sp.userData.v = .3 + rnd() * .5; sp.userData.x0 = sp.position.x;
      scene.add(sp); LUZ.bruma.push(sp);
    }
  }

  /* ---------- cielo y luz ---------- */
  function cieloYLuz() {
    if (T.Sky) {
      LUZ.sky = new T.Sky(); LUZ.sky.scale.setScalar(4500); scene.add(LUZ.sky);
      const u = LUZ.sky.material.uniforms; u.turbidity.value = 7; u.rayleigh.value = 1.4; u.mieCoefficient.value = .006; u.mieDirectionalG.value = .78;
    } else {
      LUZ.fondo = mesh(new T.SphereGeometry(900, 24, 12), new T.MeshBasicMaterial({ map: texGradiente([[0, '#6f9fc7'], [.5, '#cfe0d8'], [1, '#2a3a2f']]), side: T.BackSide, fog: false }), scene);
    }
    const sp = []; for (let i = 0; i < 1600; i++) { const th = Math.random() * 6.28, ph = Math.acos(Math.random() * .92 + .06); sp.push(1400 * Math.sin(ph) * Math.cos(th), 1400 * Math.cos(ph), 1400 * Math.sin(ph) * Math.sin(th)); }
    const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.Float32BufferAttribute(sp, 3));
    LUZ.estrellas = new T.Points(sg, new T.PointsMaterial({ color: 0xdfeee5, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
    scene.add(LUZ.estrellas);
    scene.fog = new T.FogExp2(0xbfd0c8, .0045);
    LUZ.hemi = new T.HemisphereLight(0xcfe6ff, 0x2a3a22, .6); scene.add(LUZ.hemi);
    LUZ.sol = new T.DirectionalLight(0xfff1dc, 2.2);
    LUZ.sol.castShadow = Q === 'high';
    if (Q === 'high') {
      const c = LUZ.sol.shadow.camera; c.left = -20; c.right = 20; c.top = 20; c.bottom = -20; c.near = 1; c.far = 140;
      LUZ.sol.shadow.mapSize.set(4096, 4096); LUZ.sol.shadow.bias = -.0006; LUZ.sol.shadow.normalBias = .06;
    }
    scene.add(LUZ.sol, LUZ.sol.target);
    LUZ.interior = [[0, 3.8, .4], [-7, 3.8, -3], [7, 3.8, -3], [0, 3.8, -6]].map(p => { const l = new T.PointLight(0xffd9a8, .5, 16, 1.6); l.position.set(p[0], p[1], p[2]); scene.add(l); return l; });
    LUZ.vSol = new T.Vector3();
  }
  function horaBogota() {
    try { const s = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()).split(':'); return +s[0] + (+s[1]) / 60; } catch { return new Date().getHours(); }
  }
  function aplicarLuz() {
    const h = luzModo === 'dia' ? 10.5 : (luzModo === 'noche' || luzModo === 'tormenta') ? 21.5 : luzModo === 'tarde' ? 17.55 : horaBogota();
    const elev = 72 * Math.sin(Math.PI * (h - 6) / 12);
    const dia = clamp((elev + 4) / 22, 0, 1);
    const phi = T.MathUtils.degToRad(90 - Math.max(elev, -10)), theta = T.MathUtils.degToRad(110 - 160 * clamp((h - 6) / 12, 0, 1));
    LUZ.vSol.setFromSphericalCoords(1, phi, theta);
    if (LUZ.sky) { const u = LUZ.sky.material.uniforms; u.sunPosition.value.copy(LUZ.vSol); u.rayleigh.value = 1.2 + (1 - dia) * 2; }
    if (LUZ.fondo) LUZ.fondo.material.color.setScalar(.12 + .88 * dia);
    const dir = elev > 2 ? LUZ.vSol : new T.Vector3(-.4, .8, .45).normalize();
    LUZ.sol.position.copy(dir).multiplyScalar(70); LUZ.sol.target.position.set(0, 0, 0);
    LUZ.sol.intensity = elev > 2 ? .4 + 2.3 * dia : .1;
    LUZ.sol.color.copy(elev > 2 ? new T.Color().setHSL(.09, .55 - .35 * dia, .72 + .2 * dia) : new T.Color(0x8fb0ff));
    LUZ.hemi.intensity = .06 + .67 * dia;
    LUZ.hemi.color.setHSL(.58, .4, .55 + .3 * dia);
    scene.fog.color.copy(new T.Color(0x070b10).lerp(new T.Color(0xbfd0c8), dia));
    scene.fog.density = .0045 + (1 - dia) * .004;
    LUZ.estrellas.material.opacity = (1 - dia) * .95;
    LUZ.interior.forEach(l => { l.intensity = .35 + (1 - dia) * 1.1; });
    R.toneMappingExposure = .7 + .22 * dia;
    LUZ.dia = dia;
    const fc = scene.fog.color;
    (LUZ.cordilleras || []).forEach(c => { c.m.material.color.copy(c.base).multiplyScalar(.22 + .78 * dia).lerp(fc, c.k); });
    const neblina = clamp(1 - Math.abs(dia - .45) * 1.7, 0, 1);
    (LUZ.bruma || []).forEach(b => { b.material.opacity = .1 + .32 * neblina; b.material.color.setScalar(.2 + .8 * dia); });
    if (luciernagas) luciernagas.material.opacity = (1 - dia) * .9;
    aves.forEach(a => { a.g.visible = dia > .4; });
    // Atardecer naranja (a la hora real o con el botón) y tormenta con lluvia y rayos.
    const tarde = elev > 0 && (luzModo === 'tarde' || (luzModo === 'ahora' && h > 16.4 && h < 18.4));
    if (LUZ.sky) { const u = LUZ.sky.material.uniforms; u.turbidity.value = tarde ? 13 : 7; u.mieCoefficient.value = tarde ? .014 : .006; if (tarde) u.rayleigh.value = 3.4; }
    if (tarde) {
      LUZ.sol.color.setHSL(.06, .95, .6); LUZ.sol.intensity = 2.6;
      LUZ.hemi.color.setHSL(.07, .55, .62);
      scene.fog.color.lerp(new T.Color(0xe08a4f), .55);
      R.toneMappingExposure = .86;
    }
    const torm = luzModo === 'tormenta';
    if (torm) {
      scene.fog.color.set(0x0a0d12); scene.fog.density = .016; LUZ.estrellas.material.opacity = 0; LUZ.hemi.intensity = .05; LUZ.sol.intensity = .05;
      if (LUZ.sky) LUZ.sky.material.uniforms.rayleigh.value = .3;
      aves.forEach(a => { a.g.visible = false; });
    }
    LUZ.hemiBase = LUZ.hemi.intensity; LUZ.fogBase = scene.fog.color.clone();
    const madrugada = clamp(1 - Math.abs(h - 6.8) / 2.2, 0, 1), ocaso = clamp(1 - Math.abs(h - 17.8) / 1.6, 0, 1);
    CLIMA.k = torm ? .55 : luzModo === 'dia' ? .12 : Math.max(.18, madrugada * .85, ocaso * .5, (1 - dia) * .3);
  }

  /* ---------- edificio ---------- */
  function edificio() {
    const ANCHO = 26, FONDO = 18, ALTO = 4.6, x0 = ANCHO / 2, z0 = FONDO / 2;
    // Losa y piso de ciprés.
    fijo(G.box, M.concreto, scene, [0, -.29, 0], null, [ANCHO + .8, .5, FONDO + .8]);
    mesh(new T.PlaneGeometry(ANCHO, FONDO), M.piso, scene, [0, .01, 0], [-Math.PI / 2, 0, 0]).castShadow = false;
    // Terraza de madera al frente.
    fijo(G.box, M.maderaOsc, scene, [0, -.08, z0 + 2.2], null, [12, .16, 3.6]);
    for (let i = 0; i < 2; i++) fijo(G.box, M.maderaOsc, scene, [0, -.2 - i * .12, z0 + 4.2 + i * .45], null, [6, .12, .45]);
    // Pared del fondo: concreto afuera, listones de ciprés por dentro.
    fijo(G.box, M.concreto, scene, [0, ALTO / 2, -z0 - .15], null, [ANCHO + .8, ALTO, .3]);
    const nL = 150;
    const list = new T.InstancedMesh(G.box, M.listones, nL);
    const m4 = new T.Matrix4(), q = new T.Quaternion(), ps = new T.Vector3(), sc = new T.Vector3(), cc = new T.Color();
    for (let i = 0; i < nL; i++) {
      m4.compose(ps.set(-x0 + .09 + i * (ANCHO - .18) / (nL - 1), ALTO / 2, -z0 + .06), q, sc.set(.07, ALTO, .1)); list.setMatrixAt(i, m4);
      cc.setHSL(.075, .42, .5 + rnd() * .09); list.setColorAt(i, cc);
    }
    list.receiveShadow = true; scene.add(list);
    // Vidrio en los otros tres lados, con parales negros.
    const vidrio = (w, pos, ry) => { const m = new T.Mesh(new T.PlaneGeometry(w, ALTO - .1), M.vidrio); m.position.set(pos[0], ALTO / 2, pos[2]); m.rotation.y = ry; m.renderOrder = 2; scene.add(m); };
    vidrio(ANCHO, [0, 0, z0], 0); vidrio(FONDO, [-x0, 0, 0], Math.PI / 2); vidrio(FONDO, [x0, 0, 0], Math.PI / 2);
    for (let i = 0; i <= 12; i++) { const x = -x0 + i * ANCHO / 12; fijo(G.box, M.metalNegro, scene, [x, ALTO / 2, z0], null, [.09, ALTO, .14]); if (i % 12) fijo(G.box, M.ledV, scene, [x, ALTO / 2, z0 - .075], null, [.016, ALTO - .5, .01]); }
    // Líneas de luz en el piso, a lo largo del vidrio.
    fijo(G.box, M.ledN, scene, [0, .018, z0 - .35], null, [ANCHO - .7, .006, .028]);
    fijo(G.box, M.ledN, scene, [-x0 + .35, .018, 0], null, [.028, .006, FONDO - .7]);
    fijo(G.box, M.ledN, scene, [x0 - .35, .018, 0], null, [.028, .006, FONDO - .7]);
    for (let i = 0; i <= 8; i++) { const z = -z0 + i * FONDO / 8; fijo(G.box, M.metalNegro, scene, [-x0, ALTO / 2, z], null, [.14, ALTO, .09]); fijo(G.box, M.metalNegro, scene, [x0, ALTO / 2, z], null, [.14, ALTO, .09]); if (i > 0 && i < 8) { fijo(G.box, M.ledV, scene, [-x0 + .075, ALTO / 2, z], null, [.01, ALTO - .5, .016]); fijo(G.box, M.ledV, scene, [x0 - .075, ALTO / 2, z], null, [.01, ALTO - .5, .016]); } }
    [[0, z0, ANCHO, 0], [-x0, 0, FONDO, 1], [x0, 0, FONDO, 1]].forEach(([x, z, l, rot]) => {
      fijo(G.box, M.metalNegro, scene, [x, .05, z], [0, rot ? Math.PI / 2 : 0, 0], [l, .1, .16]);
    });
    // Puerta de entrada (vidrio con manija).
    fijo(G.box, M.metal, scene, [.5, 1.1, z0 + .1], null, [.04, .8, .04]); fijo(G.box, M.metal, scene, [-.5, 1.1, z0 + .1], null, [.04, .8, .04]);
    // Techo: se ve desde adentro; desde arriba se ve la oficina (vista en corte).
    const techoMat = new T.MeshStandardMaterial({ map: texTecho(), roughness: .75 });
    const techo = mesh(new T.PlaneGeometry(ANCHO + 3, FONDO + 3), techoMat, scene, [0, ALTO, 0], [Math.PI / 2, 0, 0]); techo.castShadow = false;
    techo.material.map.repeat.set(1, 1); techo.material.map.wrapS = T.RepeatWrapping;
    techo.material.map.repeat.set(36, 1);
    // Borde del techo (alero) y vigas de madera laminada.
    [[0, z0 + 1.5, ANCHO + 3.3, 0], [0, -z0 - 1.5, ANCHO + 3.3, 0], [-x0 - 1.5, 0, FONDO + 3, 1], [x0 + 1.5, 0, FONDO + 3, 1]].forEach(([x, z, l, rot]) => {
      fijo(G.box, M.metalNegro, scene, [x, ALTO + .18, z], [0, rot ? Math.PI / 2 : 0, 0], [l, .42, .14]);
    });
    // Vigas de madera laminada: se ven desde adentro; desde arriba se esconden para ver la oficina.
    vigas = new T.Group(); scene.add(vigas);
    for (let i = 0; i < 7; i++) mesh(G.box, M.maderaOsc, vigas, [-x0 + 2 + i * (ANCHO - 4) / 6, ALTO - .22, 0], null, [.22, .42, FONDO]).castShadow = false;
    [[-x0, z0], [x0, z0], [-x0, -z0 + .2], [x0, -z0 + .2]].forEach(([x, z]) => fijo(G.box, M.maderaOsc, scene, [x, ALTO / 2, z], null, [.32, ALTO, .32]));

    // Pared de marca: panel verde con el logo en 3D iluminado.
    fijo(G.box, M.verdeMarca, scene, [0, 2.45, -z0 + .2], null, [11.6, 3.3, .14]);
    [[0, .82, 11.6, .05], [0, 4.08, 11.6, .05], [-5.8, 2.45, .05, 3.3], [5.8, 2.45, .05, 3.3]].forEach(([x, y, w, h]) => fijo(G.box, M.ledN, scene, [x, y, -z0 + .29], null, [w, h, .03]));
    const lg = letrero(scene, 9.6, M.logoBlanco, M.logoNaranja); lg.position.set(0, 2.45 - (lg.userData.alto || 3) / 2, -z0 + .3);
    // Borde de luz naranja alrededor del techo.
    fijo(G.box, M.ledN, scene, [0, ALTO - .05, z0 + 1.58], null, [ANCHO + 3.2, .03, .03]);
    fijo(G.box, M.ledN, scene, [-x0 - 1.58, ALTO - .05, 0], null, [.03, .03, FONDO + 3]);
    fijo(G.box, M.ledN, scene, [x0 + 1.58, ALTO - .05, 0], null, [.03, .03, FONDO + 3]);
    // Pantallas grandes a los lados del logo.
    const muro = (x) => {
      const { c, x: cx } = lienzo(1024, 576);
      const tex = texHD(c); const o = { cx, tex };
      fijo(G.box, M.metalNegro, scene, [x, 2.4, -z0 + .18], null, [5.1, 3, .1]);
      const m = mesh(new T.PlaneGeometry(4.9, 2.76), new T.MeshBasicMaterial({ map: tex, color: PANT(), toneMapped: false }), scene, [x, 2.4, -z0 + .24]); m.castShadow = false;
      return o;
    };
    const muroVideo = (x) => {
      const esc = Q === 'high' ? 1920 / 1024 : 1024 / 1024;
      const c = document.createElement('canvas'); c.width = Math.round(1024 * esc); c.height = Math.round(576 * esc);
      const cx = c.getContext('2d'); cx.setTransform(esc, 0, 0, esc, 0, 0);
      const tex = texHD(c);
      fijo(G.box, M.metalNegro, scene, [x, 2.4, -z0 + .18], null, [5.1, 3, .1]);
      fijo(G.box, M.ledN, scene, [x, .88, -z0 + .24], null, [4.9, .02, .02]);
      const m = mesh(new T.PlaneGeometry(4.9, 2.76), new T.MeshBasicMaterial({ map: tex, color: PANT(), toneMapped: false }), scene, [x, 2.4, -z0 + .24]); m.castShadow = false;
      return { cx, tex, esc };
    };
    muroIzq = muro(-9.3); muroDer = muroVideo(9.3);

    // Lámpara circular grande sobre la mesa de mando + anillo naranja.
    const aro = mesh(new T.TorusGeometry(3.6, .028, 8, 120), basic(0xd9cdb9), scene, [CENTRO.x, 3.75, CENTRO.z], [Math.PI / 2, 0, 0]); aro.castShadow = false;
    const aro2 = mesh(new T.TorusGeometry(2.3, .02, 8, 100), basic(0xb8622a), scene, [CENTRO.x, 3.55, CENTRO.z], [Math.PI / 2, 0, 0]); aro2.castShadow = false;
    for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; fijo(G.cyl8, M.metalNegro, scene, [CENTRO.x + Math.cos(a) * 3.6, 4.18, CENTRO.z + Math.sin(a) * 3.6], null, [.008, .85, .008]); }
    // Lámparas lineales sobre los puestos laterales.
    [[-8.6, -1.5], [8.6, -1.5], [-6.2, 4.6], [6.2, 4.6]].forEach(([x, z]) => {
      fijo(G.box, M.metalNegro, scene, [x, 3.6, z], [0, x * z > 0 ? .5 : -.5, 0], [2.6, .06, .14]);
      fijo(G.box, M.ledB, scene, [x, 3.565, z], [0, x * z > 0 ? .5 : -.5, 0], [2.5, .01, .1]);
      fijo(G.cyl8, M.metalNegro, scene, [x, 4.1, z], null, [.006, 1, .006]);
    });

    // Sala de espera (adelante a la izquierda).

    p.brazos.forEach(b => b.codo.rotation.set(-.3 - Math.abs(sw) * .25, 0, 0));
